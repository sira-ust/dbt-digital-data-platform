name: ust_digital_platform

version: 1.0.0

config-version: 2



profile: ust_digital_platform



model-paths: ["models"]

analysis-paths: ["analyses"]

test-paths: ["tests"]

seed-paths: ["seeds"]

macro-paths: ["macros"]



clean-targets:

  - target

  - dbt_packages

vars:
  # Order-cycle heuristic — decided 2026-07-08, holds until the app team stamps
  # increment_id onto cart events (then cycles switch to exact order grouping).
  cycle_gap_minutes: 60       # gap that ends an activity burst
  cycle_abandon_days: 7       # open cycle with no activity this long = abandoned
  churn_consecutive_weeks: 3  # removes > adds this many weeks running = churn signal

  # mart_rep_customer_activity — a rep's stop at one customer. Deliberately TIGHTER
  # than cycle_gap_minutes (60): 60 min is tuned for "is this the same shopping
  # cycle", which survives a lunch break; a store visit does not. 30 min is long
  # enough to absorb a chat with the owner mid-order, short enough that drive
  # time to the next stop always splits the visit.
  activity_gap_minutes: 30

  # int_rep_customer_activity — BLE pairing moves the open cart from the iPad to
  # the PDA, so the iPad's own events arrive with no customer. Pairing has no
  # reliable end event (ZERO Unpair / Forget Device logged in August 2026), so
  # the window has to expire on its own; without this a single connect stayed
  # "paired" for 4,149 minutes. 60 min comfortably covers a store visit.
  ble_pairing_expiry_minutes: 60
  # how stale the paired PDA's open customer may be before we stop inheriting
  # it. 15 min already covers 96.7% of the affected cart edits; 60 matches the
  # pairing window so the two rules cannot disagree.
  ble_inherit_max_stale_minutes: 60
  # scope for tests/assert_no_cart_edit_loses_its_customer: 2026-05 is the first
  # month PDA cart edits carried the customer 100% of the time, so before it the
  # gaps are app-side history we cannot repair, not an attribution regression.
  ble_attribution_guard_from: '2026-05-01'

  # int_rep_customer_presence — matching rep GPS to a customer's address.
  # 100m matches the geofence Annie's sales-geo process already uses; keeping
  # them equal matters more than the exact number, so the two never disagree on
  # how many visits a rep made.
  presence_geofence_metres: 100
  presence_visit_gap_minutes: 20   # away from the store this long = a new visit
  # 0 = dwell no longer gates a visit; proximity alone decides. The 3-minute rule
  # assumed dense GPS sampling, but the PDA reports every 15-30 MINUTES, so a real
  # visit routinely lands ONE fix inside the geofence and can never span 3
  # contiguous minutes. Confirmed against rep 032's own account of his week: it
  # was discarding PHA001 (1 fix, 3 m), HOR006 (1 fix, 12 m), VAK002 (1 fix,
  # 30 m), JAY001 (2 fixes, 64 m) and PAN015 (3 fixes, 11 m) -- all real calls.
  # Restores ~14,800 visits over 6 months, of which ~79% show the rep stationary
  # (<5 mph through the geofence) and ~4% at 20 mph+, i.e. genuine drive-pasts
  # that this now admits. See presence_max_drive_through_mph below to gate those.
  presence_min_dwell_minutes: 0
  presence_max_mph: 80             # a faster hop is bad data, not travel
  # the company address, marked OFF001 in Annie's process. It is a row in the
  # customer table, so without this it becomes every rep's most-visited store.
  office_latitude: 37.6449309
  office_longitude: -122.1362259
  office_radius_metres: 150

  # ── evidence tiers for a visit ─────────────────────────────────────────────
  # A visit backed by a device record naming the customer needs no distance
  # help: the record is the proof, so the full geofence above applies. A visit
  # with NO such record rests on position alone, so the position has to be
  # better. 80 m is where the August 2026 population changes character: inside
  # it, no-activity visits average 11-25 min over 2-4 fixes; beyond it, 1.2-1.5
  # fixes and 2.7-5.4 min, i.e. drive-pasts. Measured over 4,967 no-activity
  # visits.
  presence_no_activity_max_metres: 80

  # arrived_at / departed_at are GPS SAMPLE times, not arrival and departure.
  # The device reports every ~16 min, so the rep was at the store before the
  # first fix and after the last, and work keyed in those minutes was being
  # labelled 'keyed elsewhere'. DEL009 on 2026-08-25 is one unbroken session,
  # 16:19:05-16:22:46, cut in two by a fix at 16:20:01; NEW057's whole session
  # (16:17:48-16:18:59) fell 62 s before its first fix and scored 0 on-site min.
  #
  # Applied PER EVENT, deliberately. Classifying per SESSION instead -- "any
  # overlap makes the whole session on-site" -- was tried and is wrong: rep 026's
  # JUN003 session on 2026-08-17 touches the window then runs 97 more events and
  # 496 MINUTES past departure, all of which would become on-site.
  #
  # 3 minutes because it covers both measured cases (56 s, 2 m 13 s) and is far
  # too short to absorb a driving leg. There is NO elbow in the distribution to
  # calibrate against -- events fall off smoothly (768 within 1 min, 1,948 within
  # 3, 3,429 within 8) -- so this is a judgement, not a measurement, and it is a
  # var so it can be revised against a rep's own account of a day.
  presence_edge_tolerance_minutes: 3

  # Test and internal customer rows. Filtering on the OFFICE RADIUS alone is not
  # enough: eleven of these geocode 4.6-25.5 km away ("123 Fake St, SAN
  # FRANCISCO", or literally "test"), so the radius never sees them. They score
  # no visits today only because Google happened to resolve those strings
  # somewhere no rep parks.
  # Matched on customer_key, never on customer_name: "THE LATEST SCOOP" contains
  # "TEST", and NIRVANA WAREHOUSE / ALBERTSONS CORPORATE OFFICE are real.
  test_customer_key_regex: '^ZZZ[0-9]'
  test_customer_keys: ['JDA01', 'OFF001', 'PMT001', 'UST001', 'YYY001']

  # system_event_log production go-live: event_at_utc is device time, so a
  # few rows carry clock-skewed dates before this — int_item_demand_daily
  # clamps to [go-live, now].
  event_log_go_live_date: '2026-01-22'

  # mart_item_demand_supply signal thresholds — starting points, tune against
  # real dashboard feedback. All counts are per item-week.
  demand_supply_min_demand_events: 10   # views+cart_adds needed to call a missed opportunity
  demand_supply_oos_min_days: 4         # zero-shippable snapshot days = "dry most of the week"
  demand_supply_promote_max_events: 2   # views+cart_adds at or below this + stock on hand = promote candidate
  demand_supply_trend_ratio: 1.5        # this week's views vs prior-4-week avg = trending
  demand_supply_trend_min_base_views: 5 # prior-4-week avg floor so tiny bases don't trend

  # dq_social_mentions thresholds
  social_sentiment_skew_warn_pct: 90    # warn if positive share of non-null sentiment exceeds this
  social_posted_at_floor_date: '2020-01-01'  # posted_at before this = implausible/suspect

  # fct_social_mentions filter — drop a mention as spam only when the model is at
  # least this confident, so a shaky spam call doesn't silently hide a real mention
  social_spam_confidence_min: 0.7

  # ── SOCIAL TRENDING BOARD ─────────────────────────────────────────────────────
  # int_social_concept_trends / mart_social_trending_items. Ranking is deterministic
  # (pure social signal, author-diversity based — see the v2 block below); the LLM only
  # labels mentions and resolves the top-N concepts to WMS SKUs, both offline.
  #
  # FIVE TIME WINDOWS govern this feature and they are INDEPENDENT. Three of them are
  # set here, one in resolve_trending_concepts.py, one is fixed by the grain. All five
  # are defined together, with their trade-offs, in models/docs/_social_windows.md —
  # read that before changing any of them:
  #   1 ranking     1 calendar week, complete weeks only   (fixed)
  #   2 comparison  strictly the preceding week            (fixed)
  #   3 retention   social_trend_history_weeks             <- below
  #   4 re-label    social_enrich_backfill_weeks           <- below
  #   5 snippets    SNIPPET_WINDOW_DAYS (resolver script)
  # The one thing to internalise: only #1 and #2 affect a published number. #3 is
  # chart length (proven not to move any rank), #4 and #5 are cost/quality controls on
  # the offline LLM steps.
  social_trend_history_weeks: 13     # (3) weeks of board history kept, ~3 months, ROLLING and
                                     # unarchived: week 14 arriving means week 1 is gone
  social_enrich_backfill_weeks: 4    # (4) weeks a PROMPT_VERSION bump re-labels. Week-aligned;
                                     # 0 = all history. Never re-label a PARTIAL week
  social_trend_top_n: 20             # trending items the mart shows PER CLASS PER WEEK
  social_trend_min_mentions: 2       # noise floor, per concept per WEEK. Bites harder at a 7-day
                                     # grain than a multi-week one: expect gaps in trajectories
  social_trend_link_count: 5         # source_links per concept-week, top links by reach then engagement
  social_resolve_min_confidence: 0.7 # below this, ANY match (carried/substitute/basket) is suppressed
                                     # (shown as none/source_new). Inventory wins only when confident — a
                                     # 0.45 carried guess (sushi -> corn oil) is dropped like a shaky basket.
  # TWO ranking classes, ranked SEPARATELY so a flood of viral dishes can't crowd
  # stockable items off the board (concept_class in int_social_concept_trends):
  #   'dish' <- mentioned_dishes   (Som Tam, Pho — what people talk about)
  #   'item' <- mentioned_products (Tiparos fish sauce, canned coconut milk, tom yum
  #             paste — SELLABLE goods a grocery or restaurant could order as a line
  #             item). The product/commodity judgment is made at EXTRACTION time
  #             (scripts/enrich_mentions.py prompt v2), not by filtering here: raw
  #             commodities and produce (durian, matcha, pork) stay in `ingredients`,
  #             which is never ranked but still feeds the resolver's basket side.
  #             Expect this board to be much thinner than the dish board — people
  #             post about dishes far more than about SKUs. seed_social_generic_terms
  #             remains as a BACKSTOP for commodity tokens that slip through.
  # Brands are still NOT ranked — that array is dominated by retailers / delivery
  # platforms / influencers / restaurants: unbounded, none stockable. The LLM
  # resolver still reads brand context from each concept's mention snippets.

  # trend_score v2 (distinct_authors_adj-based, replacing pure mention-volume
  # ranking) — see int_social_concept_trends. STARTING POINTS pending backtest,
  # same as the legacy weights above were never re-tuned after launch:
  social_trend_v2_engagement_weight: 5   # divisor on ln(1+engagement_norm); lower = quality moves rank more
  social_trend_v2_views_weight: 10       # divisor on ln(1+views_norm)
  social_trend_v2_min_channel_baseline_mentions: 10  # a channel's WEEKLY median needs at least this many
                                                     # mentions to be a baseline; below it, fall back to the
                                                     # channel's all-history median (a median over 2 rows is
                                                     # not a baseline, it's one of the two rows). Load-bearing
                                                     # at a 7-day grain — raise it if a channel is thin most
                                                     # weeks rather than trusting a 3-row median.
  social_trend_v2_single_channel_dampener: 0.85  # multiplier for channel_count < 2 (flag, not exclude —
                                                  # confirmed only ~5% of the actual top-20 is single-channel,
                                                  # so this is low-stakes either way; see Step 3 findings)
  # author_quality thresholds (named/non-anonymised authors only — see
  # int_social_concept_trends for why anonymised profiles can't use this test).
  # Judged on ONE calendar week now, so most concepts land on 'unverifiable' (which
  # stays ranked, flag visible) and the repeat_poster exclusion fires less often
  # than it did over a multi-week window — lower the floor if the anti-spam guard
  # needs to bite weekly:
  social_trend_v2_min_named_mentions: 5        # below this, too little signal to judge -> 'unverifiable'
  social_trend_v2_max_mentions_per_named_author: 3  # above this among named authors -> 'repeat_poster', excluded



# Layering:

#   staging/mysql/   view — 1:1 with MySQL tables (ust_website schema); local dev reads
#                    JSON via external_location; remove external_location when MySQL
#                    connection is available and add credentials to profiles.yml

#   seeds/           reference data (event dictionary, apps, categories)

#   intermediate/    view — enrichment + per-family payload parsing

#   marts/core/facts/   fct_* event-grain facts for BI drill-down

#   marts/reporting/    mart_* aggregated scorecards

#   dq/              audit tables + triage views

#   tests/           singular pipeline gate tests



models:

  ust_digital_platform:

    +persist_docs:

      relation: true

      columns: true



    staging:
      +materialized: view
      +schema: ust_staging
      mysql:
        # Blanket policy: staging is always a view. MySQL staging does only
        # cast/trim + a single row_number() dedupe over small website data —
        # recompute cost is near-zero even at fan-out 2, so no table needed.
        +materialized: view
        +tags: ["staging", "mysql"]
      jdawms:
        # Runs on both targets: databricks reads the real jdawmsrep replica;
        # duckdb reads mock parquet (data/mock/jdawmsrep/, generated by
        # scripts/generate_jdawms_mock.py — run it once before dbt build).
        +materialized: view
        +tags: ["staging", "jdawms", "wms"]
      # NAV ERP feed. Same Azure Blob ingestion as jdawms, but a separate source
      # system: lands in its own UC schema (navrep) under its own dbt source
      # (`nav`), so lineage/freshness/selection stay independent. duckdb reads
      # mock parquet from data/mock/navrep/.
      #
      nav:
        +materialized: view
        +tags: ["staging", "nav", "erp"]
      mentionlytics:
        # Social-listening feed. Weekly xlsx drop → parquet via
        # scripts/convert_mentionlytics.py (run before dbt build); duckdb globs
        # data/mock/mentionlytics/, databricks reads social.mentions. Staging is
        # a view that dedupes weekly files on mention_id (latest loaded_at wins).
        #
        # SEPARATE CADENCE: all mentionlytics models (staging/int/fct/dq) are
        # tagged 'social' and run WEEKLY, apart from the daily pipeline. The int
        # and fct models add config(tags=['social']) in-SQL so the whole group
        # selects together. Daily job: `dbt build --exclude tag:social`. Weekly
        # job (after parse + enrich populate social.*): `dbt build --select tag:social`.
        +materialized: view
        +tags: ["staging", "mentionlytics", "social"]



    intermediate:
      # Blanket policy: the intermediate layer is where the expensive, reused
      # work lives (payload parsing, timezone conversion, joins, complex dedupe),
      # and marts reuse it — so materialize as tables (compute once, read many).
      +materialized: table
      +schema: ust_intermediate
      +tags: ["intermediate"]



    marts:
      # Consumption layer. Event-grain facts and keyed/dated marts are
      # incremental (process new rows only, merge on the grain key). Lifetime
      # aggregates with no partition key stay full-refresh tables (set per-model).
      core:
        facts:
          +materialized: table
          +schema: ust_facts
          +tags: ["facts"]
      reporting:
        +materialized: table
        +schema: ust_reporting
        +tags: ["reporting"]

    dq:
      +materialized: view
      +schema: ust_dq
      +tags: ["dq"]

seeds:

  ust_digital_platform:

    +schema: ust_seeds

    seed_event_codes:

      +column_types:

        description_code: string

        has_geo: boolean

        is_system_event: boolean

    seed_app_sources:

      +column_types:

        source_code: string

    seed_categories:

      +column_types:

        category_id: string

    # All code columns below are strings on purpose: staging models cast the
    # raw codes to string, and Databricks won't implicit-cast joins the way
    # DuckDB does.
    # Disabled 2026-08-04: decodes tracking_report_event.categories_name — the
    # same retired legacy stream as seed_tracking_*/seed_activity_* below.
    # CSV stays as the dev team's verbatim reference; re-enable if the legacy
    # stream is ever decoded again.
    seed_category_name_aliases:
      +enabled: false
      +column_types:
        category_id: string

    seed_app_category_codes:
      +column_types:
        app_category_code: string
        app_id: string
        ust_category_id: string

    # Generic-commodity stoplist for the social 'item' ranking class — see
    # int_social_concept_trends. TAGGED social on purpose: the weekly job runs
    # `dbt build --select tag:social`, and an untagged seed would never be built
    # there, leaving the anti-join pointing at a table that doesn't exist.
    seed_social_generic_terms:
      +tags: ["social", "reference"]
      +column_types:
        term: string
        applies_to: string
        language: string
        reason: string
        is_active: boolean

    # Disabled: these decode the LEGACY two-tier tracking/activity streams,
    # whose staging/int/mart models were removed 2026-07-08 (superseded by the
    # system_event_log spine). CSVs stay as the dev team's verbatim reference;
    # re-enable if the legacy streams ever need decoding again.
    seed_tracking_event_types:
      +enabled: false
      +column_types:
        event_type_code: string

    seed_tracking_methods:
      +enabled: false
      +column_types:
        method_code: string

    seed_tracking_sources:
      +enabled: false

    seed_tracking_icons:
      +enabled: false

    seed_activity_types:
      +enabled: false
      +column_types:
        activity_type_code: string

    seed_activity_methods:
      +enabled: false
      +column_types:
        method_code: string

    # Same legacy table as seed_activity_types/seed_activity_methods above
    # (user_activity_report_event) — disabled for consistency. Added 2026-07-22,
    # after the 2026-07-08 retirement, so double-check with the dev team whether
    # they intend to keep supplying value maps for a table dbt no longer stages
    # before assuming this is dead for good.
    seed_layout_codes:
      +enabled: false

    # Disabled: not referenced via ref() anywhere — the jdawms glossary/mock
    # scripts read these CSVs directly from seeds/, not from a database table.
    # Re-enable once a model actually needs to join against them (e.g. when
    # jdawms coded-value seeds land and something decodes comtyp in SQL).
    seed_jdawms_data_dictionary:
      +enabled: false

    seed_jdawms_comtyp:
      +enabled: false

tests:

  +store_failures: true

  +schema: test_failures

