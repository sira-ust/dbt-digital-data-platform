version: 2

models:
  - name: stg_mentionlytics__mentions
    description: >
      Lossless 1:1 staging for Mentionlytics mentions. One row per mention_id
      (latest export wins — rerunnable dedupe over the weekly file drops). Cast,
      trim, and rename to analytics-friendly names; all 24 source fields plus the
      loaded_at / source_file lineage columns are preserved. No sentiment
      normalisation or LLM enrichment — that lives in the intermediate layer.
    columns:
      - name: mention_id
        description: Mentionlytics mention ID. Unique key; dedup grain (latest loaded_at wins). Source column `id`.
        tests: [unique, not_null]
      - name: channel
        description: Platform (Web, Twitter, Youtube, TikTok, Bluesky, Reddit).
        tests: [not_null]
      - name: mention_category
        description: Mentionlytics content type (Tweets, Youtube Comments, Websites…). Not a product category. Source column `category`.
      - name: profile
        description: Author handle, page, or domain.
      - name: profile_visits
        description: Profile/domain visits (Web mentions only; null off Web). Source column `profile_visits_web_only`.
      - name: profile_users
        description: Profile/domain unique users (Web mentions only; null off Web). Source column `profile_users_web_only`.
      - name: language
        description: Detected language code (th, en, id, vi, und…).
      - name: followers_or_rank
        description: >
          Overloaded by channel — follower count for social, Alexa domain rank for
          Web. Never aggregate across channels. Source column `followers_rank`.
      - name: total_engagement
        description: Total engagement (platform-defined). Frequently null.
      - name: total_engagement_with_views
        description: Total engagement including views. Frequently null.
      - name: likes
        description: Like/favourite count.
      - name: comments
        description: Comment/reply count.
      - name: shares
        description: Share/retweet count.
      - name: views
        description: View count.
      - name: impressions
        description: Impression count.
      - name: posted_at
        description: Timestamp the mention was posted. Timezone unconfirmed — verify before week-bucketing. Source column `date`.
      - name: sentiment
        description: Mentionlytics sentiment label (positive/negative/neutral). Heavily skewed positive — validate.
      - name: title
        description: Mention title/headline (often null for social replies). Raw — preserved for enrichment.
      - name: content
        description: Mention body/caption. Raw — preserved for enrichment.
      - name: country
        description: ISO-2 country code (~59% null).
      - name: location
        description: Free-text author location. Messy/unnormalised.
      - name: tracker
        description: Campaign/keyword group (Thai Food & Beverages, Vietnam Food & Beverages).
      - name: keyword
        description: Specific matched search term.
      - name: link
        description: URL of the original mention.
      - name: loaded_at
        description: Export/ingest timestamp. Latest wins in the dedupe.
        tests: [not_null]
      - name: source_file
        description: Weekly xlsx filename the row came from (lineage; dedup tiebreak).

  - name: stg_mentionlytics__mention_enrichment
    description: >
      Lossless staging for the LLM enrichment (produced by
      scripts/enrich_mentions.py). One row per mention_id — the enrichment table
      is append-only, so re-enrichment of the same mention is deduped here
      (latest enriched_at wins). Cast + dedupe only; multi-label arrays pass
      through unchanged. dbt never calls the LLM.
    columns:
      - name: mention_id
        description: Mention this row describes. Unique key; joins to stg_mentionlytics__mentions.mention_id.
        tests: [unique, not_null]
      - name: is_food_relevant
        description: True only if genuinely about food/beverages.
      - name: is_spam
        description: True for gambling/casino promos, unrelated ads, or bot content.
      - name: themes
        description: Multi-label broad topics (array).
      - name: mentioned_dishes
        description: Multi-label specific dishes (array).
      - name: mentioned_products
        description: >
          Multi-label sellable products (array) — branded or packaged/processed goods
          a grocery or restaurant could order. Excludes raw commodities/produce
          (those are ingredients), dishes, categories and retailers. Ranked as the
          'item' class in int_social_concept_trends. Enrichment prompt v2+.
      - name: ingredients
        description: Multi-label ingredients (array) — a loose list including raw commodities. Not ranked; feeds the resolver's basket side. See mentioned_products for the sellable-product signal.
      - name: brands
        description: Multi-label brand / restaurant / product / retailer names (array).
      - name: sentiment_normalized
        description: Model-judged sentiment (positive/negative/neutral), independent of the raw label.
      - name: confidence
        description: Model self-rated certainty, 0.0–1.0.
      - name: enriched_at
        description: Classification time (dedup tiebreak).
      - name: model_version
        description: Model + prompt version (e.g. databricks-claude-haiku-4-5/v1).

  - name: stg_mentionlytics__concept_resolution
    description: >
      Lossless staging for the concept->SKU resolution (produced by
      scripts/resolve_trending_concepts.py). One row per concept_norm — the source
      is append-only, so a re-resolution is deduped here (latest resolved_at wins).
      Cast + dedupe only; the recommended_* arrays pass through unchanged. dbt
      never calls the LLM. Only the top-N ranked concepts are resolved (gated), so
      this covers a small set by design. Since prompt v5 each row is the output of
      TWO passes — one model proposes matches, a second independent one reviews
      each candidate against its authoritative catalog name and drops what it
      can't defend — so the audit columns (recommended_reasons, rejected_*,
      proposer_confidence, snippet_count) describe how the surviving set was
      arrived at.
    columns:
      - name: concept_norm
        description: Normalised concept text. Unique key; joins to int_social_concept_trends.concept_norm.
        tests: [unique, not_null]
      - name: canonical_label
        description: LLM canonical display name, merging cross-language/spelling variants.
      - name: canonical_key
        description: >
          canonical_label deglossed + accent-folded (the same normalisation as
          concept_norm). Two concepts sharing this key are the same dish under two
          spellings/scripts — how the resolver detects cross-script twins that
          fold_concept can't merge (som tam / ส้มตำ).
      - name: alias_of
        description: >
          concept_norm of the twin whose answer was copied onto this row (same
          canonical_key, better-grounded result); null when this row IS the
          better-grounded one. Set so one dish can't get two contradictory answers.
      - name: concept_type
        description: LLM item-level type — dish / category / ingredient / product / brand.
      - name: result_type
        description: carried / substitute / basket / none — as CONFIRMED by the verify pass, not as proposed.
        tests:
          - accepted_values:
              arguments:
                values: [carried, substitute, basket, none]
      - name: matched_prtnum
        description: WMS part number we carry for this concept (result_type='carried'); null otherwise.
      - name: recommended_prtnums
        description: Array of WMS part numbers — substitutes or the ingredient basket — that SURVIVED the verify pass.
      - name: recommended_item_names
        description: Array of display names parallel to recommended_prtnums, taken from the item master (never the LLM's own wording).
      - name: recommended_reasons
        description: Why the reviewer kept each item, parallel to recommended_prtnums. The audit trail behind a basket.
      - name: rejected_prtnums
        description: Real SKUs the proposer offered and the reviewer threw out. Kept so a bad proposal pattern is visible, not silently swallowed.
      - name: rejected_reasons
        description: Why each rejected item was thrown out, parallel to rejected_prtnums.
      - name: name_mismatch_prtnums
        description: >
          Diagnostic: part numbers where the proposer's own item name disagreed with
          what that part number actually is — its prtnum and its intent came apart.
          The pair still faced the reviewer (judged on the authoritative name); a
          rising count here means the proposing prompt needs attention.
      - name: match_confidence
        description: >
          The REVIEWER's calibrated confidence in the items it kept, 0.0–1.0 — this
          is what mart_social_trending_items gates on with social_resolve_min_confidence.
      - name: proposer_confidence
        description: >
          The proposing model's self-rating, kept for comparison only. Clustered just
          above the floor at prompt v4 (0.72 vs a 0.70 cutoff), which is why the
          reviewer's number replaced it as the gate.
      - name: snippet_count
        description: >
          How many real mention snippets the models were shown. 0 means the concept
          was resolved from a bare token with no evidence (and is returned as 'none');
          a nonzero count for every ranked concept is the invariant that
          scripts/check_fold_consistency.py protects.
      - name: resolved_at
        description: When this concept was resolved (dedup tiebreak — latest wins).
      - name: model_version
        description: >
          Model + prompt version that produced it (e.g.
          databricks-claude-haiku-4-5/v5). A '-noverify' suffix marks a smoke-test
          row written without the review pass; those never pass as verified and are
          re-resolved on the next normal run.
