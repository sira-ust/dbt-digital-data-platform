version: 2

# Tables produced OUTSIDE dbt by scripts in scripts/, which dbt then reads.
#
# They cannot be dbt models: `dbt build` drops and recreates a model, which would
# destroy results dbt has no way to regenerate (it never calls an external API).
# So they are declared as sources -- the same pattern as
# social.mention_enrichment and social.concept_resolution.
#
# They deliberately do NOT live in navrep / mysql / jdawmsrep. Those are
# read-only replication targets owned by the ingestion process: a hand-written
# table there could be dropped by a schema sync, with nothing to restore it, and
# would read as though it were part of that feed. The ust_ schema marks this as
# ours; the nav_ table prefix records what it was derived FROM.

sources:
  - name: ust_external
    description: >
      Data produced by out-of-band scripts and read back by dbt. Not replicated,
      not generated by dbt -- see each table for which script writes it.
    database: "{{ 'ust_databricks' if target.type == 'databricks' else target.database }}"
    schema: "{{ 'ust_external' if target.type == 'databricks' else 'temp_external' }}"
    config:
      tags: ["raw", "external"]
      meta:
        access: read_only
        source_system: script

    tables:
      - name: nav_customer_geocode
        description: >
          Geocoded coordinates per NAV customer, written by
          scripts/geocode_customers.py via the Google Geocoding API. DERIVED FROM
          nav.customer (the address) -- not part of the NAV replication, and
          deliberately not stored in navrep so it cannot be mistaken for one of
          its tables or dropped by a replication sync.
          INCREMENTAL BY DESIGN: address_hash records which address string was
          resolved, so only new or changed addresses are re-sent. Google bills
          ~$5/1,000, so a full 7,198-customer pass is ~$36 and a second run is
          free. Failures are stored with their status rather than retried forever.
        config:
          external_location: "read_parquet('data/mock/navrep/customer_geocode.parquet')"
          loaded_at_field: geocoded_at
          freshness:
            # geocoding runs on demand, not on a schedule -- a stale geocode only
            # matters if customers have been added since
            warn_after: {count: 30, period: day}
        columns:
          - name: customer_no
            description: NAV customer number -- the PK; joins to nav.customer and to customer_key.
          - name: latitude
            description: Resolved latitude; NULL when geocoding failed.
          - name: longitude
            description: Resolved longitude; NULL when geocoding failed.
          - name: geocode_status
            description: >
              Google's status for this address -- OK, ZERO_RESULTS,
              OVER_QUERY_LIMIT, or a local REQUEST_ERROR/HTTP_nnn. Anything but
              OK means the coordinates are null and presence can never be
              confirmed for that customer.
          - name: geocoded_address
            description: >
              The exact single-line address sent to Google, after the team's
              cleaning rules (drop placeholder streets, strip PICKUP, default a
              "-" state to CA). Kept so a bad match can be diagnosed -- a street
              dropped by those rules can resolve to a CITY CENTROID, which
              geocodes successfully but is not a store.
          - name: address_hash
            description: Hash of geocoded_address; changes only when the address changes.
          - name: geocoded_at
            description: When this row was resolved.
