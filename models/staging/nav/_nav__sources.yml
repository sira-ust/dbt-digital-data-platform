version: 2

# NAV ERP source. Shares the Azure Blob ingestion with jdawmsrep — the nav_*
# folders sit INSIDE abfss://staging@ustsqlrep.../jdawmsrep/ — but NAV is a
# DIFFERENT source system, so the DLT pipeline publishes it to its own UC schema
# (navrep) and dbt models it under its own source name (`nav`): separate lineage,
# freshness, docs, and job selection.
#
# The blob FOLDER keeps its nav_ prefix (nav_item); the landed UC TABLE drops it
# (navrep.item), so names don't stutter. That means no `identifier:` is needed
# here. If the prefix is ever kept in UC, add `identifier: nav_<name>` per table.
#
# COLUMNS ARE NOT DECLARED YET — navrep is not in data/uc_schema_snapshot.csv, so
# the column lists and per-column docs are still open. Table names below come
# from the DLT pipeline's NAV_FULL_LOAD_TABLES list, so refs and selection work
# now; every table description is PROVISIONAL (inferred from the table name) and
# needs confirming against NAV before it is trusted or shown to users.
# To finish:
#   1. python scripts/snapshot_uc_schema.py   (only UC touch; navrep is included)
#   2. python scripts/generate_jdawms_mock.py (emits data/mock/navrep/*.parquet)
#   3. add `columns:` per table, and replace the provisional descriptions.
#
# All NAV tables are FULL LOAD (latest runDate replaces the table), so `loaddate`
# advances on every pipeline run — freshness measures the pipeline, not row age.

sources:
  - name: nav
    description: >
      Microsoft Dynamics NAV ERP feed, landed into Unity Catalog catalog
      ust_databricks, schema navrep, via the same Azure Blob ingestion that
      feeds jdawmsrep — same blob root and pipeline, different source system.
      All tables are READ-ONLY. `loaddate` is the ingestion watermark.
      Target-dependent source:
        Databricks (POC): reads the real navrep replica tables; external_location
                          is ignored.
        DuckDB (dev):     external_location reads mock parquet in
                          data/mock/navrep/, generated by
                          scripts/generate_jdawms_mock.py from the UC schema
                          snapshot (data/uc_schema_snapshot.csv) — no Unity
                          Catalog access needed for local development.
      Kept apart from the `jdawms` source on purpose: WMS answers "where is the
      stock and who moved it", NAV answers "what was ordered, priced, and sold".
      Joins between the two belong in the intermediate layer, where the key
      mapping can be documented and tested — not hidden in staging.
    database: "{{ 'ust_databricks' if target.type == 'databricks' else target.database }}"
    schema: "{{ 'navrep' if target.type == 'databricks' else 'temp_navrep' }}"
    config:
      tags: ["raw", "nav", "erp"]
      meta:
        access: read_only
        source_system: nav
        doc_status: provisional   # table descriptions inferred from names; no NAV
                                  # data dictionary seeded yet
    tables:
      # ── master data ────────────────────────────────────────────────────────
      - name: customer
        description: "PROVISIONAL — NAV customer master (blob folder nav_customer). Candidate link to mysql ust_customer_no / jdawms stcust; confirm the key before joining."
        config:
          external_location: "read_parquet('data/mock/navrep/customer.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}

      - name: customer_ethnicity
        description: "PROVISIONAL — customer ethnicity attribute/segment per customer (blob folder nav_customer_ethnicity)."
        config:
          external_location: "read_parquet('data/mock/navrep/customer_ethnicity.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}

      - name: item
        description: "PROVISIONAL — NAV item master (blob folder nav_item). The ERP-side item; jdawms prtmst is the WMS-side item. Confirm which key ties them."
        config:
          external_location: "read_parquet('data/mock/navrep/item.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}

      - name: item_category
        description: "PROVISIONAL — NAV item category hierarchy (blob folder nav_item_category). Distinct from seed_categories, which is the website taxonomy."
        config:
          external_location: "read_parquet('data/mock/navrep/item_category.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}

      - name: item_unit_of_measure
        description: "PROVISIONAL — UOM definitions and conversion factors per item (blob folder nav_item_unit_of_measure). NAV's analogue of jdawms prtftp_dtl."
        config:
          external_location: "read_parquet('data/mock/navrep/item_unit_of_measure.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}

      - name: product_group
        description: "PROVISIONAL — NAV product group grouping above/beside item category (blob folder nav_product_group)."
        config:
          external_location: "read_parquet('data/mock/navrep/product_group.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}

      - name: state_zone
        description: "PROVISIONAL — state-to-zone geography mapping for territory/shipping logic (blob folder nav_state_zone)."
        config:
          external_location: "read_parquet('data/mock/navrep/state_zone.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}

      # ── calendar ───────────────────────────────────────────────────────────
      - name: holiday_calendar
        description: "PROVISIONAL — holiday calendar header: named holidays and their dates (blob folder nav_holiday_calendar). Likely useful for seasonality in the demand marts."
        config:
          external_location: "read_parquet('data/mock/navrep/holiday_calendar.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}

      - name: holiday_item
        description: "PROVISIONAL — items associated with a holiday (blob folder nav_holiday_item). Holiday-driven assortment; pairs with holiday_calendar."
        config:
          external_location: "read_parquet('data/mock/navrep/holiday_item.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}

      # ── promotions ─────────────────────────────────────────────────────────
      - name: promotion_header
        description: "PROVISIONAL — promotion header: one row per promotion with its validity window (blob folder nav_promotion_header)."
        config:
          external_location: "read_parquet('data/mock/navrep/promotion_header.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}

      - name: promotion_line
        description: "PROVISIONAL — promotion lines: the items/prices a promotion applies to (blob folder nav_promotion_line). FULL LOAD — confirm the export carries full history, not a rolling window."
        config:
          external_location: "read_parquet('data/mock/navrep/promotion_line.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}

      # ── sales ──────────────────────────────────────────────────────────────
      - name: sales_header
        description: >
          PROVISIONAL — sales order header, one row per order (blob folder
          nav_sales_header). This is the most likely home for the order-header
          link that WMS lacks; verify against the outstanding `ord` mirror ask
          before building on it. FULL LOAD — confirm the export carries full
          history, not a rolling window, or history is lost on every run.
        config:
          external_location: "read_parquet('data/mock/navrep/sales_header.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}

      - name: sales_line
        description: >
          PROVISIONAL — sales order lines: item, quantity, price per order line
          (blob folder nav_sales_line). The ERP-side demand signal, next to the
          website behavioural signal in int_item_demand_daily. FULL LOAD — same
          history caveat as sales_header.
        config:
          external_location: "read_parquet('data/mock/navrep/sales_line.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}

      - name: sales_quota_header
        description: "PROVISIONAL — sales quota/target header, likely per salesperson and period (blob folder nav_sales_quota_header)."
        config:
          external_location: "read_parquet('data/mock/navrep/sales_quota_header.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}

      - name: sales_quota_line
        description: "PROVISIONAL — sales quota lines: the target amounts behind a quota header (blob folder nav_sales_quota_line)."
        config:
          external_location: "read_parquet('data/mock/navrep/sales_quota_line.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
