version: 2

# NAV ERP source. Shares the Azure Blob ingestion with jdawmsrep — the nav_*
# folders sit INSIDE abfss://staging@ustsqlrep.dfs.core.windows.net/jdawmsrep —
# but NAV is a DIFFERENT source system, so the DLT pipeline publishes it to its
# own UC schema (navrep) and dbt models it under its own source name (`nav`):
# separate lineage, freshness, docs, and job selection.
#
# The blob FOLDER keeps its nav_ prefix (nav_item); the landed UC TABLE drops it
# (navrep.item), so no `identifier:` is needed here.
#
# Columns and types below are TRANSCRIBED FROM THE REAL REPLICA
# (data/uc_schema_snapshot.csv, refreshed 2026-08-11 — 231 columns / 15 tables).
#
# These are a CURATED SUBSET, not whole NAV tables. The Azure Data Factory job
# that writes the blob issues an explicit SELECT per table, aliasing NAV's native
# names (`[Sell-to Customer No_]` -> sell_to_customer_no) and taking only the
# listed columns. So a column that is missing here is missing because ADF does not
# select it — the fix is in the ADF config, NOT in dbt. Source tables are the
# `U_S_ Trading Co_$*` SQL tables in dbo.
#
# DESCRIPTIONS ARE NOT SME-VERIFIED. There is no NAV data dictionary yet (the
# WMS side has seed_jdawms_data_dictionary; NAV has nothing equivalent). Standard
# NAV/Business Central fields are described from that convention; anything
# genuinely ambiguous is marked CONFIRM and left honest rather than guessed.
# persist_docs pushes these strings to UC comments, so treat an unmarked
# description as "probably right", not "verified".
#
# All NAV tables are FULL LOAD: the pipeline keeps only the latest runDate, so
# `loaddate` advances on every run and freshness measures the PIPELINE, not row
# age. The ADF queries carry NO WHERE clause, so each export IS a complete dump
# of the source table — full load loses nothing at the ingestion layer, and the
# rolling-window worry is settled.
#
# What DOES limit history is NAV itself: `Sales Header` / `Sales Line` hold OPEN,
# UNPOSTED documents. Once an order is posted, NAV moves it to the posted-document
# tables (Sales Invoice Header / Sales Shipment Header), which ADF does NOT export.
# So sales_header is a live snapshot of in-flight orders, not an order history —
# see the sales_header description below.
#
# Two conventions across every table:
#   * int columns holding 0/1 are NAV booleans (BC stores Boolean as an int).
#   * decimal(38,20) is the landed type for every numeric measure — NAV decimals
#     widened by the parquet export, NOT a claim of 20-digit precision. Cast down
#     in staging.

sources:
  - name: nav
    description: >
      Microsoft Dynamics NAV ERP feed, landed into Unity Catalog catalog
      ust_databricks, schema navrep, via the same Azure Blob ingestion that
      feeds jdawmsrep — same blob root and pipeline, different source system.
      All tables are READ-ONLY. `loaddate` is the ingestion watermark.
      Target-dependent source:
        Databricks (POC): reads the real navrep replica tables; external_location
                          is ignored.
        DuckDB (dev):     external_location reads mock parquet in
                          data/mock/navrep/, generated by
                          scripts/generate_jdawms_mock.py from the UC schema
                          snapshot (data/uc_schema_snapshot.csv) — no Unity
                          Catalog access needed for local development.
      Kept apart from the `jdawms` source on purpose: WMS answers "where is the
      stock and who moved it", NAV answers "what was ordered, priced, and sold".
      NAV sits BETWEEN the website and the WMS, and carries keys into both:
      sales_header.m2_* / customer.m2_* point at Magento (the website), and the
      jda_* columns record the handoff to JDA (the WMS). That makes this source
      the most promising bridge for the order-grain join the WMS mirror alone
      could not support. Those joins belong in the intermediate layer, where the
      key mapping can be documented and tested — not hidden in staging.
    database: "{{ 'ust_databricks' if target.type == 'databricks' else target.database }}"
    schema: "{{ 'navrep' if target.type == 'databricks' else 'temp_navrep' }}"
    config:
      tags: ["raw", "nav", "erp"]
      meta:
        access: read_only
        source_system: nav
        doc_status: unverified   # real columns; descriptions not SME-confirmed
    tables:

      # ═══ master data ═══════════════════════════════════════════════════════
      - name: customer
        description: >
          NAV customer master — one row per customer_no. Carries BOTH cross-system
          customer keys: customer_no (the ERP/WMS code, already confirmed equal to
          mysql ust_customer_no and jdawms stcust) and m2_customer_id (Magento).
          Also holds the weekday delivery pattern and routing/zone attributes.
        config:
          external_location: "read_parquet('data/mock/navrep/customer.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
        columns:
          - name: customer_no
            description: "Customer number — the PK. Same code as mysql ust_customer_no and jdawms pckwrk_dtl.stcust (confirmed exact, no normalisation)."
          - name: name
            description: "Customer name."
          - name: name_2
            description: "Customer name, second line."
          - name: address
            description: "Street address."
          - name: city
            description: "City."
          - name: global_dimension_1_code
            description: "NAV global dimension 1 — the tenant's primary analysis dimension. CONFIRM what it means here (commonly department or region)."
          - name: global_dimension_2_code
            description: "NAV global dimension 2 — secondary analysis dimension. CONFIRM local meaning."
          - name: customer_posting_group
            description: "Posting group driving which GL receivables accounts this customer posts to."
          - name: customer_price_group
            description: "Price group governing which price list applies to this customer."
          - name: payment_terms_code
            description: "Payment terms (e.g. net days)."
          - name: salesperson_code
            description: "Salesperson who owns the account. Joins to sales_quota_line.salesperson_code, and candidate join to mysql ust_admin_users.salesperson_code."
          - name: shipment_method_code
            description: "Shipment method / incoterm-style delivery arrangement."
          - name: shipping_agent_code
            description: "Carrier. Candidate join to the jdawms carcod value map (seed_jdawms_code_descriptions, domain carcod) — CONFIRM the code systems actually agree."
          - name: country_region_code
            description: "Country/region code."
          - name: payment_method_code
            description: "Payment method."
          - name: gen_bus_posting_group
            description: "General business posting group — the customer side of NAV's GL posting matrix."
          - name: post_code
            description: "Postal/ZIP code."
          - name: county
            description: "County, or state/province in US-style addresses. Candidate join to state_zone.state_code — CONFIRM, since NAV's county field is free text."
          - name: responsibility_center
            description: "Responsibility centre — the location/branch owning the customer relationship."
          - name: shipping_agent_service_code
            description: "Carrier service level within shipping_agent_code."
          - name: monday_deliveries
            description: "Boolean (0/1) — customer accepts Monday deliveries. The seven weekday flags together are the delivery-day pattern."
          - name: tuesday_deliveries
            description: "Boolean (0/1) — accepts Tuesday deliveries."
          - name: wednesday_deliveries
            description: "Boolean (0/1) — accepts Wednesday deliveries."
          - name: thursday_deliveries
            description: "Boolean (0/1) — accepts Thursday deliveries."
          - name: friday_deliveries
            description: "Boolean (0/1) — accepts Friday deliveries."
          - name: saturday_deliveries
            description: "Boolean (0/1) — accepts Saturday deliveries."
          - name: sunday_deliveries
            description: "Boolean (0/1) — accepts Sunday deliveries."
          - name: in_active
            description: "Boolean (0/1) — NOTE THE POLARITY: 1 means INACTIVE, not active. Filter accordingly."
          - name: shipping_zone
            description: "Shipping zone. Coexists with ship_zone below — CONFIRM which is authoritative before using either."
          - name: appointment_required
            description: "Boolean (0/1) — delivery needs a booked appointment. Pairs with sales_header.appt_required."
          - name: m2_customer_id
            description: "Magento customer entity id. The website-side customer key — the bridge from NAV to Magento customer records."
          - name: m2_customer
            description: "Boolean-ish int — CONFIRM: most likely a flag for 'this customer exists / is synced in Magento', not an id."
          - name: jda_route
            description: "Delivery route as sent to JDA (the WMS). Routing attribute shared with the WMS handoff."
          - name: m2_setup_dt
            description: "When the customer was set up in Magento."
          - name: ship_zone
            description: "Shipping zone — coexists with shipping_zone above. Candidate join to state_zone.zone_code; CONFIRM which of the two is live."
          - name: customer_group
            description: "Customer group/segment. CONFIRM whether this is a NAV grouping or a Magento customer-group mirror."
          # ── added to the ADF export 2026-09-20 ──────────────────────────
          - name: customer_retail
            description: "Boolean (0/1) — retail account. One of three store-type flags; see customer_food_service for the coverage caveat."
          - name: customer_wholesale
            description: "Boolean (0/1) — wholesale account."
          - name: customer_food_service
            description: >
              Boolean (0/1) — food-service account. THE THREE ARE NOT MUTUALLY
              EXCLUSIVE AND NOT COMPLETE: measured 2026-09-23, of 3,742 active
              customers only ~1,750 carry any type at all, 76 carry two and one
              carries three. So "no type" covers roughly half the active book and
              means UNKNOWN, not "none of the above".
          - name: budgeted_amount
            description: >
              ZERO ON ALL 7,242 CUSTOMERS — verified against NAV itself on
              2026-09-23, so this is the source's own state and not an ingestion
              fault. It was pulled as a candidate for the "individual store
              target" the business asked about; it is not one. Do not build on it
              without checking it has started being maintained.
          - name: loaddate
            description: "Ingestion watermark — set to the pipeline run time. Full load, so this advances every run regardless of whether the row changed."

      - name: customer_ethnicity
        description: >
          Ethnicity mix per customer — grain customer_no + ethnicity, with a
          percentage allocation. Likely drives assortment/targeting for an ethnic
          food wholesaler. Handle as demographic data: useful for assortment
          analysis, but keep it out of anything customer-facing.
        config:
          external_location: "read_parquet('data/mock/navrep/customer_ethnicity.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
        columns:
          - name: customer_no
            description: "Customer this row describes. Joins to customer.customer_no."
          - name: ethnicity
            description: "Ethnicity code. NO DECODE IS AVAILABLE in this source — the codes stay as raw values, so expect them unresolved in any output."
          - name: selected
            description: "Boolean (0/1) — CONFIRM: most likely 'this ethnicity is flagged for the customer', letting allocation_pct be 0 while still selected."
          - name: allocation_pct
            description: "Share of the customer's mix for this ethnicity. NAV source column is [Allocation %], so expect a 0-100 percentage rather than a 0-1 fraction — confirm whether rows sum to 100 per customer."
          - name: loaddate
            description: "Ingestion watermark — pipeline run time (full load)."

      - name: item
        description: >
          NAV item master — one row per item_no. The ERP-side item, where jdawms
          prtmst is the WMS-side item; item_no is the same SKU code as
          prtmst.prtnum (already confirmed exact against the website sku). This is
          also the table holding real item names, families, and web-merchandising
          flags — the catalog attributes local dev.duckdb lacks.
        config:
          external_location: "read_parquet('data/mock/navrep/item.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
        columns:
          - name: item_no
            description: "Item number — the PK. Same SKU code as jdawms prtmst.prtnum and the website sku (confirmed exact)."
          - name: description
            description: "Item name, short form. The primary human-readable label."
          - name: base_unit_of_measure
            description: "Stocking UOM all quantities are expressed in. Compare with jdawms prtftp_dtl.uomcod."
          - name: inventory_posting_group
            description: "Posting group driving which GL inventory accounts the item posts to."
          - name: gross_weight
            description: "Gross weight per base UOM. CONFIRM the unit (lb vs kg) — not encoded in the column."
          - name: blocked
            description: "Boolean (0/1) — 1 blocks the item from transacting. Combine with new_item/show_on_web to judge what is genuinely sellable."
          - name: gen_prod_posting_group
            description: "General product posting group — the item side of NAV's GL posting matrix."
          - name: country_region_of_origin_code
            description: "Country of origin."
          - name: global_dimension_1_code
            description: "NAV global dimension 1 on the item. CONFIRM local meaning."
          - name: global_dimension_2_code
            description: "NAV global dimension 2 on the item. CONFIRM local meaning."
          - name: item_category_code
            description: "Item category. Joins to item_category.item_category_code. NAV's own taxonomy — NOT the website taxonomy in seed_categories, and the two must never be merged."
          - name: product_group_code
            description: "Product group within the category. Joins to product_group (grain item_category_code + product_group_code)."
          - name: upc_code_1
            description: "Primary UPC barcode. Also exposed per-UOM as item_unit_of_measure.upc_1."
          - name: show_on_web
            description: "Boolean (0/1) — item is published to the website. The ERP-side gate on web assortment; pairs naturally with the website demand signals."
          - name: new_item
            description: "Boolean (0/1) — flagged as new. CONFIRM how long the flag persists; it is a manual attribute, not a derived age."
          - name: popular_item
            description: "Boolean (0/1) — merchandised as popular. A MANUAL buyer flag, not a computed velocity measure — do not treat as ground truth for demand (item_category has the velocity flags)."
          - name: hi
            description: "Pallet pattern HI — layers high per pallet. With ti, gives the pallet build; cs_per_pallet should equal hi x ti."
          - name: ti
            description: "Pallet pattern TI — cases per layer (tier)."
          - name: cs_per_pallet
            description: "Cases per pallet. Expected to equal hi x ti — a cheap DQ check once staged."
          - name: basic_uom_size
            description: "Size descriptor for the base UOM, as text (e.g. a pack size). Free text, not a number."
          - name: case_qty
            description: "Units per case."
          - name: innerpack_qty
            description: "Units per inner pack. Compare with jdawms invdtl.untpak."
          - name: ea_qty
            description: "Each quantity — CONFIRM: likely units per 'each', normally 1 unless the item is sold as a multiple."
          - name: size_unit
            description: "Unit for the size attributes (oz, g, ml…)."
          - name: item_family_no
            description: "Item family grouping. The real family key — local dev.duckdb only has synthetic families, so family analysis needs the Databricks target or a refreshed mock."
          - name: app_banner
            description: "Boolean-ish int — CONFIRM: most likely 'feature this item in an app banner slot'. Merchandising, not inventory."
          - name: m2_last_sync_dt
            description: "When the item was last synced to Magento. Staleness signal for website/ERP catalog drift."
          - name: body_description
            description: "Long marketing copy for the item."
          - name: attributes1_flavor
            description: "Flavour attribute."
          - name: attributes2_size_other
            description: "Size/other attribute."
          - name: attributes3_package
            description: "Packaging attribute."
          - name: full_description
            description: "Full item name — the richest label available. Prefer over description for anything user-facing."
          # ── added to the ADF export 2026-09-20 ──────────────────────────
          - name: unit_price
            description: "List price per base UOM. The only price in the warehouse for an item an account has never bought."
          - name: discontinued
            description: "Boolean (0/1) — item is being phased out. Distinct from blocked, which stops it transacting outright."
          - name: focus_item
            description: >
              Boolean (0/1) — flagged as a focus item. ONLY 5 ITEMS CARRY IT, and
              four of those have a window from JULY 2017 (see focus_begin_date).
              The flag is not being maintained; treat it as unusable until the
              business says otherwise.
          - name: focus_begin_date
            description: "Focus window start. NAV writes an unset date as 1753-01-01, not NULL. Measured 2026-09-23: the populated ones all read 2017-07-01."
          - name: focus_end_date
            description: "Focus window end. All 2017-07-31 where set."
          - name: new_begin_date
            description: >
              New-item window start. BLANK (1753-01-01) on 335 of the 357 flagged
              items, so it cannot gate anything. Marked New Date is the column
              that is actually maintained — not currently exported.
          - name: new_end_date
            description: >
              New-item window end. BLANK ON ALL 357 FLAGGED ITEMS, which is why
              no item is ever "currently new" by its own window. This column is
              carried for completeness and must not be used as a gate.
          - name: loaddate
            description: "Ingestion watermark — pipeline run time (full load)."

      - name: item_category
        description: >
          NAV item category — one row per item_category_code, with the ABC-style
          velocity flags (fast/good/average/slow) applied at category level.
          Distinct from seed_categories, which is the WEBSITE taxonomy; the two
          numbering systems are unrelated and must not be merged.
        config:
          external_location: "read_parquet('data/mock/navrep/item_category.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
        columns:
          - name: item_category_code
            description: "Category code — the PK. Joins to item.item_category_code."
          - name: description
            description: "Category name."
          - name: def_inventory_posting_group
            description: "Default inventory posting group inherited by items in this category."
          - name: fast_item
            description: "Boolean (0/1) — category classed as fast-moving. The four velocity flags look mutually exclusive; worth a DQ test that exactly one is set."
          - name: good_item
            description: "Boolean (0/1) — good-moving."
          - name: average_item
            description: "Boolean (0/1) — average-moving."
          - name: slow_item
            description: "Boolean (0/1) — slow-moving. Compare against jdawms abccod, which classifies at ITEM level for cycle counting — different grain, possibly different intent."
          - name: loaddate
            description: "Ingestion watermark — pipeline run time (full load)."

      - name: item_unit_of_measure
        description: >
          UOM definitions per item — grain item_no + uom_code, carrying the
          physical dimensions and weight of each packaging level. NAV's analogue
          of jdawms prtftp_dtl / ftpmst, so a natural place to cross-check the
          WMS footprint data.
        config:
          external_location: "read_parquet('data/mock/navrep/item_unit_of_measure.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
        columns:
          - name: item_no
            description: "Item this UOM belongs to. Joins to item.item_no."
          - name: uom_code
            description: "UOM code (EA, CS, PLT…). With item_no, the grain."
          - name: length
            description: "Length of this UOM. CONFIRM the unit — not encoded in the column."
          - name: width
            description: "Width of this UOM."
          - name: height
            description: "Height of this UOM."
          - name: weight
            description: "Weight of this UOM. Reconcile against item.gross_weight for the base UOM."
          - name: size
            description: "Size descriptor, as text."
          - name: upc_1
            description: "UPC barcode for this specific UOM (a case has a different barcode from an each)."
          - name: loaddate
            description: "Ingestion watermark — pipeline run time (full load)."

      - name: product_group
        description: >
          Product group within an item category — grain item_category_code +
          product_group_code, the level below item_category. Repeats the same four
          velocity flags at this finer grain.
        config:
          external_location: "read_parquet('data/mock/navrep/product_group.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
        columns:
          - name: item_category_code
            description: "Parent category. Joins to item_category.item_category_code."
          - name: product_group_code
            description: "Product group code. With item_category_code, the grain — NOT unique on its own, so always join on both."
          - name: description
            description: "Product group name."
          - name: good_item
            description: "Boolean (0/1) — good-moving at product-group level."
          - name: average_item
            description: "Boolean (0/1) — average-moving."
          - name: slow_item
            description: "Boolean (0/1) — slow-moving."
          - name: fast_item
            description: "Boolean (0/1) — fast-moving."
          - name: loaddate
            description: "Ingestion watermark — pipeline run time (full load)."

      - name: state_zone
        description: >
          State-to-zone mapping — one row per state_code, giving the delivery zone
          a state belongs to. Small reference table; a natural seed candidate if it
          turns out to be static.
        config:
          external_location: "read_parquet('data/mock/navrep/state_zone.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
        columns:
          - name: state_code
            description: "State/province code — the PK."
          - name: state_name
            description: "State name."
          - name: zone_code
            description: "Delivery zone the state belongs to. Candidate join to customer.ship_zone / shipping_zone."
          - name: loaddate
            description: "Ingestion watermark — pipeline run time (full load)."

      # ═══ calendar ══════════════════════════════════════════════════════════
      - name: holiday_calendar
        description: >
          Holiday calendar — grain holiday_year + holiday_occasion, with the
          promotional window (begin_period to end_period) for each occasion. The
          ERP's own seasonality definition, which beats deriving seasons from
          transaction dates for a business this holiday-driven.
        config:
          external_location: "read_parquet('data/mock/navrep/holiday_calendar.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
        columns:
          - name: holiday_year
            description: "Year the occasion belongs to. With holiday_occasion, the grain — occasions repeat annually with shifting dates (lunar calendars especially)."
          - name: begin_period
            description: "Start of the holiday/promotional window."
          - name: end_period
            description: "End of the window. Windows may overlap across occasions — check before treating as a clean partition of the year."
          - name: holiday_occasion
            description: "Numeric occasion code. Meaning comes from `description`; a value map is worth seeding once the distinct set is known."
          - name: description
            description: "Occasion name (the human label for holiday_occasion)."
          - name: loaddate
            description: "Ingestion watermark — pipeline run time (full load)."

      - name: holiday_item
        description: >
          Items promoted for a holiday occasion — grain holiday_year + item_no +
          holiday_occasion, with the planned promo quantity. The buyer's demand
          expectation, which is a genuine forecast to compare actual sales against.
        config:
          external_location: "read_parquet('data/mock/navrep/holiday_item.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
        columns:
          - name: holiday_year
            description: "Year. Joins to holiday_calendar with holiday_occasion."
          - name: item_no
            description: "Item promoted. Joins to item.item_no."
          - name: holiday_occasion
            description: "Occasion code. Joins to holiday_calendar.holiday_occasion."
          - name: promo_qty
            description: "Planned promotional quantity. CONFIRM the UOM (base vs cases) before comparing to sales_line.quantity."
          - name: loaddate
            description: "Ingestion watermark — pipeline run time (full load)."

      # ═══ promotions ════════════════════════════════════════════════════════
      - name: promotion_header
        description: >
          Promotion header — one row per promo_code with its validity window.
          Sourced from NAV's `AFP Promotion Header` (promo_code is its [Code]).
        config:
          external_location: "read_parquet('data/mock/navrep/promotion_header.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
        columns:
          - name: promo_code
            description: "Promotion code — the PK."
          - name: description
            description: "Promotion name."
          - name: promo_begin_date
            description: "Promotion start."
          - name: promo_end_date
            description: "Promotion end."
          - name: loaddate
            description: "Ingestion watermark — pipeline run time (full load)."

      - name: promotion_line
        description: >
          Promotion lines — the items on a promotion, with holiday linkage and
          lifecycle flags. From NAV's `AFP Promotion Line`. WARNING: this table has
          BOTH `promotion_code` ([Promotion Code]) and `promo_code` ([Promo Code]).
          These are two genuinely distinct NAV fields, not an ingestion artefact,
          and only one is the real join to promotion_header.promo_code ([Code]) —
          resolve which before modelling.
        config:
          external_location: "read_parquet('data/mock/navrep/promotion_line.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
        columns:
          - name: promotion_code
            description: "Promotion code. CONFIRM against promo_code below — two near-identical columns, likely one legacy and one live."
          - name: item_no
            description: "Item on promotion. Joins to item.item_no."
          - name: promotion_group_code
            description: "Grouping within the promotion. CONFIRM meaning."
          - name: campaign_target_qty
            description: "Target quantity for the campaign. Compare with holiday_item.promo_qty — CONFIRM whether they are the same planning number by another name."
          - name: new_on_promotion
            description: "Boolean (0/1) — newly added to the promotion."
          - name: promo_begin_date
            description: "Line-level promotion start. May differ from the header window — check before assuming the header governs."
          - name: promo_end_date
            description: "Line-level promotion end."
          - name: promo_code
            description: "Promotion code. The likelier join to promotion_header.promo_code, on name alone — CONFIRM against promotion_code."
          - name: holiday_occasion
            description: "Occasion this promotion serves. Joins to holiday_calendar with holiday_year."
          - name: holiday_year
            description: "Holiday year for the occasion link."
          - name: discontinued
            description: "Boolean (0/1) — line discontinued."
          # ── added to the ADF export 2026-09-20 ──────────────────────────
          - name: sprice
            description: >
              Promotional price. ZERO ON 12,606 OF 12,967 LINES, and — the part
              that matters — zero on ALL 86 promotions live today (measured
              2026-09-23). Treat 0 as NOT SET, never as free. The offer is
              carried by promo_buy_qty / promo_free_qty instead.
          - name: promo_buy_qty
            description: "Buy quantity in a buy-X-get-Y-free offer. Set on 27 of the 86 live promo lines — the mechanic that IS maintained."
          - name: promo_free_qty
            description: "Free quantity in the same offer. Pairs with promo_buy_qty."
          - name: released
            description: "Boolean (0/1) — line released/active. With discontinued, the lifecycle gate on whether a promo line counts."
          - name: loaddate
            description: "Ingestion watermark — pipeline run time (full load)."

      # ═══ sales ═════════════════════════════════════════════════════════════
      - name: sales_header
        description: >
          Sales order header — grain document_type + document_no. THE CROSS-SYSTEM
          BRIDGE: m2_order_no / m2_entity_id carry the Magento (website) order
          keys, and the jda_* columns record what was handed to JDA (the WMS),
          which makes this the strongest candidate for the order-grain join the WMS
          mirror alone could not support. Verify the m2 keys against the website's
          increment_id / entity_id before building on it.

          CRITICAL LIMITATION — NOT AN ORDER HISTORY. NAV's `Sales Header` holds
          OPEN, UNPOSTED documents only. When an order is posted it MOVES to the
          posted-document tables (Sales Invoice Header / Sales Shipment Header),
          which the ADF job does not export. So this is a live snapshot of in-flight
          orders that shrinks as orders complete, and the full-load strategy is
          correct for that. Anything needing completed-order history needs the
          posted tables added to the ADF export first. Check row count and
          order_date range against expected volume to confirm before modelling.
        config:
          external_location: "read_parquet('data/mock/navrep/sales_header.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
        columns:
          - name: document_type
            description: "NAV document type as an int. Part of the PK — document_no is NOT unique on its own. CONFIRM the enum; standard NAV is Quote/Order/Invoice/Credit Memo/Blanket/Return Order, and the numbering must be verified rather than assumed."
          - name: document_no
            description: "NAV order number. With document_type, the PK. This is the ERP order id — distinct from both the Magento order number and the WMS ordnum."
          - name: sell_to_customer_no
            description: "Customer placing the order. Joins to customer.customer_no, and thus to jdawms stcust and mysql ust_customer_no."
          - name: bill_to_name
            description: "Bill-to name."
          - name: bill_to_address
            description: "Bill-to street address."
          - name: bill_to_city
            description: "Bill-to city."
          - name: ship_to_code
            description: "Ship-to address code on the customer record — identifies WHICH of a customer's addresses this order ships to."
          - name: ship_to_name
            description: "Ship-to name."
          - name: ship_to_address
            description: "Ship-to street address."
          - name: ship_to_city
            description: "Ship-to city."
          - name: order_date
            description: "Date the order was placed. The natural spine date for order-grain analysis, and the one to pair with website event timestamps."
          - name: posting_date
            description: "GL posting date — an accounting date, not an operational one. Do not use for demand timing."
          - name: shipment_date
            description: "Planned shipment date."
          - name: shipment_method_code
            description: "Shipment method for this order."
          - name: location_code
            description: "NAV location/warehouse fulfilling the order. IMPORTANT for the known single-warehouse limitation: the jdawms mirror only covers CABOT, so this column should reveal how much volume ships from unmirrored sites."
          - name: customer_posting_group
            description: "Customer posting group snapshotted onto the order."
          - name: salesperson_code
            description: "Salesperson owning the order. Candidate join to mysql ust_admin_users.salesperson_code."
          - name: gen_bus_posting_group
            description: "General business posting group snapshotted onto the order."
          - name: bill_to_post_code
            description: "Bill-to postal code."
          - name: bill_to_county
            description: "Bill-to county/state."
          - name: bill_to_country_region_code
            description: "Bill-to country/region."
          - name: ship_to_post_code
            description: "Ship-to postal code."
          - name: ship_to_county
            description: "Ship-to county/state. Candidate join to state_zone.state_code."
          - name: ship_to_country_region_code
            description: "Ship-to country/region."
          - name: prepayment_pct
            description: "Prepayment percentage required."
          - name: responsibility_center
            description: "Responsibility centre owning the order."
          - name: requested_delivery_date
            description: "Delivery date the customer asked for. Against actual shipment, this is the service-level yardstick the WMS mirror lacked (jdawms shipment.dlv_dte is 0% populated)."
          - name: shipping_time
            description: "Transit time. Stored as text, not an interval."
          - name: shipping_agent_service_code
            description: "Carrier service level."
          - name: pda_order_no
            description: "Order number from the PDA channel. `PDA` is one of the app sources in seed_app_sources — a candidate channel-attribution key. CONFIRM."
          - name: date_received
            description: "Date the order was received into NAV. With time_received, reconstructs the intake timestamp."
          - name: time_received
            description: "Time the order was received — a SEPARATE column from date_received (NAV splits date and time). Combine both to get a real timestamp."
          - name: date_sent
            description: "Date the order was sent onward (to the WMS). With time_sent, the handoff timestamp."
          - name: time_sent
            description: "Time the order was sent onward."
          - name: ship_with_prepayment
            description: "Boolean (0/1) — ship only with prepayment."
          - name: order_weight_jda_sent
            description: "Order weight as sent to JDA (the WMS). A jda_* column: evidence of the ERP-to-WMS handoff for this order."
          - name: order_cubage_jda_sent
            description: "Order cube as sent to JDA."
          - name: order_cubage_mix_est
            description: "Estimated mixed-pallet cube."
          - name: pallet_count_total
            description: "Total pallets on the order."
          - name: pallet_count_override
            description: "Manual override of the pallet count. A non-null/non-zero value means someone corrected the calculation."
          - name: pick_priority
            description: "Picking priority passed to the warehouse. Candidate comparison against jdawms pckwrk_hdr sequencing."
          - name: jda_last_sent_dt
            description: "When the order was last sent to JDA. The cleanest ERP-side timestamp of the WMS handoff — use it to bound the search window when pairing NAV orders to WMS picks."
          - name: lift_gate_required
            description: "Boolean (0/1) — delivery needs a lift gate."
          - name: hot_rush_local
            description: "Boolean (0/1) — local rush order."
          - name: appt_required
            description: "Boolean (0/1) — delivery appointment required. Pairs with customer.appointment_required."
          - name: handle_with_care
            description: "Boolean (0/1) — fragile handling."
          - name: order_weight_fz_est
            description: "Estimated weight of the frozen portion. `fz` = frozen; pairs with sales_line.is_frozen_item."
          - name: order_cubage_fz_est
            description: "Estimated cube of the frozen portion."
          - name: pickup_date
            description: "Customer pickup date, for will-call orders. Compare with jdawms carcod CPU01 = CUSTOMER PICKUP."
          - name: pickup_time
            description: "Customer pickup time."
          - name: qty_override
            description: "Boolean (0/1) — quantities were manually overridden."
          - name: override_oos
            description: "Boolean (0/1) — out-of-stock block was overridden. DIRECTLY RELEVANT to the demand-vs-supply mart: it marks orders taken despite no stock, which is a stockout the WMS side cannot see."
          - name: update_jda_ship_qty
            description: "Boolean (0/1) — flag controlling whether shipped quantities flow back from JDA."
          - name: m2_order_no
            description: "Magento order number. STRONG CANDIDATE for the website increment_id — the order key missing from every other source. Verify against the website's order table before relying on it."
          - name: m2_order
            description: "Boolean-ish int — CONFIRM: likely a flag for 'this order originated in / is synced with Magento', which would make it the channel discriminator between web and non-web orders."
          - name: m2_entity_id
            description: "Magento order entity id (the website's internal surrogate key). Together with m2_order_no, the pair that could finally close the order-grain link."
          - name: loaddate
            description: "Ingestion watermark — pipeline run time (full load)."

      - name: sales_line
        description: >
          Sales order lines — grain document_type + document_no + line_no, with
          ordered / shipped / invoiced quantities per item. The ERP-side demand
          signal, alongside the website behavioural signal in
          int_item_demand_daily, and the first source here that shows ORDERED
          quantity (jdawms pckqty is planned-pick, not customer-ordered). Carries
          the SAME open-documents-only limitation as sales_header: lines vanish when
          their order posts, so this is in-flight demand, not sales history.
        config:
          external_location: "read_parquet('data/mock/navrep/sales_line.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
        columns:
          - name: sell_to_customer_no
            description: "Customer, denormalised onto the line. Joins to customer.customer_no."
          - name: document_type
            description: "Document type — part of the join back to sales_header. Same enum caveat."
          - name: document_no
            description: "Order number. With document_type and line_no, the PK; with document_type alone, the join to sales_header."
          - name: line_no
            description: "Line number within the order."
          - name: line_type
            description: >
              NAV [Type] — what KIND of line this is. Standard NAV options are
              blank/comment, G/L Account, Item, Resource, Fixed Asset and Charge,
              so this column decides which rows are real product demand. CONFIRM
              the integer for Item before filtering; everything downstream that
              counts demand depends on getting it right.
          - name: item_no
            description: >
              NAV [No_] — the identifier of whatever the line points at. It is an
              ITEM NUMBER ONLY WHEN line_type is Item; on other line types it holds
              a G/L account, resource, or charge code instead. Always filter on
              line_type before joining to item.item_no or jdawms prtnum.
          - name: location_code
            description: "Location fulfilling the line. May differ from the header location."
          - name: posting_group
            description: "Posting group on the line."
          - name: description
            description: "Item description snapshotted at order time — may differ from today's item.description, which makes it useful for historical naming."
          - name: unit_of_measure
            description: "UOM name as text. Coexists with unit_of_measure_code below; prefer the code for joins."
          - name: gross_weight
            description: "Line gross weight."
          - name: unit_volume
            description: "Volume per unit."
          - name: quantity
            description: "Quantity ORDERED. The true customer demand number, and the thing the WMS mirror could not provide — allocation cuts become visible as quantity minus quantity_shipped."
          - name: quantity_shipped
            description: "Quantity actually shipped. Below quantity means a short-ship or cut."
          - name: quantity_invoiced
            description: "Quantity invoiced. Usually tracks shipped; a gap points at billing state, not fulfilment."
          - name: gen_bus_posting_group
            description: "General business posting group on the line."
          - name: gen_prod_posting_group
            description: "General product posting group on the line."
          - name: prepayment_pct
            description: "Prepayment percentage on the line."
          - name: unit_of_measure_code
            description: "UOM code. Joins to item_unit_of_measure (item_no + uom_code) — REQUIRED to normalise quantity, since lines can be ordered in cases while stock is tracked in eaches."
          - name: responsibility_center
            description: "Responsibility centre on the line."
          - name: item_category_code
            description: "Category snapshotted onto the line. Joins to item_category."
          - name: product_group_code
            description: "Product group snapshotted onto the line."
          - name: requested_delivery_date
            description: "Requested delivery date at line level."
          - name: return_qty_to_receive
            description: "Quantity expected back on a return."
          - name: return_reason_code
            description: "NAV return reason code. Candidate for a seed value map."
          - name: is_frozen_item
            description: "Boolean (0/1) — frozen item. Drives the fz weight/cube estimates on the header."
          - name: original_qty
            description: "Quantity before amendment. Against `quantity`, this exposes order editing — CONFIRM when NAV populates it."
          - name: ust_return_reason
            description: "UST-specific return reason (a customisation, not standard NAV). Candidate for a seed value map; ask the dev team for the code list."
          - name: override_oos
            description: "Boolean (0/1) — out-of-stock override at line level. The line-grain version of the header flag, and the more precise stockout signal."
          - name: loaddate
            description: "Ingestion watermark — pipeline run time (full load)."

      - name: sales_quota_header
        description: >
          Sales quota header — one row per quota_code with its period and an active
          flag. Targets, not actuals.
        config:
          external_location: "read_parquet('data/mock/navrep/sales_quota_header.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
        columns:
          - name: quota_code
            description: "Quota code — the PK."
          - name: begin_date
            description: "Quota period start."
          - name: end_date
            description: "Quota period end."
          - name: active
            description: "Boolean (0/1) — quota is active. NOTE the opposite polarity to customer.in_active."
          - name: loaddate
            description: "Ingestion watermark — pipeline run time (full load)."

      - name: sales_quota_line
        description: >
          Sales quota lines — grain quota_code + item_no + salesperson_code, giving
          the target quantity per salesperson per item. Pairs with sales_line
          actuals for attainment reporting.
        config:
          external_location: "read_parquet('data/mock/navrep/sales_quota_line.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
        columns:
          - name: quota_code
            description: "Quota this line belongs to. Joins to sales_quota_header.quota_code."
          - name: item_no
            description: "Item the target applies to. Joins to item.item_no."
          - name: salesperson_code
            description: "Salesperson the target applies to. Joins to sales_header.salesperson_code and, likely, mysql ust_admin_users.salesperson_code."
          - name: quota_quantity
            description: "Target quantity. CONFIRM the UOM before comparing to sales_line.quantity."
          - name: order_quota_qty
            description: "A second quota measure — CONFIRM how it differs from quota_quantity (plausibly order-count vs unit target, but do not assume)."
          - name: loaddate
            description: "Ingestion watermark — pipeline run time (full load)."

      # ═══ posted documents ══════════════════════════════════════════════════
      # THE SALES HISTORY. sales_header / sales_line above are OPEN documents
      # only and shrink as orders complete; these are where an order LANDS when
      # it posts, and they are the only complete record of what a customer
      # actually bought. They were present in the replica
      # (data/uc_schema_snapshot.csv) before being declared here — the note on
      # sales_header saying the posted tables "need to be added to the ADF export
      # first" was out of date; the export already carries them.
      #
      # THE ONE THING TO INTERNALISE: NOT ONE OF THESE CARRIES AN AMOUNT.
      # sales_invoice_line is eleven columns — item, quantity, UOM, salesperson,
      # posting date — with no unit price, no line amount and no invoice total,
      # and sales_invoice_header has no total either. So posted history answers
      # WHAT and HOW MANY, never HOW MUCH. Every dollar figure in this warehouse
      # comes from fct_orders.grand_total, which is parsed from the app submit
      # payload and therefore starts at var('event_log_go_live_date') and covers
      # app-channel orders only.
      #
      # Adding value means asking the ADF owner for the amount columns NAV
      # already holds on these tables: Sales Invoice Line [Unit Price],
      # [Line Amount], [Amount] and Sales Invoice Header [Amount],
      # [Amount Including VAT]. The marts downstream are shaped so those arrive
      # as extra columns, not as a remodelling.
      #
      # STILL ABSENT, and not obtainable from anything listed here:
      # Cust_ Ledger Entry. Without it there is no open balance, no due date, no
      # aging and no credit limit — so average AR days, the bounce-check warning
      # and "which accounts are past their terms" have NO source in this
      # warehouse at all. That is an ADF request, not a modelling problem.

      - name: sales_invoice_header
        description: >
          POSTED sales invoices — one row per document_no. The completed-order
          record sales_header cannot provide, and the spine of sales history.
          Carries the customer, the salesperson, order and posting dates and the
          physical shipment attributes. CARRIES NO AMOUNT — see the block comment
          above.
        config:
          external_location: "read_parquet('data/mock/navrep/sales_invoice_header.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
        columns:
          - name: document_no
            description: "Posted invoice number — the PK. A different number space from sales_header.document_no; an order is renumbered when it posts, so the two do NOT join."
          - name: bill_to_customer_no
            description: "Customer billed. Joins to customer.customer_no. NOTE this is BILL-TO — the line table's equivalent is sell_to_customer_no, and for a chain billing centrally the two differ. Prefer the line's sell_to for 'which store bought it'."
          - name: bill_to_name
            description: "Bill-to name."
          - name: bill_to_name_2
            description: "Bill-to name, second line."
          - name: bill_to_address
            description: "Bill-to street address."
          - name: bill_to_city
            description: "Bill-to city."
          - name: ship_to_name
            description: "Ship-to name — the store that received it."
          - name: ship_to_address
            description: "Ship-to street address."
          - name: ship_to_city
            description: "Ship-to city."
          - name: order_date
            description: "Date the original order was placed. Against posting_date, the order-to-invoice lag."
          - name: posting_date
            description: "GL posting date — when the invoice hit the books. THE DATE TO USE for sales history: it is the only date present on both the invoice lines and the credit-memo lines, so netting returns against sales needs both keyed on it."
          - name: shipment_date
            description: "Date shipped."
          - name: order_pick_date
            description: "Date the order was picked in the warehouse."
          - name: shipment_method_code
            description: "Shipment method."
          - name: customer_posting_group
            description: "Customer posting group snapshotted onto the invoice."
          - name: salesperson_code
            description: "Salesperson credited with the invoice. Joins to dim_reps.sales_code. Also present on the LINE, and the line's value is the one to trust for per-rep item history — a line can be credited differently from its header."
          - name: gen_bus_posting_group
            description: "General business posting group."
          - name: bill_to_post_code
            description: "Bill-to postal code."
          - name: bill_to_country_region_code
            description: "Bill-to country/region."
          - name: sell_to_post_code
            description: "Sell-to postal code."
          - name: sell_to_county
            description: "Sell-to county/state."
          - name: ship_to_post_code
            description: "Ship-to postal code."
          - name: ship_to_county
            description: "Ship-to county/state."
          - name: responsibility_center
            description: "Responsibility centre owning the invoice."
          - name: order_weight
            description: "Invoiced order weight."
          - name: order_cubage
            description: "Invoiced order cube."
          - name: pallet_count_total
            description: "Total pallets."
          - name: ust_ship_to_code
            description: "UST-specific ship-to code (a customisation). Candidate link to a customer's specific delivery address."
          - name: override_pallet_count
            description: "Manual pallet-count override."
          # ── added to the ADF export 2026-09-20 ──────────────────────────
          # Same partial coverage as the value columns on sales_invoice_line:
          # only rows exported from 2026-09-20 onward carry these.
          - name: due_date
            description: "When payment falls due. THE past-terms test, against the invoice's own terms rather than a company-wide assumption. NULL before 2026-09-20."
          - name: pda_order_no
            description: "Order number from the PDA channel, when the order came that way. NULL for web orders AND for orders keyed straight into NAV — so null is not 'not PDA', it is 'PDA number absent'."
          - name: m2_order_no
            description: "Magento order number, when the order originated on the website. Mutually exclusive with pda_order_no in practice; both null means neither channel stamped it."
          - name: loaddate
            description: "Ingestion watermark — pipeline run time (full load)."

      - name: sales_invoice_line
        description: >
          POSTED sales invoice lines — grain document_no + line_no. THE
          ITEM-LEVEL PURCHASE HISTORY: which customer bought which item, how many,
          when, and which rep sold it. The sales-agent questions about "what each
          account actually buys, item by item" and "what they've stopped buying"
          rest on this table.

          ELEVEN COLUMNS, AND NO MONEY. quantity is the only measure. There is no
          unit price and no line amount, so everything built on this is a UNIT
          history — "they buy 6 cases of X a month", never "they spend $400 a
          month on X". Nothing downstream may imply otherwise.

          QUANTITY IS IN unit_of_measure, WHICH VARIES BY LINE. A quantity of 6
          may be 6 cases or 6 eaches; item_unit_of_measure (item_no + uom_code)
          is what would normalise them, and until a model does, quantities must
          not be summed across lines with different UOMs without saying so.
        config:
          external_location: "read_parquet('data/mock/navrep/sales_invoice_line.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
        columns:
          - name: document_no
            description: "Posted invoice this line belongs to. Joins to sales_invoice_header.document_no."
          - name: line_no
            description: "Line number within the invoice. With document_no, the PK."
          - name: sell_to_customer_no
            description: "The customer that bought it, denormalised onto the line. Joins to customer.customer_no and thus straight to customer_key. PREFER THIS over the header's bill_to_customer_no for account-level history: a chain billed centrally still sells to individual stores."
          - name: item_no
            description: "Item bought. Joins to item.item_no and to jdawms prtmst.prtnum. NOTE there is no line_type column here (unlike sales_line and sales_cr_memo_line), so nothing distinguishes an item line from a charge or comment line — a non-item code arriving here simply fails to join to the item master, and join coverage is the only guard."
          - name: description
            description: "Item description snapshotted at invoice time. Useful for historical naming; prefer item.full_description for anything shown to a user today."
          - name: quantity
            description: "Quantity invoiced, in unit_of_measure. THE ONLY MEASURE ON THIS TABLE. Positive on a sale; returns live on sales_cr_memo_line and must be subtracted, not expected as negatives here."
          - name: unit_of_measure
            description: "UOM as TEXT, not a code — so it does not join cleanly to item_unit_of_measure.uom_code without normalisation. CONFIRM the value set before normalising quantities across lines."
          - name: salesperson_code
            description: "Salesperson credited with this line. Joins to dim_reps.sales_code. Line-level, so it beats the header value for attributing item history to a rep."
          - name: posting_date
            description: "Posting date, denormalised onto the line — so line-grain history needs no header join. This is the purchase date."
          # ── added to the ADF export 2026-09-20 ──────────────────────────
          # COVERAGE IS PARTIAL AND WILL STAY THAT WAY. These columns only exist
          # on rows exported from 2026-09-20 onward. The blob's historical seed
          # file still carries the old column list, and the daily exports are
          # DELTAS — a few thousand lines a day — so nothing re-reads history.
          # Measured 2026-09-23: 19,654,620 of 19,696,349 invoice lines have a
          # NULL amount, and only a re-export of the seed will change that.
          #
          # So a dollar figure is available for recent invoices and NOT for older
          # ones. Anything summing these must say which window it covers; a total
          # that silently spans both is a real number added to a lot of nulls.
          - name: amount
            description: "Line value NET of line discount — the posted amount. NULL before 2026-09-20; see the block above. This is the column to sum for revenue."
          - name: line_amount
            description: "Line value BEFORE invoice discount. At or above amount. Published alongside so a discount can be seen rather than inferred."
          - name: unit_price
            description: "Price per unit_of_measure_code. Useful for pricing an item the account has not bought; for what they actually paid, prefer amount / quantity."
          - name: qty_per_unit_of_measure
            description: >
              THE CONVERSION FACTOR, and the fix for the UOM problem. Base units
              per unit_of_measure_code — so a CASE line at quantity 6 is
              6 x this many base units. Snapshotted at invoice time, which is
              better than today's value in item_unit_of_measure: it reflects the
              pack size as it was when the sale happened.
          - name: unit_of_measure_code
            description: "UOM as a CODE, joining to item_unit_of_measure.uom_code. The free-text unit_of_measure above does not join cleanly; prefer this."
          - name: loaddate
            description: "Ingestion watermark — pipeline run time (full load)."

      - name: sales_cr_memo_header
        description: >
          POSTED credit memos — one row per document_no. The return/credit side of
          posted sales, and what any "net of returns" figure has to subtract.
          applies_to_doc_no links back to the invoice being credited, which is
          what makes a per-invoice return rate possible. CARRIES NO AMOUNT except
          freight_amount.
        config:
          external_location: "read_parquet('data/mock/navrep/sales_cr_memo_header.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
        columns:
          - name: document_no
            description: "Credit memo number — the PK."
          - name: bill_to_customer_no
            description: "Customer credited. Joins to customer.customer_no."
          - name: bill_to_name
            description: "Bill-to name."
          - name: bill_to_address
            description: "Bill-to street address."
          - name: bill_to_city
            description: "Bill-to city."
          - name: ship_to_name
            description: "Ship-to name."
          - name: posting_date
            description: "Posting date of the credit. The date to net returns against sales on."
          - name: posting_description
            description: "Free-text posting description — often the only statement of WHY the credit was raised, since the coded reason sits on the line."
          - name: shipment_method_code
            description: "Shipment method."
          - name: location_code
            description: "Location the return came back to."
          - name: customer_posting_group
            description: "Customer posting group."
          - name: applies_to_doc_no
            description: "The invoice this credit applies to. Joins to sales_invoice_header.document_no — the link that makes a per-invoice return rate computable. Expect nulls on standalone credits, which then net only at customer level."
          - name: gen_bus_posting_group
            description: "General business posting group."
          - name: bill_to_post_code
            description: "Bill-to postal code."
          - name: bill_to_county
            description: "Bill-to county/state."
          - name: bill_to_country_region_code
            description: "Bill-to country/region."
          - name: external_document_no
            description: "Customer's own reference for the return."
          - name: responsibility_center
            description: "Responsibility centre."
          - name: freight_option
            description: "Freight handling on the credit."
          - name: freight_amount
            description: "Freight amount credited. THE ONLY MONETARY COLUMN on any posted table in this replica — and it is freight, not merchandise, so it cannot stand in for invoice value."
          - name: freight_amount_per_pound
            description: "Freight amount per pound."
          - name: loaddate
            description: "Ingestion watermark — pipeline run time (full load)."

      - name: sales_cr_memo_line
        description: >
          POSTED credit memo lines — the items returned, with quantity and a
          return reason. Subtract these from sales_invoice_line for net units
          sold. NOTE THE COLUMN NAME: the item is cr_memo_item_no here, not
          item_no, and line_type gates which rows are real product returns.
        config:
          external_location: "read_parquet('data/mock/navrep/sales_cr_memo_line.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
        columns:
          - name: document_no
            description: "Credit memo this line belongs to. Joins to sales_cr_memo_header.document_no."
          - name: sell_to_customer_no
            description: "Customer returning. Joins to customer.customer_no."
          - name: line_type
            description: "NAV [Type] — same enum caveat as sales_line.line_type. CONFIRM the integer for Item before treating a row as a product return; charge and comment lines share this table."
          - name: cr_memo_item_no
            description: "Item returned. NOTE THE NAME — cr_memo_item_no, not item_no, and an item number only when line_type is Item. Joins to item.item_no."
          - name: location_code
            description: "Location the stock returned to."
          - name: posting_group
            description: "Posting group on the line."
          - name: shipment_date
            description: "Original shipment date."
          - name: description
            description: "Item description snapshotted at credit time."
          - name: unit_of_measure
            description: "UOM as text. Same normalisation caveat as sales_invoice_line — and the two must agree before a return quantity is subtracted from a sale quantity."
          - name: quantity
            description: "Quantity returned, POSITIVE. Subtract it; do not expect it signed."
          - name: gross_weight
            description: "Line gross weight."
          - name: shortcut_dimension_1_code
            description: "NAV shortcut dimension 1."
          - name: shortcut_dimension_2_code
            description: "NAV shortcut dimension 2."
          - name: gen_bus_posting_group
            description: "General business posting group."
          - name: gen_prod_posting_group
            description: "General product posting group."
          - name: responsibility_center
            description: "Responsibility centre."
          - name: item_category_code
            description: "Category snapshotted onto the line."
          - name: product_group_code
            description: "Product group snapshotted onto the line."
          - name: return_reason_code
            description: "NAV return reason code. Candidate for a seed value map — ask the dev team for the code list, as with sales_line.ust_return_reason."
          - name: is_frozen_item
            description: "Boolean (0/1) — frozen item."
          - name: size
            description: "Size descriptor."
          - name: salesperson_code
            description: "Salesperson on the credit. Joins to dim_reps.sales_code."
          - name: crv_charge
            description: "CRV (container redemption value) charge flag/amount — CONFIRM which."
          - name: invoice_no
            description: "The invoice being credited, at LINE level. Compare with the header's applies_to_doc_no; where both are populated they should agree."
          - name: posting_date
            description: "Posting date, denormalised onto the line."
          # ── added to the ADF export 2026-09-20 ──────────────────────────
          # COVERAGE IS PARTIAL AND WILL STAY THAT WAY. These columns only exist
          # on rows exported from 2026-09-20 onward. The blob's historical seed
          # file still carries the old column list, and the daily exports are
          # DELTAS — a few thousand lines a day — so nothing re-reads history.
          # Measured 2026-09-23: 19,654,620 of 19,696,349 invoice lines have a
          # NULL amount, and only a re-export of the seed will change that.
          #
          # So a dollar figure is available for recent invoices and NOT for older
          # ones. Anything summing these must say which window it covers; a total
          # that silently spans both is a real number added to a lot of nulls.
          - name: amount
            description: "Line value NET of line discount — the posted amount. NULL before 2026-09-20; see the block above. This is the column to sum for revenue."
          - name: line_amount
            description: "Line value BEFORE invoice discount. At or above amount. Published alongside so a discount can be seen rather than inferred."
          - name: unit_price
            description: "Price per unit_of_measure_code. Useful for pricing an item the account has not bought; for what they actually paid, prefer amount / quantity."
          - name: qty_per_unit_of_measure
            description: >
              THE CONVERSION FACTOR, and the fix for the UOM problem. Base units
              per unit_of_measure_code — so a CASE line at quantity 6 is
              6 x this many base units. Snapshotted at invoice time, which is
              better than today's value in item_unit_of_measure: it reflects the
              pack size as it was when the sale happened.
          - name: unit_of_measure_code
            description: "UOM as a CODE, joining to item_unit_of_measure.uom_code. The free-text unit_of_measure above does not join cleanly; prefer this."
          - name: loaddate
            description: "Ingestion watermark — pipeline run time (full load)."

      - name: item_ledger_entry
        description: >
          NAV item ledger — every posted inventory movement, one row per entry_no.
          The lowest-grain movement record in the replica, and an ALTERNATIVE
          route to purchase history: sales entries carry source_no (the customer),
          item_no, posting_date, quantity and salesperson_code.

          NOT USED as the history spine here, deliberately. This export has no
          entry_type / document_type column, so sales movements cannot be
          separated from receipts, transfers and adjustments — and quantity is
          signed across all of them, so summing it per customer mixes shipments
          with everything else. sales_invoice_line says "a customer bought this"
          unambiguously; this table needs a column the export does not carry
          before it can. Declared so it is visible in lineage and so the missing
          entry_type can be requested.
        config:
          external_location: "read_parquet('data/mock/navrep/item_ledger_entry.parquet')"
          loaded_at_field: loaddate
          freshness:
            warn_after: {count: 48, period: hour}
        columns:
          - name: entry_no
            description: "Ledger entry number — the PK."
          - name: item_no
            description: "Item moved. Joins to item.item_no."
          - name: posting_date
            description: "Posting date of the movement."
          - name: source_no
            description: "The counterparty — a customer number on a sales movement, a vendor on a purchase. WITHOUT entry_type there is no way to tell which, so joining it to customer.customer_no silently keeps only the rows that happen to match."
          - name: location_code
            description: "Location the movement occurred at."
          - name: quantity
            description: "Signed quantity — negative on an outbound sale, positive on a receipt. Mixing entry types therefore nets to something meaningless."
          - name: invoiced_quantity
            description: "Quantity invoiced against the movement."
          - name: unit_of_measure_code
            description: "UOM CODE — unlike the invoice and credit-memo lines, which carry UOM as free text. This one joins cleanly to item_unit_of_measure.uom_code."
          - name: item_category_code
            description: "Category snapshotted onto the entry."
          - name: product_group_code
            description: "Product group snapshotted onto the entry."
          - name: salesperson_code
            description: "Salesperson on the movement."
          - name: shipment_date
            description: "Shipment date."
          - name: customer_city
            description: "Customer city, denormalised."
          - name: customer_state
            description: "Customer state, denormalised."
          - name: loaddate
            description: "Ingestion watermark — pipeline run time (full load)."
