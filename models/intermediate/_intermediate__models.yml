version: 2

models:
  - name: int_events_decoded
    description: >
      Decode/parse spine for the system event log. Reads lossless staging and
      applies everything that is not a 1:1 source map: analytics renames, the
      8-digit description_code split into L1-L4, success/failure flags,
      event_time→UTC (per-row device offset) and created_at/updated_at→UTC
      (constant +8h from PST), location→lat/lon, and source decode into
      actor_type + a unified customer_key. Event grain — one row per record.
      int_events_enriched and all downstream facts/marts read from here.
    columns:
      - name: entity_id
        description: Primary key. One row per system event.
        tests: [not_null, unique]
      - name: sales_code
        description: Sales team / territory code; null when absent.
      - name: username
        description: Salesperson login on sales apps; customer account number on customer apps.
      - name: ust_customer_no
        description: Customer the salesperson is acting for; null on customer apps or when none selected.
      - name: device_name
        description: Device alias-model string.
      - name: source_code
        description: App source code the event came from.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [PDA-A, CatalogFC-A, CatalogFC-I, CatalogFS-I, CatalogFS-A, Vegas-I, Vegas-A, CatalogSE, Web, CatalogFC, Vegas]
      - name: app_version
        description: App version string.
      - name: description_code
        description: 8-digit hierarchical event code. Join key to seed_event_codes.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('seed_event_codes')
                field: description_code
              config:
                severity: warn
      - name: l1_code
        description: Level-1 segment of description_code. Top category.
      - name: l2_code
        description: Level-2 segment of description_code.
      - name: l3_code
        description: Level-3 segment of description_code.
      - name: l4_code
        description: >
          Level-4 (deepest) segment of description_code. Not interpreted here:
          success/failure is NOT derived because the outcome marker sits at
          different segments by family — apply outcome logic downstream JIT.
      - name: event_at_utc
        description: Device event time converted to UTC using the row timezone offset.
      - name: device_timezone
        description: Device UTC offset string.
      - name: created_at_utc
        description: Server created_at converted to UTC. Authoritative for ordering.
        tests: [not_null]
      - name: updated_at_utc
        description: Server updated_at converted to UTC. Latest wins on dedup.
      - name: event_id_at_utc
        description: Device-side epoch-millis event_id parsed to a UTC timestamp.
      - name: latitude
        description: Latitude parsed from the location string.
      - name: longitude
        description: Longitude parsed from the location string.
      - name: actor_type
        description: Sales for sales-app sources, otherwise customer.
        tests:
          - accepted_values:
              arguments:
                values: [sales, customer]
      - name: customer_key
        description: Unified customer key. ust_customer_no on sales apps, username on customer apps.
      - name: response
        description: Event payload string. Not JSON; format varies by event family.

  - name: int_events_enriched
    description: >
      Decoded events (int_events_decoded) joined to the event dictionary
      (seed_event_codes) and app-source registry (seed_app_sources), plus
      dictionary-driven classification: outcome (success/fail parsed from the
      dev team's "- Success/- Fail" function names), canonical feature_name /
      feature_group / page_context, and cart-edit flags. Classification applies
      only to dictionary-mapped codes; unmapped codes (legacy, junk) get nulls
      and are surfaced in dq_unmapped_event_codes. Event grain — one row per
      system_event_log record. Foundation for system-event analytics.
    columns:
      - name: entity_id
        tests: [not_null, unique]
      - name: outcome
        description: >
          success / fail parsed from the dictionary function name (the code
          segment that marks outcome differs by family, so the name is the
          authoritative marker). Null when the code has no outcome concept or
          is unmapped.
        tests:
          - accepted_values:
              arguments:
                values: [success, fail]
      - name: feature_name
        description: >
          Canonical product feature (action type). search=L1 12, filter=11,
          catalog_view=19, item_detail=14, image_enlarge=15, icon_click=L1 18
          icon taps, oos_check=name-based (families 10+18). Null for
          non-feature events.
        tests:
          - accepted_values:
              arguments:
                values: [search, filter, icon_click, catalog_view, item_detail, image_enlarge, oos_check]
      - name: customer_key
        description: >
          The customer the event acted on. REPAIRED here: a BLE-paired iPad hands
          its open cart to the PDA, so its own events arrive with no
          ust_customer_no, and every model filtering `customer_key is not null`
          was dropping that work. Filled from the pairing when it is missing —
          see customer_key_source, and the model header for the mechanism.
      - name: customer_key_source
        description: >
          Provenance for customer_key. 'event' = the app named it. 'ble_session' =
          taken from the customer the BLE connect event named. 'paired_pda' =
          taken from the customer the paired PDA had open. Null when there is no
          customer at all (background/system events). Filter to 'event' for
          anything that must be exact.
        tests:
          - accepted_values:
              arguments:
                values: ['event', 'ble_session', 'paired_pda']
      - name: is_ble_paired
        description: >
          Was an iPad BLE-paired to a PDA for this rep at this moment. Derived
          from the L1=17 BLE events and expired after
          var('ble_pairing_expiry_minutes'), because the app logs no reliable
          unpair event — ZERO Unpair / Forget Device in August 2026.
      - name: ble_pda_device
        description: >
          device_name of the PDA holding the pairing. The open order stays with
          THIS PDA across a handoff to another one, per the app team.
      - name: feature_group
        description: "Feature rollup: discovery / navigation / cart / stock."
      - name: page_context
        description: >
          Catalog section the action happened in, parsed from the function
          name: promo / backorder / history / suggest. Independent of
          feature_name (e.g. add_item_promo_page = cart add in promo section).
        tests:
          - accepted_values:
              arguments:
                values: [promo, backorder, history, suggest]
      - name: is_add
        description: Cart add event (codes 1005xxxx, dictionary-mapped only).
      - name: is_remove
        description: Cart remove event (codes 1004xxxx, dictionary-mapped only).
      - name: is_qty_change
        description: Cart quantity-change event (codes 1015xxxx, dictionary-mapped only).

  - name: int_item_demand_daily
    description: >
      App-side item demand, one row per sku x day x source_system. The single
      owner of SKU extraction from event payloads (positional cart payloads
      "sku,qty[,category]" and bare-sku item-detail/enlarge payloads); only
      skus shaped like a WMS item number (3-8 digits) are kept. sku values
      equal jdawms prtnum (verified 2026-07-13, 99.9% on clean columns).
      Materialized as a view over int_events_enriched — thin projection read
      once per mart build. source_system is 'event_log' today; the legacy
      tracking tables (history to 2023-09) union in here if pre-2026 history
      is ever needed. Demand history starts 2026-01-22 (event log go-live).
    config:
      tags: ["demand"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sku, activity_date, source_system]
    columns:
      - name: activity_date
        description: UTC calendar day of the events.
        tests: [not_null]
      - name: sku
        description: Item number extracted from the payload. Equals jdawms prtnum.
        tests: [not_null]
      - name: source_system
        description: Which log stream produced the row (event_log for now).
      - name: item_detail_views
        description: Item Detail opens (feature_name item_detail).
      - name: image_enlarge_views
        description: Item image enlarges (feature_name image_enlarge).
      - name: cart_adds
        description: Cart add events for the sku.
      - name: cart_removes
        description: Cart remove events for the sku.
      - name: cart_qty_changes
        description: Cart quantity-change events for the sku.
      - name: cart_add_qty
        description: Units added to cart (positional payload part 2; 0 when unparseable).
      - name: distinct_customers
        description: Distinct customer_key values interacting with the sku that day.
      - name: distinct_self_customers
        description: Distinct customers acting for themselves (actor_type customer).

  - name: int_jdawms_inventory_daily
    description: >
      WMS stock position, one row per item x warehouse x snapshot day —
      inv_snap deduped to the last snapshot per day with a proper
      snapshot_date. Day grain on purpose; weekly rollups belong to marts.
      CABOT warehouse only (the replica mirrors a single wh_id). Snapshots
      generate ~23:00 UTC, verified daily (51/60 days). ordered_qty,
      planned_qty and pnd_rcvqty keep their WMS names — in/outbound
      semantics not yet dev-confirmed. Materialized as a view.
    config:
      tags: ["jdawms", "wms"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [prtnum, prt_client_id, wh_id, snapshot_date]
    columns:
      - name: prtnum
        description: WMS item number. Equals the app-side sku.
        tests: [not_null]
      - name: prt_client_id
        description: Item owner (3PL client) — part of the WMS composite item key.
      - name: wh_id
        description: Warehouse (CABOT only in the current replica).
      - name: snapshot_date
        description: Calendar day the snapshot was generated.
        tests: [not_null]
      - name: snapshot_at
        description: Exact snapshot generation timestamp (gendte).
      - name: shippable_qty
        description: Units shippable that day — the availability measure.
      - name: on_hand_qty
        description: Units physically on hand.
      - name: ordered_qty
        description: WMS ordered quantity (verbatim; exact semantics unconfirmed).
      - name: planned_qty
        description: WMS planned quantity (verbatim; exact semantics unconfirmed).
      - name: pnd_rcvqty
        description: Pending-receipt quantity (verbatim; exact semantics unconfirmed).

  - name: int_jdawms_items
    description: >
      The WMS item master made readable — one row per item (prtnum +
      prt_client_id): prtmst attributes, English names from prtdsc, decoded
      ABC class from seed_jdawms_code_descriptions (the seed's first
      consumer). CABOT template rows override the '----' default, same
      convention as the seed. Generic item spine for SKU-level marts and
      the future dim_items surface for Unity Catalog / Genie. Materialized
      as a view (~5.7k rows).
    config:
      tags: ["jdawms", "wms"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [prtnum, prt_client_id]
    columns:
      - name: prtnum
        description: WMS item number. Equals the app-side sku (verified 99.9%).
        tests: [not_null]
      - name: prt_client_id
        description: Item owner (3PL client) — part of the WMS composite item key.
      - name: dsp_prtnum
        description: Display item number (equals prtnum in practice).
      - name: item_name
        description: US_ENGLISH long description from prtdsc.
      - name: item_short_name
        description: US_ENGLISH short description from prtdsc.
      - name: item_family
        description: WMS product family (prtfam).
      - name: abc_class
        description: ABC velocity class code (abccod).
      - name: abc_class_description
        description: Decoded ABC class from seed_jdawms_code_descriptions.
      - name: velocity_zone
        description: WMS velocity zone (velzon; no decode domain available yet).
      - name: stock_uom
        description: Stock-keeping unit of measure.
      - name: display_uom
        description: Display unit of measure.
      - name: receive_status
        description: Default receive inventory status (rcvsts; decode still open in the seed gaps).

  - name: int_jdawms_items_active
    description: >
      int_jdawms_items filtered to items with at least one invsts = 'A'
      (active) row in invsum, joined on prtnum only. prtmst/prtdsc carry
      every item ever set up (~5.7k); invsum only carries items currently
      tracked in the warehouse, so this is the "do we actually still sell
      this" filter — use this, not int_jdawms_items, wherever a match/
      recommendation is shown to a person (e.g. the social concept->SKU
      resolver) and a discontinued item would be a bad answer.
    config:
      tags: ["jdawms", "wms"]
    columns:
      - name: prtnum
        description: WMS item number. Equals the app-side sku (verified 99.9%).
        tests: [not_null]

  - name: int_jdawms_stock_weekly
    description: >
      Weekly in-stock signal per item, Monday-anchored — one row per item x
      warehouse x week. Rolls up int_jdawms_inventory_daily to the week the
      forecast pipeline consumes as its mandatory in-stock mask
      (SKU_stock_weekly.xlsx today). Mask reducer is shippable on ANY day:
      in_stock = 1 if shippable on at least one snapshot day. on_hand_qty /
      shippable_qty are end-of-week (last snapshot day), matching
      mart_item_demand_supply. n_days counts snapshot days present (inventory
      is already one row per day). CABOT warehouse only. No rolling-window
      filter — trailing windows belong to the reader.
    config:
      tags: ["jdawms", "wms", "forecast"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [prtnum, prt_client_id, wh_id, week_start]
    columns:
      - name: prtnum
        description: WMS item number. Equals the app-side sku.
        tests: [not_null]
      - name: prt_client_id
        description: Item owner (3PL client) — part of the WMS composite item key.
      - name: wh_id
        description: Warehouse (CABOT only in the current replica).
      - name: week_start
        description: Monday of the ISO week the snapshots fall in.
        tests: [not_null]
      - name: on_hand_qty
        description: End-of-week on-hand units (last snapshot day in the week).
      - name: shippable_qty
        description: End-of-week shippable units (last snapshot day in the week).
      - name: instock_frac
        description: Fraction of snapshot days in the week that were shippable (>0).
      - name: in_stock
        description: 1 if shippable on ANY snapshot day in the week (the forecast mask).
      - name: in_stock_all
        description: 1 only if shippable on EVERY snapshot day in the week.
      - name: n_days
        description: Snapshot days present in the week (inventory is one row per day).

  - name: int_social_concept_trends
    description: >
      WEEKLY trending boards — one row per (week_start, concept_class,
      concept_norm), DETERMINISTIC and LLM-free, recomputed/replaced each run.

      GRAIN: the CALENDAR WEEK (Monday-anchored posted_week). Each row aggregates
      only that week's mentions and is ranked against only that week's other
      concepts, because the report runs weekly and the point is to compare week
      against week — equal, non-overlapping periods, so "up 3 places" means exactly
      that. Known cost: a spike straddling a Sunday splits across two weeks and
      ranks lower in both (an earlier design used a trailing multi-week window to
      avoid that, at the price of overlapping periods that can't be compared week to
      week). Bounded to the latest social_trend_history_weeks COMPLETE weeks: a week
      still in progress is not computed at all until it finishes, so max(week_start) is
      always a finished week and never half-counted. The first week ever collected is
      dropped permanently, since it can never become complete.

      TWO RANKING CLASSES, ranked separately: 'dish' (from mentioned_dishes) and
      'item' (from ingredients, minus seed_social_generic_terms). trend_rank is
      row_number() partitioned by (week_start, concept_class), so a flood of viral
      dishes can no longer crowd stockable items off the board. Brands are still not
      ranked (retailers / delivery platforms / influencers / restaurants — unbounded,
      none stockable).

      trend_score is AUTHOR-DIVERSITY based (distinct_authors_adj x log-dampened,
      per-channel-normalised engagement/views), replacing a pure mention-volume
      score that correlated ~0.86 with raw mention_count. See author_quality below
      for why the exclusion rule runs on named (non-anonymised) authors, not the
      raw count.
      Channel medians are per (week, channel) with an all-history fallback for thin
      windows; the shared-post divisor is per mention within class. For rise, use
      mention_share / mention_share_change (volume-neutral) over is_rising.

      Cross-language dupes (som tam / ส้มตำ) rank separately — the LLM resolver
      canonicalises them downstream. The GATE scripts/resolve_trending_concepts.py
      reads to pick the CURRENT week's top-N concepts per class (only rows with a
      non-null trend_rank — see trend_rank below).

      {{ doc('social_time_windows') }}
    config:
      tags: ["social"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [week_start, concept_class, concept_norm]
    columns:
      - name: week_start
        description: >
          The as-of week (Monday-anchored) this row's board belongs to. Grain leader.
          "Now" is max(week_start); each row summarises the trailing window ending
          in this week, not this week's mentions alone.
        tests: [not_null]
      - name: concept_class
        description: >
          Which ranking space this row belongs to — 'dish' (from mentioned_dishes:
          what people talk about) or 'item' (from ingredients minus the generic
          stoplist: things that can plausibly be a SKU). Ranked separately on
          purpose; the same folded string can appear in both.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['dish', 'item']
      - name: concept_norm
        description: Normalised concept text (lower+trim, accent-folded, trailing LLM gloss stripped). Joins to concept_resolution; unique only WITH week_start + concept_class.
        tests: [not_null]
      - name: week_end
        description: Last day of the calendar week (week_start + 6). Present so a consumer never has to re-derive the period.
        tests: [not_null]
      - name: week_of_year
        description: >
          ISO week number (1-53) of week_start — "week 34". Report-facing; week_start
          is still the column to sort and join on.
      - name: year_week
        description: >
          Sortable ISO week label, "2026-W34". The YEAR is the ISO year (taken from the
          week's Thursday), not the calendar year of week_start: Monday 2025-12-29
          belongs to 2026-W01, and labelling it "2025-W01" would be wrong.
      - name: mention_count
        description: Distinct food-relevant, non-spam mentions naming this concept THAT WEEK.
      - name: mention_share
        description: >
          mention_count / all (concept, mention) pairs that week in that class. The
          measure to trust across weeks: shares sum to ~1 within a class, so if
          collection volume doubles — or a week is partial — every share is still
          comparable. Guarded by assert_social_concept_trends_mention_share_sums.
      - name: total_engagement
        description: Summed ACTIVE engagement (likes + comments + shares) across those mentions (deduped per mention). Published by mart_social_trending_items; the ranking itself uses the per-channel-normalised engagement_norm, not this raw sum.
      - name: total_views
        description: Summed views across those mentions (video/post view counts). Published by mart_social_trending_items; the ranking uses views_norm, not this raw sum.
      - name: is_rising
        description: >
          mention_share went UP versus the previous week with a row. REDEFINED at this
          grain: it used to compare the recent half of a multi-week window against the
          older half, which was noisy and volume-driven (~85% of concepts read as
          "rising"). A real previous week is now available, so this is a true
          week-over-week rise. NULL on a concept's first week — nothing to compare to,
          which is not the same as "not rising". Does NOT drive the rank.
      - name: distinct_authors_adj
        description: >
          Distinct authors naming this concept, channel-scoped (author_key = channel + profile,
          so the same handle on two platforms counts twice, correctly). Rows with an anonymised
          placeholder profile (see author_quality) each count as their own unknown author rather
          than collapsing to one — Instagram's API anonymises ~97% of its rows, confirmed with
          Mentionlytics as their limitation, not evidence those rows share one real poster.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= mention_count"
      - name: named_authors
        description: Distinct authors among NON-anonymised mentions only. The denominator for author_quality — anonymised rows are excluded, not counted as diverse.
      - name: named_mentions
        description: Count of non-anonymised mentions. The numerator for author_quality.
      - name: subject_mentions
        description: >
          Mentions where the post is ABOUT this concept. Requires enrichment prompt v4;
          see subject_products on fct_social_mentions.
      - name: ingredient_mentions
        description: >
          Mentions where the concept was named as a component of something else — a
          recipe ingredient, a step, one line on a menu. Real demand signal for a
          distributor, but not product conversation, which is why it is reported
          separately rather than netted off.
      - name: unlabelled_mentions
        description: >
          Mentions not yet re-labelled at prompt v4, so their role is unknown.
          subject_mentions + ingredient_mentions + unlabelled_mentions = mention_count
          always (asserted by assert_social_mention_roles_sum). Goes to zero once the
          v4 backfill completes; until then it is the honest denominator for the split.
      - name: has_subject_evidence
        description: >
          True when at least one mention is ABOUT the concept. When false, source_links
          are posts that merely named it — the best available evidence, but read
          differently.
      - name: channel_count
        description: Distinct channels this concept was mentioned on. Drives is_single_channel.
      - name: author_quality
        description: >
          'verified' (named_mentions >= social_trend_v2_min_named_mentions AND
          named_mentions/named_authors <= social_trend_v2_max_mentions_per_named_author) |
          'repeat_poster' (same named_mentions floor, but the ratio is too high — one or few
          real accounts driving the volume; EXCLUDED from trend_rank) | 'unverifiable' (too few
          named mentions to judge either way — stays ranked, flag stays visible; an
          Instagram-heavy concept is not silently dropped just because we can't verify it).
        tests:
          - accepted_values:
              arguments:
                values: ['verified', 'repeat_poster', 'unverifiable']
      - name: is_single_channel
        description: >
          channel_count < 2. A DAMPENER (social_trend_v2_single_channel_dampener), not an
          exclusion — measured at ~5% of the actual top-20 vs ~38% of the full long tail, and a
          single-platform trend (TikTok-only food virality is common and legitimate) isn't
          evidence of anything wrong.
      - name: trend_score
        description: >
          distinct_authors_adj x (1 + ln(1+engagement_norm)/eng_weight + ln(1+views_norm)/views_weight)
          x (single_channel_dampener if is_single_channel else 1). engagement_norm/views_norm are
          each mention's engagement/views divided by (a) its own channel's median for that metric —
          so a Twitter post and a TikTok post are judged on their own platform's scale, not each
          other's — and (b) how many OTHER concepts that same mention also names, so one post
          doesn't give full credit to every dish it lists. Weights in dbt_project.yml
          (social_trend_v2_*) are starting points pending backtest, not final tuned values.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: source_links
        description: Array of the top social_trend_link_count mention URLs behind this concept THAT WEEK (by reach then engagement). Top-N set, order not guaranteed.
      - name: trend_rank
        description: >
          1..N by trend_score desc WITHIN (week_start, concept_class) — each week's
          dishes and items have their own 1..N, which is the mechanism that stops one
          class masking the other. Among concepts where author_quality !=
          'repeat_poster' only: excluded concepts get NULL here (not a rank past the
          end), so they stay in this table for inspection but a plain `trend_rank <= N`
          filter (used by both the mart and scripts/resolve_trending_concepts.py)
          already excludes them with no extra clause needed. NULL is also legitimate
          mid-trajectory — author_quality is judged per window, so a concept can be
          excluded in one week and ranked in the next. Density within each rank space
          is asserted by assert_social_concept_trends_rank_is_dense, and separation of
          the two classes by assert_social_concept_trends_classes_ranked_separately.
      - name: prev_week_start
        description: >
          The concept's previous week WITH A ROW in this class — which is NOT always
          last week: lag() runs over OBSERVED weeks, and a week where the concept fell
          below social_trend_min_mentions produces no row and is skipped. Always
          populated when the concept has an earlier row, even a distant one, so a
          longer-range comparison stays available to anyone who explicitly wants it.
      - name: prev_trend_rank
        description: trend_rank in prev_week_start (null if that week had no rank).
      - name: rank_change
        description: >
          prev_trend_rank - trend_rank, so POSITIVE means the concept moved UP the
          board (8 -> 3 is +5). STRICT: populated only when prev_week_start is exactly
          the previous calendar week, so a number here always means "versus last week".
          NULL means no like-for-like comparison exists — first appearance, a skipped
          week, or a week either side was excluded as repeat_poster. NEVER coalesce it
          to 0, which reads as "held rank".
      - name: prev_mention_count
        description: mention_count in prev_week_start.
      - name: mention_count_wow_pct
        description: >
          Fractional change in mention_count vs LAST WEEK (0.75 = +75%). Same strict
          consecutive-week rule as rank_change. Not volume-neutral — prefer
          mention_share_change, especially across a partial week.
      - name: prev_mention_share
        description: mention_share in prev_week_start.
      - name: mention_share_change
        description: >
          mention_share - prev_mention_share, under the same strict consecutive-week
          rule. The volume-neutral movement signal: unaffected by the corpus growing or
          shrinking, or by the week being partial.

  - name: int_rep_customer_activity
    description: >
      Assigns every rep work event to a rep-customer-day, and to a session
      within it. Event grain. Shared spine for mart_rep_customer_activity (rolled up
      per customer-day) and mart_rep_customer_activity_events (event-grain
      drill-down), so the session heuristic is defined once. A session is a run
      of one rep's activity on ONE customer with no idle gap of
      var('activity_gap_minutes') (30) or more; sessions for different customers
      may overlap in time, which is correct, because reps work several open
      orders at once. Work events only (cart edits, discovery features, order
      create and send); background pings are excluded so they cannot inflate
      durations.
    columns:
      - name: entity_id
        description: Event id, unique, the PK.
        tests: [not_null, unique]
      - name: customer_day_key
        description: sales_code-customer_key-activity_date; the key both marts join on.
        tests: [not_null]
      - name: session_seq
        description: Which sitting on that customer the event belongs to.
      - name: event_seq
        description: Position of the event within its customer-day (1 = first).
      - name: seconds_since_prev_event
        description: >
          Dwell on the previous step. Null on a session's first event: the gap
          before it is idle time, not work on this customer.
      - name: device
        description: PDA / iPad / Android tablet.
      - name: device_group
        description: >
          Same as device, EXCEPT 'PDA + iPad (paired)' while BLE-paired. Use this
          for anything that measures time: while paired the rep drives the iPad
          from the PDA and events alternate every few seconds, so treating them
          as two devices bills the time between them to neither.
      - name: is_ble_paired
        description: >
          Was the iPad BLE-paired to a PDA at this moment. Derived from the L1=17
          BLE events, expiring after var('ble_pairing_expiry_minutes') because
          the app logs no reliable unpair event (ZERO Unpair / Forget Device in
          August 2026).
      - name: ble_pda_device
        description: >
          device_name of the PDA holding the pairing. The order stays with THIS
          PDA across a handoff to another one, per the app team.
      - name: customer_key_source
        description: >
          Passed through from int_events_enriched, where the repair happens.
          'event' = the app named the customer; 'ble_session' / 'paired_pda' =
          inherited because BLE pairing had moved the open cart to the PDA.
          Filter to 'event' for anything that must be exact.
      - name: increment_id
        description: Order number; populated on submit rows only, and exact.

  - name: int_rep_customer_presence
    description: >
      Where a rep physically was, from GPS. One row per rep x customer x VISIT
      (the same customer twice in a day is two rows). Derived INDEPENDENTLY of
      app activity on purpose: a visit that produced no typing has no activity
      row to hang off, so joining GPS onto activity would erase exactly the case
      the business most wants counted. Pipeline, each step justified by a
      measured failure: drop hops over presence_max_mph within a device track
      (97% of impossible-travel hops are device changes); exclude the company
      office, test/internal accounts by key, and inactive accounts; match each
      fix to EVERY customer within presence_geofence_metres, not just the
      nearest; group consecutive fixes into visits on presence_visit_gap_minutes,
      BRIDGING a gap when there is app activity for that same customer inside it;
      drop visits under presence_min_dwell_minutes (0 — dwell no longer gates).
      Visits are grouped per CUSTOMER, not per device: splitting on device made
      3,825 of 6,266 August visits report 0 minutes and understated total on-site
      time by roughly half. Ambiguity is PUBLISHED not hidden — 21.2% of
      customers have another customer within 100m.
    columns:
      - name: customer_day_key
        description: sales_code-customer_key-activity_date; joins to the activity models.
        tests: [not_null]
      - name: sales_code
        description: Rep territory code.
        tests: [not_null]
      - name: customer_key
        description: The customer whose geofence the rep was inside.
        tests: [not_null]
      - name: activity_date
        description: Date in the rep's local time (modal offset per rep-day).
        tests: [not_null]
      - name: visit_seq
        description: 1st, 2nd visit to that customer that day.
      - name: arrived_at
        description: First fix inside the geofence, rep local time.
      - name: departed_at
        description: Last fix inside the geofence, rep local time.
      - name: on_site_minutes
        description: >
          Minutes between arrival and departure. Measured per visit, NOT
          first-to-last across the day: min-to-max lumped two stops plus lunch
          into one 187-minute "visit" during prototyping.
      - name: closest_metres
        description: Nearest any fix in this visit got to the customer's address.
      - name: fix_count
        description: GPS fixes behind this visit.
      - name: is_ambiguous
        description: >
          True when another ACTIVE customer also sat inside the geofence for any
          fix in this visit — the match is plausible, not proven. Inactive
          accounts no longer count toward this and lose every tie-break, which is
          what stopped a dead account at a shared address from winning on row
          order. "Nearest" is still a coin flip where two live customers sit
          within GPS error of each other. Exclude these from strict visit counts.
      - name: devices
        description: >
          Every device that recorded this visit, sorted and de-duplicated. A
          visit is no longer split per device, so this is normally more than one:
          reps carry 3-5 and they interleave.
      - name: rep_day_offset_hours
        description: >
          Hours from UTC used to place this rep-day in local time. Published so
          the shared-clock invariant with int_rep_customer_activity is TESTABLE
          rather than merely asserted — the two models must read a visit and the
          session inside it against the SAME offset, and an hour-wide
          disagreement once made a two-hour on-site stretch report as three
          minutes. See tests/assert_presence_and_activity_share_one_clock.sql.
      - name: owner_rep
        description: >
          The rep NAV says owns this account (salesperson_code). Not necessarily
          the rep whose GPS matched — used downstream to decide a visit that has
          no device record naming the customer.
      - name: is_owned_by_rep
        description: >
          True when owner_rep equals the rep who was there. A visit with NO app
          activity requires this: standing near a store that belongs to another
          rep is not evidence of calling on it.
      - name: fix_ids
        description: >
          entity_id of every GPS fix behind this visit, sorted and de-duplicated.
          Published so a consumer can ask whether two visits are the SAME MOMENT
          rather than merely overlapping — one fix matches several customers, so
          an identical fix set means one position seen through two geofences.


  - name: int_customer_item_purchases
    description: >
      What each account actually bought, one row per CUSTOMER x ITEM x POSTING
      DATE x UOM. Posted NAV invoice lines netted against posted credit-memo
      lines. The base of every item-level sales-agent answer.

      THE UOM IS PART OF THE GRAIN, deliberately. NAV records UOM as free TEXT,
      not as the code item_unit_of_measure is keyed on, so there is no conversion
      available: a line reading `6 CASE` and one reading `6 EA` are six of
      genuinely different things and collapsing them produces "12", which is true
      of nothing. Keeping UOM in the grain makes the ambiguity VISIBLE as two
      rows instead of silently wrong as one.

      NETTING IS BY POSTING DATE, not against the invoice being credited. NAV
      does carry the link back (applies_to_invoice_no), so crediting the original
      day is technically possible; it is not done because it would make this
      table retroactively mutable — a return posted today would change a quantity
      reported three months ago and everything derived from it. Posting-date
      netting keeps history immutable and matches how the business reads its own
      ledger.

      NO AMOUNTS EXIST ANYWHERE IN THIS CHAIN. sales_invoice_line is eleven
      columns and none is money. This is a UNIT history: how many, how often,
      when — never how much.

      WHY NOT item_ledger_entry, which is finer-grained and would need no
      netting: this export of it has no entry_type column, so sales movements
      cannot be told apart from receipts, transfers and adjustments, and its
      quantity is signed across all of them. It is declared as a source and left
      unused for exactly that reason.
    columns:
      - name: customer_key
        description: The account that bought. NAV sell_to, joining to dim_customers.
        tests: [not_null]
      - name: item_no
        description: The item. Joins to dim_items.
        tests: [not_null]
      - name: posting_date
        description: The day it posted. Sales and returns are both keyed on this.
        tests: [not_null]
      - name: quantity_uom
        description: >
          Part of the grain — see the model description. Uppercased free text, not
          a code.
      - name: sold_quantity
        description: Quantity invoiced on this item-day, in quantity_uom.
      - name: returned_quantity
        description: Quantity credited back on this item-day, POSITIVE.
      - name: net_quantity
        description: >
          sold minus returned. CAN BE NEGATIVE — a return posting on a day with no
          sale, including a day with no sale at all. That is not a bug; it is a
          return posting on a day of its own. Downstream models asking "did they
          buy on this day" must test sold_quantity > 0, NEVER this: a lone credit
          memo is not a purchase, and treating it as one would reset an account's
          "last bought" clock to the day it sent something back.
      - name: invoice_count
        description: >
          DISTINCT invoices on this item-day, not lines: two lines of the same
          item on one invoice are one purchase event.
      - name: cr_memo_count
        description: Distinct credit memos on this item-day.
      - name: sales_code
        description: >
          The rep credited with the movement, taken at LINE level. min() where an
          item-day spans documents credited to different reps — rare, but real
          when an account changes hands mid-period.
      - name: sales_code_count
        description: >
          How many distinct reps were credited on this item-day. Above 1 means
          sales_code above is one of several, so a per-rep consumer can see that
          this row is not cleanly one rep's rather than having it hidden.
      - name: is_purchase_day
        description: >
          sold_quantity > 0. Exists so no downstream model has to re-derive the
          rule, and so none gets it wrong by testing net_quantity instead.
      - name: sold_quantity_base
        description: Sold quantity in BASE units — addable across UOMs, unlike sold_quantity. Null before 2026-09-20.
      - name: returned_quantity_base
        description: Returned quantity in base units. Same coverage window.
      - name: sold_value
        description: >
          Money sold on this item-day. PARTIAL COVERAGE: null before 2026-09-20
          and permanently so. sum() ignores nulls, so a period straddling that
          date returns only the valued part — compare valued_line_count with
          line_count before quoting it.
      - name: returned_value
        description: Money credited back on this item-day. Same coverage window.
      - name: net_value
        description: sold_value minus returned_value. Can be negative on a day whose credits exceed its sales.
      - name: line_count
        description: Lines on this item-day, valued or not — the denominator for value coverage.
      - name: valued_line_count
        description: >
          How many of those lines carry an amount. Below line_count means the
          value columns describe only part of what moved that day.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [customer_key, item_no, posting_date, quantity_uom]
      # EVERY ROW CAME FROM AT LEAST ONE LINE. That is the real invariant.
      #
      # This used to assert `sold_quantity > 0 or returned_quantity > 0`, and it
      # failed on 2,440,702 rows the first time it met production. The assertion
      # was wrong, not the data: 2,490,061 invoice lines carry quantity = 0 on
      # real items -- MOGU LYCHEE NATA DE COCO, DF SWEET SOY SAUCE -- because the
      # item was invoiced and NOTHING SHIPPED. A cut line, or one that went out of
      # stock between order and pick. A further 4,473 lines are negative.
      #
      # Those rows are kept deliberately. "Invoiced but shipped nothing" is a
      # real event and arguably a useful one; dropping it would hide every cut
      # line in the warehouse. is_purchase_day (sold_quantity > 0) is what
      # separates it from an actual sale, and int_customer_item_cadence already
      # gates its gap series on the same rule, so no rhythm is polluted by a day
      # on which nothing moved.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "line_count > 0"

  - name: int_customer_item_cadence
    description: >
      One row per CUSTOMER x ITEM: how often this account buys this item, when
      they last did, and when they are due again ON THEIR OWN RHYTHM.

      THE RHYTHM IS DERIVED PER ACCOUNT-ITEM, and that is the point of the model.
      A restaurant buying fish sauce every 3 weeks and a grocery buying it every
      3 months are both healthy, and any fixed "overdue after N days" threshold
      slanders one of them. The business note asking for "quarterly vs. monthly
      customer (some customer might need to be on quarterly since we visit every
      other 6 weeks)" is answered by this column rather than by a segmentation
      somebody has to maintain.

      THREE PURCHASES MINIMUM before a rhythm is published at all
      (var account_item_min_purchases_for_cadence). Two purchases give exactly
      one gap, and a median of one number is that number — an account that
      happened to buy twice a fortnight apart would be declared a fortnightly
      buyer and reported overdue three weeks later. Below the floor the cadence
      columns are NULL and reorder_status reads 'rhythm unknown', which is a
      usable answer where a fabricated rhythm is not.

      COLLAPSES THE UOM that int_customer_item_purchases keeps in its grain, and
      only the DATES survive that intact. "When did they last buy this" is
      UOM-independent; "how many" is not. So cadence is computed across all UOMs
      and QUANTITIES are restricted to the account's PRIMARY UOM, with
      quantity_uom_count published so a consumer sees when that hid something.

      MEASURED AGAINST THE NAV CLOCK (macros/nav_posted_today.sql), not the event
      log's. Invoices post on their own schedule, days after an order is keyed
      and whether or not anyone opened the app, so ageing a purchase against the
      app's leading edge would skew every number here by the drift between two
      independent feeds.
    columns:
      - name: customer_key
        description: The account.
        tests: [not_null]
      - name: item_no
        description: The item.
        tests: [not_null]
      - name: purchase_as_of_date
        description: >
          THE NAV CLOCK — the newest posted invoice date. Every age in this table
          is measured against it. It is NOT rep_log_today(), and a mart carrying
          both must publish both.
      - name: times_purchased
        description: >
          Distinct days on which this account bought this item. Days carrying only
          a credit memo are excluded: a return is not a purchase.
        tests: [not_null]
      - name: first_purchase_date
        description: Earliest purchase on record in the posted-invoice export.
      - name: last_purchase_date
        description: Most recent purchase day.
      - name: days_since_last_purchase
        description: Days from last_purchase_date to purchase_as_of_date.
      - name: median_days_between_purchases
        description: >
          THE ACCOUNT'S OWN RHYTHM for this item. NULL below the purchase floor
          rather than computed from a single gap. An account with n purchases
          contributes n-1 gaps — the first purchase has no predecessor and yields
          a null the median ignores.
      - name: avg_days_between_purchases
        description: >
          The mean gap. Published beside the median because a big divergence
          between them is itself a signal that the buying is irregular.
      - name: min_days_between_purchases
        description: Shortest observed gap. Not floored by the purchase minimum.
      - name: max_days_between_purchases
        description: Longest observed gap — the honest upper bound on "normal" for this pair.
      - name: expected_next_purchase_date
        description: last_purchase_date + the pair's own median gap. Null when the rhythm is unknown.
      - name: days_overdue
        description: >
          SIGNED: days_since_last_purchase minus the median gap. Negative means
          due in that many days, which is itself a reason to call today.
      - name: reorder_status
        description: >
          ONE reason per row, in precedence order, so a consumer reads out a cause
          instead of re-deriving one from five columns. 'lapsed' fires at
          var('account_item_lapsed_gap_multiple') times the account's own median
          gap, so a quarterly buyer must miss roughly two quarters before anyone
          says they stopped. 'due' opens slightly BEFORE the expected date
          (account_item_due_window_pct) because a rep needs to call ahead of the
          reorder. 'rhythm unknown' is an honest answer and is kept DISTINCT from
          'not due': the first means we cannot tell, the second means we can and
          they are fine.
        tests:
          - accepted_values:
              arguments:
                values: ['lapsed', 'overdue', 'due', 'not due', 'rhythm unknown']
      - name: reorder_priority
        description: >
          1 = act first. Mirrors reorder_status exactly so `order by` gives the
          pitch list without the consumer needing to know the precedence.
      - name: quantity_uom_count
        description: >
          How many distinct UOMs this account has bought this item in. Above 1
          means the quantity columns below cover only the commonest.
      - name: primary_quantity_uom
        description: >
          The UOM bought on the most separate days. Ties break on quantity then
          alphabetically, so the pick is deterministic across runs and engines.
      - name: sold_quantity_primary_uom
        description: >
          Total bought, RESTRICTED to the primary UOM. Deliberately not a sum
          across UOMs — NAV's UOM is free text with no conversion, so a cross-UOM
          total is true of nothing.
      - name: returned_quantity_primary_uom
        description: Total returned in the primary UOM.
      - name: net_quantity_primary_uom
        description: Sold minus returned, primary UOM only.
      - name: avg_quantity_per_purchase
        description: >
          sold_quantity_primary_uom / times_purchased — what a typical reorder
          looks like, in the account's own UOM. QUANTITY ONLY; there is no price
          to turn it into a value.
      - name: invoice_count
        description: Distinct invoices carrying this item for this account.
      - name: cr_memo_count
        description: Distinct credit memos carrying it.
      - name: returned_quantity_all_uoms
        description: >
          Total returned across ALL UOMs. Mixed-UOM by construction, and named to
          say so — used for a unit return RATE, which is the only kind available.
      - name: last_return_date
        description: Most recent day this account returned this item. Null if never.
      - name: sales_code
        description: The rep credited with this account's purchases of this item.
      - name: sold_value
        description: >
          Total money this account has spent on this item. UOM-independent, so
          unlike the quantity columns it is not restricted to the primary UOM —
          but it covers a SHORTER PERIOD than every date column here, starting
          2026-09-20. Compare valued_purchase_days with times_purchased.
      - name: returned_value
        description: Total credited back. Same coverage window.
      - name: line_count
        description: Lines across the whole relationship, valued or not.
      - name: valued_line_count
        description: How many carry an amount.
      - name: valued_purchase_days
        description: >
          Purchase days carrying any value. EQUAL to times_purchased means the
          money covers the whole relationship; lower means it covers only its
          recent part. The column that stops a value total being read as though
          it matched the purchase count.
      - name: avg_value_per_purchase
        description: >
          sold_value / valued_purchase_days — divided by the VALUED days, not by
          times_purchased, so it is not deflated by the unvalued history.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [customer_key, item_no]
      # the purchase floor is what makes a published rhythm meaningful; if a
      # rhythm ever appears below it, the floor has stopped being applied
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              median_days_between_purchases is null
              or times_purchased >= 3
      # every row exists because something was bought
      - dbt_utils.expression_is_true:
          arguments:
            expression: "times_purchased > 0"
