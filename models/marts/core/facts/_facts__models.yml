version: 2

models:
  - name: fct_orders
    description: >
      Submitted-order fact — one row per Group 04 submit-success, keyed on the
      M-prefixed increment_id parsed from the KV payload (latest wins on
      resubmit). EXACT and self-contained: it does NOT join to Create Order (09)
      because submit ids (M…) and create ids (032-…) are different ID spaces with
      zero overlap, so order shopping-cycle / days-to-close is not reconstructable
      from this source. Carries
      order value + channel. Powers #1 Revenue/AOV and P1 order-volume.
    columns:
      - name: increment_id
        description: Magento order increment id (M-prefixed), parsed from the submit payload.
        tests: [unique, not_null]
      - name: customer_key
        description: Unified customer key the order belongs to.
      - name: actor_type
        description: sales or customer, from the originating app source.
      - name: source_code
        description: App source code the submit event came from (PDA-A, Web, etc.).
      - name: app_name
        description: App the submit came from, from seed_app_sources.
      - name: sales_code
        description: Sales territory code, when a sales app facilitated the order.
      - name: username
        description: Login account that submitted (salesperson or customer account).
      - name: submitted_at
        description: Submit event time in UTC.
        tests: [not_null]
      - name: submitted_date
        description: >
          Calendar date of submitted_at, in UTC. Correct for company-wide
          totals; WRONG for anything keyed on a rep's day, week or month, where
          a 17:30 Pacific submit lands on the following day and at a month
          boundary moves revenue into the wrong month. Use
          submitted_date_local for per-rep reporting.
      - name: submitted_date_local
        description: >
          The REP-DAY this submit belongs to, carried straight through from
          int_events_enriched.rep_local_date rather than re-derived — one
          timezone offset is chosen per rep-day upstream, and re-deriving a
          local date from a timestamp can land on the neighbouring day. This is
          the column every per-rep daily / weekly / monthly rollup must group
          by, and mart_rep_daily_status and mart_rep_account_status both do.
          Null for submits with no rep-day clock (customer-app orders).
      - name: order_channel
        description: >
          Coarse channel from the payload order_source (WEB / APP / PDA),
          upper-cased. Distinct from source_code.
      - name: grand_total
        description: Order grand total from the payload (double).
      - name: subtotal
        description: Order subtotal from the payload (double).
      - name: freight_and_adj
        description: grand_total - subtotal (freight, tax, and adjustments).
      - name: total_item_count
        description: Number of line items on the order, from the payload.

  - name: fct_events
    description: >
      Published event-grain fact — the denormalised event spine. One row per
      system_event_log record = int_events_enriched (decoded spine + event
      dictionary + app-source registry) materialised for BI, plus the raw
      payload. No payload-derived columns: per-family fields (cart sku/qty,
      search query, viewed sku, catalog dwell, price overrides, feature titles)
      are parsed just-in-time from `response` when a dashboard needs them, since
      the payload is non-JSON and drifts by app version.
    columns:
      - name: entity_id
        description: Primary key. One row per event.
        tests: [unique, not_null]
      - name: event_at_utc
        description: Device event time converted to UTC.
      - name: customer_key
        description: Unified customer key (ust_customer_no on sales apps, username on customer apps).
      - name: actor_type
        description: sales or customer.
      - name: source_code
        description: App source code (PDA-A, Web, …).
      - name: app_name
        description: App the event came from, from seed_app_sources.
      - name: app_platform
        description: Device platform (iOS / Android / Web), from seed_app_sources.
      - name: app_user_type
        description: Sales or Customer app, from seed_app_sources.
      - name: description_code
        description: 8-digit hierarchical event code.
      - name: l1_category_name
        description: Event family name from seed_event_codes (denormalised).
      - name: function_name
        description: Specific event function name from seed_event_codes (denormalised).
      - name: outcome
        description: success / fail parsed from the dictionary name; null when no outcome concept.
      - name: feature_name
        description: >
          Canonical product feature (search, filter, icon_click, catalog_view,
          item_detail, image_enlarge, oos_check). Null for non-feature events.
      - name: feature_group
        description: "Feature rollup: discovery / navigation / cart / stock."
      - name: page_context
        description: "Catalog section: promo / backorder / history / suggest."
      - name: is_add
        description: Cart add event (1005xxxx).
      - name: is_remove
        description: Cart remove event (1004xxxx).
      - name: is_qty_change
        description: Cart quantity-change event (1015xxxx).
      - name: response
        description: Raw payload string (non-JSON). Parsed per-family downstream when needed.

  - name: fct_order_cycles
    description: >
      One row per shopping cycle, reconstructed by time heuristic — APPROXIMATE
      by design (cart events carry no order key; verified 0/1.12M on the real
      mirror 2026-07-08). A burst = behavioural events for one customer with
      gaps under var cycle_gap_minutes (60); a cycle = a chain of bursts ending
      at a submit, or broken after var cycle_abandon_days (7) of inactivity.
      Behavioural events = cart edits + feature interactions + submits, so
      search-before-first-add belongs to the cycle it led to; a cycle with no
      cart edits is a pure browsing session. Events without a customer_key
      (18.5% of cart events) cannot join any cycle. Full-rebuild table (cycle
      boundaries shift as new events arrive). When the app team stamps
      increment_id onto cart events, only the cycle grouping changes — the
      column contract stays.
    columns:
      - name: cycle_id
        description: customer_key + cycle sequence.
        tests: [unique, not_null]
      - name: customer_key
        description: Customer the cycle belongs to.
        tests: [not_null]
      - name: is_sales_assisted
        description: True when any event in the cycle came from a sales app.
      - name: sales_code
        description: Rep territory code involved; null for self-service cycles.
      - name: rep_username
        description: Rep login involved; null for self-service cycles.
      - name: app_name
        description: Dominant app in the cycle (most events).
      - name: started_at_utc
        description: First behavioural event of the cycle (UTC).
      - name: ended_at_utc
        description: Last behavioural event of the cycle (UTC).
      - name: burst_count
        description: Number of activity sittings (gap >= cycle_gap_minutes splits).
      - name: active_minutes
        description: >
          Time actually spent working, summed inside bursts only — overnight /
          idle gaps never count. Single-event bursts contribute 0.
      - name: days_active
        description: Distinct calendar days with activity in the cycle.
      - name: add_count
        description: Cart add events in the cycle.
      - name: remove_count
        description: Cart remove events in the cycle.
      - name: qty_change_count
        description: Cart quantity-change events in the cycle.
      - name: net_item_events
        description: add_count - remove_count (event counts, not quantities).
      - name: distinct_skus
        description: Unique SKUs touched by cart events (parsed from payload).
      - name: features_used_count
        description: Distinct action features used in the cycle.
      - name: is_submitted
        description: True when the cycle ended in a submit event.
      - name: submit_increment_id
        description: Order increment id when the closing submit carried a KV payload.
      - name: days_to_close
        description: >
          Calendar days from first event to submit (overnight counts — that is
          what "days to close" means). Null for unsubmitted cycles. APPROXIMATE.
      - name: cycle_status
        description: submitted / abandoned (no activity for cycle_abandon_days) / open.
        tests:
          - accepted_values:
              arguments:
                values: [submitted, abandoned, open]
      - name: segment_name
        description: >
          Selling-style segment (proposed defaults, tune after review).
          churner = more removes than adds; quick_reorder = submitted with
          little browsing in one short sitting; browser = 3+ distinct features;
          mixed = everything else.
        tests:
          - accepted_values:
              arguments:
                values: [churner, quick_reorder, browser, mixed]

  - name: fct_social_mentions
    description: >
      Consumption-facing social-listening fact — one row per mention, filtered to
      food-relevant, non-spam mentions (spam dropped only when the model is
      confident, >= social_spam_confidence_min; not-yet-enriched mentions are
      excluded until classified). The Genie / BI table for social listening. It
      relates to WMS and mysql by shared dimensions (posted_week, market) and by
      AI/semantic matching on themes/dishes at query time — NOT by a product key.
      Joins mentions to their LLM enrichment and applies the filter directly —
      no separate intermediate model, since that join had exactly one consumer
      (this fact). dq_social_mentions audits the unfiltered set by reading
      stg_mentionlytics__mentions directly, one layer earlier.
    columns:
      - name: mention_id
        description: Primary key. One row per (food-relevant, non-spam) mention.
        tests: [unique, not_null]
      - name: posted_at
        description: Timestamp the mention was posted.
      - name: posted_date
        description: Date of posted_at.
      - name: posted_week
        description: Monday-start week — exact join axis to WMS weekly demand.
      - name: market
        description: Thailand / Vietnam / Other. Conformed market dimension.
      - name: channel
        description: Platform the mention came from.
      - name: follower_count
        description: Follower count (social only; null for Web).
      - name: domain_rank
        description: Alexa domain rank (Web only). Never combined with follower_count.
      - name: sentiment
        description: >
          Raw Mentionlytics sentiment label — heavily skewed positive, so validate
          before trusting. The only sentiment here: the LLM enrichment no longer
          judges sentiment (out of scope for the trending board, and every field
          costs output-token throughput on every mention).
      - name: is_food_relevant
        description: Always true here (filter guarantee).
      - name: is_spam
        description: Retained for transparency; confident spam is filtered out.
      - name: themes
        description: Multi-label topics (array) — a key Genie query dimension.
      - name: mentioned_dishes
        description: Multi-label dishes (array) — semantic link to product categories at query time.
      - name: mentioned_products
        description: >
          Multi-label sellable products (array) — the SKU-level social signal:
          branded or packaged/processed goods, excluding raw commodities, dishes and
          retailers. Ranked as the 'item' class in int_social_concept_trends and the
          strongest link from social chatter to something we can actually sell.
      - name: ingredients
        description: Multi-label ingredients (array) — includes raw commodities; not ranked. See mentioned_products.
      - name: brands
        description: Multi-label brands / restaurants / products / retailers (array).
      - name: subject_dishes
        description: >
          The dishes the post is ABOUT (strict subset of mentioned_dishes, prompt v4).
          Null while a mention is still labelled at v3.
      - name: subject_products
        description: >
          The products the post is ABOUT (strict subset of mentioned_products).
          int_social_concept_trends turns this into a per-mention role — subject vs
          ingredient — which gates which posts become source_links and splits
          mention_count on the board.
      - name: confidence
        description: LLM confidence 0.0–1.0.

  - name: fct_invoices
    description: >
      ONE ROW PER POSTED SALES INVOICE — what was actually sold, as it landed in
      the ledger, net of the credits raised against it. The PDF asked for this
      by name: "it might be better to get from final information which is sales
      invoice schema... we might have to check against returns that related to
      that invoice as well".

      IT DOES NOT REPLACE fct_orders. That fact is what a rep SUBMITTED, from the
      app event log — same-day but app channels only, history from
      var('event_log_go_live_date'). This is what was INVOICED — every channel
      including phone and email, history across the whole ERP export, but
      lagging posting. They will never tie out: orders get cut, short-shipped or
      posted days later, and an invoice may cover several orders or part of one.
      Say which you mean.

      THE CUSTOMER COMES FROM THE LINES. The header is bill_to and would credit
      a chain's head office for every branch; the lines are sell_to.
      sell_to_customer_count exposes the rare invoice spanning more than one.

      VALUE IS PARTIAL AND PERMANENTLY SO — null before 2026-09-20, because ADF
      began exporting amounts then and the historical seed is never revisited.
      Dates, line counts and item counts are complete throughout; only money is
      recent. Nothing is coalesced to zero.

      RETURNS ARE NETTED BY THE CREDIT'S OWN LINK, not by posting date, because
      the question is what this invoice ended up being worth. THE CONSEQUENCE:
      net_value is RETROACTIVELY MUTABLE — a credit posted today changes an
      invoice dated three months ago. For a stable historical series use
      int_customer_item_purchases, which nets by posting date and never rewrites
      the past.
    columns:
      - name: invoice_no
        description: Posted invoice number — the grain.
        tests: [not_null, unique]
      - name: customer_key
        description: The account that bought, from the lines' sell_to. Joins to dim_customers.
        tests: [not_null]
      - name: customer_name
        description: That account's name, for a spoken answer.
      - name: sell_to_customer_count
        description: Above 1 means the invoice spans accounts and customer_key is one of several. Rare; published rather than hidden.
      - name: sales_code
        description: Rep credited with the lines.
      - name: rep_name
        description: That rep's display name.
      - name: sales_code_count
        description: Above 1 means the invoice's lines are credited to more than one rep.
      - name: posting_date
        description: When the invoice hit the books.
      - name: order_date
        description: When the customer asked.
      - name: days_order_to_post
        description: Fulfilment lag. Negative would mean an order_date after posting — a data fault worth seeing.
      - name: shipment_date
        description: When it shipped.
      - name: due_date
        description: When payment falls due. NULL before 2026-09-20.
      - name: has_due_date
        description: Separates "not past terms" from "cannot tell".
      - name: order_channel
        description: "PDA / WEB / null. Null means keyed straight into NAV, or predates the export change — has_channel tells them apart."
      - name: has_channel
        description: Whether a channel key was stamped on this invoice at all.
      - name: pda_order_no
        description: PDA order number where set.
      - name: m2_order_no
        description: Magento order number where set.
      - name: line_count
        description: Lines on the invoice. Complete over the whole history, unlike the value columns.
      - name: item_count
        description: Distinct items. "16 items, $2,000" is this beside invoice_value.
      - name: quantity_mixed_uom
        description: Quantity summed ACROSS UOMs — cases added to eaches. Named to say so; quantity_base is the comparable one.
      - name: quantity_base
        description: Quantity in base units, addable across UOMs. Null outside the conversion's coverage window.
      - name: invoice_value
        description: >
          Sum of the line amounts. NULL before 2026-09-20 and never zero-filled —
          an invoice with no exported amount has no value, and a zero would
          average into every figure downstream as though the goods were free.
      - name: valued_line_count
        description: Lines carrying an amount.
      - name: has_value
        description: THE FILTER for any revenue sum over this table.
      - name: value_coverage
        description: valued_line_count / line_count. Below 1 means invoice_value describes only part of what was sold.
      - name: cr_memo_count
        description: Credit memos raised against this invoice.
      - name: returned_quantity
        description: Quantity credited back.
      - name: returned_value
        description: Value credited back.
      - name: last_credit_date
        description: Most recent credit against this invoice.
      - name: has_return
        description: Whether anything was credited back.
      - name: net_value
        description: >
          invoice_value minus returned_value. NULL wherever invoice_value is —
          an unvalued invoice minus a valued credit is not a number anyone should
          act on. RETROACTIVELY MUTABLE; see the model description.
      - name: return_rate_value
        description: >
          returned_value / invoice_value — the 2-3% alert the business asked for,
          per invoice. Null rather than 0 where either side lacks value.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "line_count > 0"
      # a credit can equal an invoice but should not exceed it
      - dbt_utils.expression_is_true:
          arguments:
            expression: "net_value is null or net_value <= invoice_value"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "value_coverage is null or value_coverage between 0 and 1"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "valued_line_count <= line_count"
