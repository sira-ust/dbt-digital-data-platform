version: 2

models:
  - name: mart_rep_order_journey
    description: >
      Per-cycle rep behaviour, one row per matched open->close order cycle from
      int_rep_order_cycle. Every event falling in the cycle window is aggregated
      into cart, navigation, feature-flag and submit-quality metrics.

      TWO THINGS TO KNOW BEFORE AGGREGATING. (1) The cycle itself is
      RECONSTRUCTED BY TIME HEURISTIC, not recorded — cart events carry no order
      number, so open->close is inferred. (2) Events are joined on USERNAME AND
      TIME WINDOW ONLY, with no customer key, so an event inside two overlapping
      cycles is counted into BOTH. 5,330 of 12,118 cycles (44%) overlap the
      previous cycle for the same rep, and days_to_close reaches 156, so a long
      cycle sweeps up months of unrelated activity. Counts here are therefore
      upper bounds per cycle and MUST NOT be summed across cycles as if they were
      disjoint. For a per-customer view of what a rep actually did, use
      mart_rep_customer_activity instead — it is keyed on the customer.
    columns:
      - name: username
        description: Salesperson login that owned the cycle.
      - name: order_customer_no
        description: Customer the order was for. NOT used to attribute events — see the model description.
      - name: local_id
        description: Device-side cycle identifier from int_rep_order_cycle.
      - name: increment_id
        description: M-prefixed order number, when the cycle closed with a submit.
      - name: sales_code
        description: Rep territory code.
      - name: source_code
        description: App source the cycle ran on.
      - name: app_version
        description: App version string at cycle time.
      - name: opened_at
        description: Cycle start, UTC. Inferred, not a recorded "order opened" event.
      - name: submitted_at
        description: Cycle close, UTC. Null would mean still open; there are none today.
      - name: days_to_close
        description: >
          Whole days from opened_at to submitted_at. Median is ~1 but the max is
          156 — treat the long tail as heuristic error, not slow selling.
      - name: cycle_bucket
        description: "days_to_close banded: same-day / 1-3d / 4-7d / 8-14d / 14d+."
      - name: add_count
        description: Cart add events in the window (Order Operations, l2 05).
      - name: remove_count
        description: Cart remove events in the window (Order Operations, l2 04).
      - name: oos_check_count
        description: Out-of-stock checks in the window (Order Operations, l2 13).
      - name: churn_ratio
        description: >
          remove_count / add_count. Null when nothing was added. High means the
          basket was reworked a lot before sending.
      - name: click_backorder_count
        description: Backorder icon taps in the window.
      - name: click_history_count
        description: Purchase-history icon taps in the window.
      - name: click_suggest_count
        description: Suggested-items icon taps in the window.
      - name: click_new_count
        description: New-items icon taps in the window.
      - name: click_promo_count
        description: Promotion icon taps in the window.
      - name: click_new_promo_count
        description: Combined new-and-promo icon taps in the window.
      - name: filter_events
        description: Filtering & Sorting events in the window.
      - name: search_events
        description: Search events in the window.
      - name: icon_clicks
        description: All Activity (Customer Interactions) events — the parent of the click_* columns.
      - name: catalog_views
        description: Catalog View Analytics events in the window.
      - name: used_filter
        description: 1 if the rep filtered at all during the cycle, else 0.
      - name: used_search
        description: 1 if the rep searched at all during the cycle, else 0.
      - name: used_icons
        description: 1 if any icon was tapped during the cycle, else 0.
      - name: used_catalog_view
        description: 1 if the catalog was viewed during the cycle, else 0.
      - name: used_backorder
        description: 1 if the backorder icon was used during the cycle, else 0.
      - name: used_history
        description: 1 if purchase history was opened during the cycle, else 0.
      - name: used_suggest
        description: 1 if suggested items were opened during the cycle, else 0.
      - name: used_new
        description: 1 if new items were opened during the cycle, else 0.
      - name: used_promo
        description: 1 if promotions were opened during the cycle, else 0.
      - name: used_new_promo
        description: 1 if the combined new-and-promo view was opened, else 0.
      - name: used_all_product
        description: 1 if the all-products view was opened during the cycle, else 0.
      - name: used_categories
        description: 1 if categories were browsed during the cycle, else 0.
      - name: had_submit_attempt
        description: 1 if any Send Order event fired in the window, else 0.
      - name: submit_fail_count
        description: Failed submit attempts in the window (Send Order, l3 02).
      - name: behavior_segment
        description: >
          One of High Editor / Decisive / Planner / Slow Sender, in that
          precedence. High Editor = churn_ratio >= 0.3. Decisive = churn_ratio <
          0.1 and closed within a day. Planner = took 4 days or more. Slow Sender
          is everything left. Thresholds are conventions, not measured
          break-points, and they inherit the overlap caveat above.

  - name: mart_rep_weekly
    description: >
      Rep workload + feature usage, one row per sales_code x week. Order
      counts/value are EXACT (fct_orders); per-cycle metrics are APPROXIMATE
      (time-heuristic cycles from fct_order_cycles) — label as approximate in
      BI. Full outer join of the two sides: a week can have orders with no
      reconstructed cycles and vice versa. Answers "who's doing more or less
      work, and is team activity growing or shrinking".
    columns:
      - name: sales_code
        description: Rep territory code.
        tests: [not_null]
      - name: rep_name
        description: Display name from admin_users (max per territory code).
      - name: week_start
        description: Monday of the ISO week.
        tests: [not_null]
      - name: orders_submitted
        description: Submitted orders that week (exact, from fct_orders).
      - name: order_value_total
        description: Sum of grand_total that week (exact, from fct_orders).
      - name: cycles_worked
        description: Cycles the rep touched that week (approximate).
      - name: cycles_submitted
        description: Of those, cycles that ended in a submit.
      - name: avg_adds_per_cycle
        description: Mean cart adds per reconstructed cycle. APPROXIMATE — cycle grain is heuristic.
      - name: avg_removes_per_cycle
        description: Mean cart removes per cycle. APPROXIMATE.
      - name: avg_net_item_events
        description: Mean (adds minus removes) per cycle — net basket-building. APPROXIMATE.
      - name: avg_active_minutes
        description: >
          Mean active minutes per cycle, from the cycle's own event span. This is
          TIME IN THE APP, not time at a customer — for on-site minutes use
          mart_rep_customer_activity. APPROXIMATE.
      - name: pct_cycles_search
        description: >
          Share of the rep's cycles that used search at least once, 0-1. A rate
          over cycles, NOT a count — averaging it across weeks weights small
          weeks equally with large ones.
      - name: pct_cycles_filter
        description: Share of cycles that filtered at least once, 0-1.
      - name: pct_cycles_icon_click
        description: Share of cycles that tapped any icon at least once, 0-1.
      - name: pct_cycles_catalog_view
        description: Share of cycles that opened the catalog at least once, 0-1.
      - name: pct_cycles_promo
        description: Share of cycles that entered the promo section at least once, 0-1.
      - name: pct_cycles_backorder
        description: Share of cycles that entered the backorder section at least once, 0-1.
      - name: pct_cycles_history
        description: Share of cycles that opened purchase history at least once, 0-1.
      - name: pct_cycles_suggest
        description: Share of cycles that opened suggested items at least once, 0-1.
      - name: avg_search_per_cycle
        description: Mean searches per cycle — depth, where pct_cycles_search is reach.
      - name: avg_filter_per_cycle
        description: Mean filter uses per cycle.
      - name: avg_icon_click_per_cycle
        description: Mean icon taps per cycle.
      - name: avg_catalog_view_per_cycle
        description: Mean catalog views per cycle.
      - name: avg_promo_per_cycle
        description: Mean promo-section events per cycle.
      - name: avg_backorder_per_cycle
        description: Mean backorder-section events per cycle.
      - name: avg_history_per_cycle
        description: Mean purchase-history events per cycle.
      - name: avg_suggest_per_cycle
        description: Mean suggested-items events per cycle.
      - name: avg_days_to_close
        description: Average calendar days from first cycle event to submit (approximate).

  - name: mart_rep_customer_activity
    description: >
      One row per REP x CUSTOMER x DAY x SCENARIO. Answers "on Monday rep 001
      worked these customers, this long, on this device, at these times, and
      was he actually there". Splitting by scenario is the point: a rep can work
      one customer both on-site and remotely in a day, and a single per-day
      label hides it. On 2026-08-10 rep 025 built three baskets in-store then
      submitted all three at 22:42 that evening; collapsed it read "on-site,
      order M000182028" and implied he sent it there. Scenarios: remote /
      on-site / visited, keyed elsewhere / customer ordered online / visit only,
      no app / unknown. FULL OUTER JOIN of activity and presence, so a visit
      that produced no typing still gets a row — but a 'visit only, no app' row
      must ALSO be within var('presence_no_activity_max_metres') and be an
      account this rep owns, and is dropped when its GPS fix set is identical to
      an activity-backed visit's or when it is that visit's arrival leg. With no
      device record the position is the only evidence, so it has to be better.
      EXACT per row: customer, device split, order numbers, GPS distance. INFERRED: session boundaries (idle
      gaps, since cart events carry no order number) and which customer a fix
      belongs to when two share a geofence (see is_ambiguous).
    columns:
      - name: customer_day_key
        description: sales_code-customer_key-activity_date. NOT unique here — one row per scenario.
        tests: [not_null]
      - name: sales_code
        description: Rep territory code.
        tests: [not_null]
      - name: rep_name
        description: Display name from admin_users (max per territory code).
      - name: customer_key
        description: Unified customer key, the account worked.
        tests: [not_null]
      - name: activity_date
        description: >
          Date in the REP's local time. One timezone offset is chosen per
          rep-day (the modal one) because device_timezone is a device setting,
          not a location — only 43% of rep-days carry a single value.
        tests: [not_null]
      - name: scenario
        description: >
          How this block of work happened. `unknown` means there was no GPS for
          that rep-day, or the customer has no coordinates (12% of customers) —
          it is NOT the same as `remote`, and must never be read as "did not
          visit".


          Every value is EVIDENCE — a GPS fix, or the channel off the order
          payload — except `text/email order`, which is INFERRED from
          behaviour. That one is a strict subset of `remote`: GPS exists and puts
          the rep away from the store, yet he keyed a substantial order in one
          unbroken sitting, fast, browsed almost nothing, and typed every line
          instead of tapping it off purchase history — so the order reached him
          from outside the app. It does NOT identify the channel: a phone call,
          or a list handed over on an earlier visit, looks identical. Add it back
          to `remote` to recover the original split.
        tests:
          - accepted_values:
              arguments:
                values: ["remote", "text/email order", "on-site",
                         "visited, keyed elsewhere", "customer ordered online",
                         "visit only, no app", "unknown"]
      - name: sessions
        description: Separate sittings on this customer in this scenario. 0 for visit-only rows.
      - name: segments
        description: >
          Contiguous runs behind this row. >1 means first_touch_local to
          last_touch_local is NOT one continuous stretch — the label alternated
          across the day and this row is the min/max of every run carrying it.
          On 2026-08-25 rep 030's NEW052 read 12:17-13:17 on-site and 12:18-13:21
          elsewhere: overlapping ranges that were four alternating runs flattened
          into two pairs. Read a span with segments > 1 as an envelope, not a
          duration, and do not compare it against on_site_worked_minutes.
      - name: pda_minutes
        description: Minutes keying on the PDA.
      - name: ipad_minutes
        description: Minutes keying on the iPad (CatalogFS iOS).
      - name: android_tablet_minutes
        description: Minutes keying on the Android tablet (CatalogFS Android).
      - name: paired_minutes
        description: >
          Minutes keyed while a BLE PAIRING WAS ACTIVE. While paired the rep
          drives the iPad from the PDA and events alternate every few seconds, so
          the two count as ONE workstation and this time is EXCLUDED from
          pda_minutes and ipad_minutes rather than added to them. That is why the
          August total here (7,997) can exceed total ipad_minutes (6,321).

          DOES NOT MEAN "used both devices". device_group is set to paired
          whenever is_ble_paired is true, even when only one device is in use.
          For "the rep used both", test ipad_minutes > 0 AND pda_minutes > 0 —
          1,474 rows satisfy that with paired_minutes = 0, i.e. both devices, no
          pairing.

          Frequently 0: the app logs no reliable unpair event, so pairing is
          inferred from the L1=17 connect events and expired after
          ble_pairing_expiry_minutes. A pairing whose events are telemetry only,
          a single event, or under ~30 seconds correctly rounds to 0.
      - name: inherited_event_count
        description: >
          Of event_count, how many events did NOT name the customer themselves
          and had it filled in from a BLE pairing or the paired PDA. High values
          mean the attribution leans on the pairing repair rather than on what
          the app recorded — see customer_key_source in int_events_enriched.
      - name: keying_minutes
        description: >
          Always equals pda + ipad + android_tablet + PAIRED. The four device
          columns are mutually exclusive, so paired_minutes is a component of
          this total and NOT a subset of the other three — leaving it out
          understates keying time on the 1,839 rows that have any (verified
          2026-09-02: the four-way sum matches all 27,415 rows, the three-way
          only 25,576). Measured in stints (unbroken runs on one device_group) in
          seconds and rounded once per device, so a PDA -> iPad -> PDA handoff is
          never billed to either and short bursts are not inflated.
      - name: on_site_worked_minutes
        description: >
          NOT time on site. The portion of the GPS visit that an app session
          covered — "how long was he working this customer while there". For
          time on site use visit_minutes.

          Renamed from on_site_minutes on 2026-09-15. The old name read as time
          on site, and int_rep_customer_presence uses that same name for the
          visit DURATION, so one name carried two meanings across two models. A
          consumer took the obvious reading and overstated a rep's week by 54%.

          0 on every 'visited, keyed elsewhere' row by definition, and 0 on
          'visit only, no app' rows because there was no session to cover
          anything. Matched against the visit window padded by
          var('presence_edge_tolerance_minutes') on both edges — those edges are
          GPS SAMPLE times, not arrival and departure, and the device only
          reports every ~16 minutes.
      - name: opened_at
        description: One HH:mm per session, ascending. Inferred from idle gaps, not a recorded login event.
      - name: first_touch_local
        description: First work event in this scenario, rep local time.
      - name: last_touch_local
        description: Last work event in this scenario, rep local time.
      - name: orders_submitted
        description: >
          Orders SENT from this scenario row. Keyed to the session portion as of
          2026-09-15, so sum() is now safe: it previously keyed on the session
          alone, and a session straddling the departure gave the same order to
          both halves — 6,810 against 6,568 distinct over 90 days (+3.7%). The
          fix moved 170 rows to zero and lost no customer-day an order.

          A residual ~0.1% remains and is not a placement error: four order ids
          genuinely appear twice — two resubmits logged in separate sessions
          that scored different scenarios, and two submitted inside sessions
          belonging to two DIFFERENT reps. count(distinct order_ids) is still
          the only exactly-distinct total.

          Distinct orders in this scenario (EXACT — the submit event names its
          order). Confirmed by the dev team 2026-08-13 that the 04 codes fire on
          successful submission, never on opening or viewing.
      - name: orders_keyed
        description: Orders the rep BUILT on the PDA (order_channel = PDA).
      - name: orders_received
        description: Orders the CUSTOMER placed online (WEB/APP) and the rep handled.
      - name: order_ids
        description: The increment_ids in this scenario; NULL when none.
      - name: event_count
        description: Work events (cart edits, features, order create/send).
      - name: customer_name
        description: >
          Display name from NAV. rep_name has always been on this model;
          customer_name was not, so every consumer joined
          stg_nav__customer_locations for the one field.
      - name: visit_minutes
        description: >
          How long the rep was actually inside the geofence, summed across every
          stop that customer-day. DIFFERENT from on_site_worked_minutes, which is only
          the portion a device session covered — they differ on 31% of visit
          rows (2,246 hours against 3,307 over 90 days). Use this for "how long
          was he there" and on_site_worked_minutes for "how long was he
          working". The difference is never an error — it is keyed-elsewhere
          rows, whose overlap is 0 by definition, and multi-stop days. Zero
          single-stop on-site rows disagree, and
          tests/assert_on_site_worked_never_exceeds_the_visit.sql locks that.
      - name: visit_stops
        description: >
          Separate stops at this customer that day, gap-split by
          presence_visit_gap_minutes. >1 means arrived_at..departed_at is not one
          continuous stretch — rep 030's SEV009 on 2026-09-08 spans 13:26-15:52
          across three stops totalling 14 minutes.
      - name: arrived_at
        description: >
          First GPS fix inside the geofence that day. A SAMPLE time, not the
          moment he walked in: the device reports every 15-30 minutes, so he was
          there before this.
      - name: departed_at
        description: Last GPS fix inside the geofence that day. Same sampling caveat.
      - name: geofence_ambiguous
        description: >
          Raw geometry, straight from int_rep_customer_presence: another LIVE
          customer sat inside the geofence on at least one fix of this visit.
          Says nothing about whether we know which one the rep was in. This was
          what is_ambiguous used to mean, and it fired on 43% of visit rows.
      - name: resolved_by_app
        description: >
          True when the rep had THIS customer's record open in the app while
          inside its fence — the customer-day has an 'on-site' row. Geometry
          then decides nothing: ASI282 and ASI284 are duplicate NAV records at
          identical coordinates, so no distance test separates them, but 424
          events and an order against ASI282 settle it. Never true for
          'visit only, no app', which is correct — that scenario means there was
          no app activity to weigh.
      - name: is_ambiguous
        description: >
          Two live customers in range AND nothing in the app to separate them.
          The visit is plausible, not proven — exclude from strict visit counts.
          This is geofence_ambiguous AND NOT resolved_by_app; read the raw
          geometry from geofence_ambiguous if you want the old behaviour.
        tests:
          - accepted_values: {values: [true, false]}
      - name: has_activity
        description: >
          The standard noise filter: true when the rep spent measurable time,
          handled an order, OR was physically there. Use `where has_activity`.
          Do NOT filter on event_count — `event_count >= 4` discards 31% of all
          orders, because a submit with no preceding cart activity is a
          legitimate one-event row.

  - name: mart_rep_customer_activity_events
    description: >
      Drill-down behind mart_rep_customer_activity. One row per rep work event,
      stamped with the rep-customer-day it belongs to. Filter on
      customer_day_key and order by event_seq to replay the work. Grain is
      entity_id, so no day-level metric is repeated onto event rows and sum()
      is safe. increment_id is populated on submit rows only and is exact; it
      is deliberately NOT back-filled onto preceding events, which carry no
      order number.
    columns:
      - name: customer_day_key
        description: FK to mart_rep_customer_activity.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('mart_rep_customer_activity')
                field: customer_day_key
      - name: entity_id
        description: Event id, the PK. Join to fct_events for anything not here.
        tests: [not_null, unique]
      - name: sales_code
        description: Rep territory code; denormalised so a rep filters without a join.
        tests: [not_null]
      - name: customer_key
        description: The account; denormalised for the same reason.
        tests: [not_null]
      - name: activity_date
        description: Date in the rep's local time.
      - name: session_seq
        description: Which sitting on this customer the event belongs to.
      - name: event_seq
        description: Position within the customer-day (1 = first), the replay order.
      - name: event_at_local
        description: When it happened, in the rep's local time.
      - name: seconds_since_prev_event
        description: >
          Dwell on the previous step. Null on a session's first event. Bounded
          by the 30-minute gap rule, which starts a new session.
      - name: device
        description: PDA / iPad / Android tablet.
      - name: function_name
        description: The dev team's name for the event, verbatim.
      - name: feature_name
        description: search / filter / catalog_view / item_detail / icon_click / oos_check.
      - name: page_context
        description: Catalog section. promo / backorder / history / suggest.
      - name: is_submit
        description: True on the one event per order that actually sent it.
      - name: increment_id
        description: Order number. Populated on submit rows only; exact.
      - name: order_channel
        description: >
          PDA = the rep keyed it; WEB / APP = the customer placed it online and
          it arrived for the rep to process. Null on non-submit rows.

  - name: mart_customer_weekly
    description: >
      Customer behaviour, one row per customer_key x week. Event-based metrics
      (features, cart edits, friction) come straight from int_events_enriched
      so browsing outside any cycle still counts; cycle counts from
      fct_order_cycles; order counts from fct_orders (exact). Includes
      service_mode (self_service >= 80% self events / sales_assisted <= 20% /
      mixed), friction-family counts (request review, sales review, restore,
      delete, OOS checks) and churn_signal (removes > adds for
      churn_consecutive_weeks observed weeks running).
    columns:
      - name: customer_key
        description: Unified customer key.
        tests: [not_null]
      - name: week_start
        description: Monday of the ISO week.
        tests: [not_null]
      - name: service_mode
        description: self_service / sales_assisted / mixed, by share of self events.
        tests:
          - accepted_values:
              arguments:
                values: [self_service, sales_assisted, mixed]
      - name: net_item_events
        description: add_count - remove_count (event counts, not quantities).
      - name: friction_total
        description: Sum of the friction-family counts + OOS checks.
      - name: churn_signal
        description: >
          True when removes outnumbered adds for churn_consecutive_weeks
          observed weeks in a row (inactive weeks don't reset the streak).
          A UX follow-up flag, not a verdict.

  - name: mart_feature_pairing
    description: >
      Feature co-usage and trends, one row per feature pair x week. "Together"
      = same customer used both features the same day (no session id exists, so
      customer-day is the window; the pair RANKING is the signal). Pairs are
      emitted once (feature_a < feature_b); rows where feature_a = feature_b
      are the single-feature weekly trend. Actions only (feature_name);
      catalog sections are covered in mart_customer_weekly.
    columns:
      - name: week_start
        description: Monday of the ISO week.
        tests: [not_null]
      - name: feature_a
        description: First feature of the pair (alphabetical; = feature_b for trend rows).
        tests: [not_null]
      - name: feature_b
        description: Second feature of the pair.
        tests: [not_null]
      - name: co_occurrence_days
        description: Customer-days where both features were used.
      - name: customers_count
        description: Distinct customers behind the co-occurrences.
      - name: pct_of_a_days_with_b
        description: co_occurrence_days / days feature_a was used at all that week.
      - name: wow_change
        description: Week-over-week change in co_occurrence_days for the pair.

  - name: mart_item_demand_supply
    description: >
      App demand vs CABOT warehouse supply, one row per item x ISO week.
      Built for three questions: missed opportunities (interest while stock
      was dry), promote candidates (stock but no interest), restock risk
      (interest trending, inventory flat). Demand = interest at browse time
      (views + cart adds), NOT fulfilled sales — no order-level WMS link
      exists yet. Stock comparison is same-day: "when the customer looked,
      could CABOT have shipped it?". CAVEATS every consumer must know:
      supply covers warehouse CABOT ONLY (an item out of stock here may
      ship from an unmirrored site); demand history starts 2026-01-22;
      cart quantities come from ~89%-parseable payloads (losses visible in
      dq_unmatched_demand_skus). Signal thresholds are vars
      (demand_supply_* in dbt_project.yml).
    config:
      tags: ["demand", "wms"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [prtnum, week_start]
    columns:
      - name: prtnum
        description: WMS item number (= app sku).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_jdawms_items')
                field: prtnum
      - name: week_start
        description: Monday of the ISO week.
        tests: [not_null]
      - name: item_name
        description: US_ENGLISH item description.
      - name: item_family
        description: WMS product family.
      - name: abc_class
        description: ABC velocity class code.
      - name: abc_class_description
        description: Decoded ABC class.
      - name: velocity_zone
        description: WMS velocity zone.
      - name: item_views
        description: Item Detail opens + image enlarges that week.
      - name: cart_adds
        description: Cart add events that week.
      - name: cart_removes
        description: Cart remove events that week.
      - name: cart_add_qty
        description: Units added to cart (parseable payloads only).
      - name: peak_daily_customers
        description: Highest single-day distinct-customer count that week.
      - name: demand_active_days
        description: Days that week with any demand activity for the item.
      - name: demand_events
        description: item_views + cart_adds — the working demand measure.
      - name: views_prior_4wk_avg
        description: Average weekly item_views over the item's prior 4 observed weeks.
      - name: avg_shippable_qty
        description: Average daily shippable units at CABOT that week.
      - name: min_shippable_qty
        description: Lowest daily shippable units that week.
      - name: avg_on_hand_qty
        description: Average daily on-hand units that week.
      - name: shippable_eow
        description: Shippable units at the last snapshot of the week.
      - name: shippable_eow_prior_4wk_avg
        description: Average end-of-week shippable over the prior 4 observed weeks.
      - name: days_out_of_stock
        description: Snapshot days that week with zero shippable units.
      - name: snapshot_days
        description: Snapshot days observed that week (denominator for days_out_of_stock).
      - name: inbound_qty_peak
        description: Peak planned_qty + pnd_rcvqty that week (replenishment possibly in flight; semantics unconfirmed).
      - name: cart_adds_while_oos
        description: Cart adds landing on zero-shippable snapshot days — the core missed-opportunity count.
      - name: views_while_oos
        description: Item views landing on zero-shippable snapshot days.
      - name: is_trending_interest
        description: Views beat the prior-4-week average by demand_supply_trend_ratio (with a base floor).
      - name: signal
        description: >
          Weekly classification: missed_opportunity (demand hit a dry
          shelf), restock_risk (interest trending, stock not building),
          promote_candidate (stock but no interest), healthy. Thresholds
          from the demand_supply_* vars; precedence in that order. The mart
          is demand-driven: weeks before the event log went live are
          excluded entirely (supply-only history lives in
          int_jdawms_inventory_daily).
        tests:
          - accepted_values:
              arguments:
                values: [missed_opportunity, restock_risk, promote_candidate, healthy]

  - name: mart_social_trending_items
    description: >
      Marketing-facing "currently trending" board, kept as a WEEKLY SERIES OF
      BOARDS. Grain: one row per (week_start, concept_class, concept_norm);
      recomputed and REPLACED each run.

      Grain: one row per (CALENDAR WEEK, concept_class, concept_norm) — the report
      runs weekly, and each row covers exactly one Monday-anchored week's mentions,
      ranked against only that week's other concepts, so week-to-week movement
      compares equal, non-overlapping periods.

      TWO QUESTIONS, ONE TABLE. "What's trending THIS WEEK" is
      `where is_top_n and week_start = (select max(week_start) ...)`
      (~social_trend_top_n rows per class). "What's RISING" is a concept's rows
      across week_start, read through rank_change, mention_share_change and
      is_rising. EVERY week here is a COMPLETE week — a calendar week still in
      progress is not computed until it finishes, so max(week_start) needs no
      qualification and is never half-counted. See int_social_concept_trends for the
      boundary-splitting trade-off this grain accepts.

      TWO CLASSES, ranked separately (concept_class): 'dish' (Som Tam, Pho — what
      people talk about) and 'item' (matcha, durian, fish sauce — things that can
      plausibly be a SKU). Each has its own 1..N per week, so a flood of viral
      dishes can no longer mask the item-level signal that actually maps to
      inventory. Show both.

      TRAJECTORIES ARE COMPLETE, NOT TOP-N-FILTERED: every week of any concept that
      reached the top N in ANY week is kept (is_top_n flags the weeks it was on the
      board), so charted lines don't have holes where a concept dipped out. One
      honest gap: a week where the concept fell below social_trend_min_mentions has
      no upstream row at all.

      Per trending thing it answers: what's trending and how hard (rank, mentions,
      score, mention_share); whether it's moving (rank_change, mention_share_change);
      where to see it (source_links); do we carry it (result_type + matched item +
      CURRENT stock, and carried_items — every SKU we stock it under); if not,
      what similar to offer (recommended_items, or nearest_items when nothing cleared
      the bar); and what to DO (action_signal). Ranking is deterministic and author-diversity based (see
      int_social_concept_trends for the score's formula and the internals behind the
      rank, which are deliberately not republished here); the concept->SKU
      link comes from the OFFLINE LLM resolution — dbt never calls the LLM. A concept
      the LLM hasn't scored stays 'unresolved'. The confidence floor
      (social_resolve_min_confidence) suppresses ANY low-confidence match — carried,
      substitute, or basket (shown as 'none' / source_new). Inventory wins only when
      confident: FZ BANH MI @0.95 shows, sushi -> corn oil @0.45 is dropped. Stock is
      the item's CURRENT (latest snapshot week) shippability, CABOT warehouse only —
      NOT as-of the row's week, hence the current_* naming. Read by Genie / BI.

      {{ doc('social_time_windows') }}
    config:
      tags: ["social", "reporting"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [week_start, concept_class, concept_norm]
    columns:
      - name: concept_key
        description: Surrogate key for the grain — week_start|concept_class|concept_norm.
        tests: [unique, not_null]
      - name: week_start
        description: >
          The as-of week (Monday-anchored) this row's board belongs to. "Now" is
          max(week_start). Each row covers the trailing window ending in this week.
        tests: [not_null]
      - name: concept_class
        description: >
          Which board this row belongs to — 'dish' or 'item'. Ranked separately, so
          "top 20" means top 20 PER CLASS per week. The column to filter on.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['dish', 'item']
      - name: is_top_n
        description: >
          True for the weeks this concept was actually within social_trend_top_n of
          its class. False rows exist so a trajectory has no holes — filter on this
          for the board, ignore it for a chart.
        tests: [not_null]
      - name: week_end
        description: Last day of the calendar week (week_start + 6).
        tests: [not_null]
      - name: year_week
        description: >
          Sortable ISO week label, "2026-W34" (ISO year, so Monday 2025-12-29 correctly
          reads 2026-W01).
      - name: concept_label
        description: >
          Human-readable trending "item" — the LLM's canonical_label once resolved
          (merges cross-language dupes), falling back to the raw normalised text
          until then.
        tests: [not_null]
      - name: concept_norm
        description: Raw normalised concept text; the join key behind concept_label. Unique only WITH week_start + concept_class.
        tests: [not_null]
      - name: trend_rank
        description: >
          1..N within (week_start, concept_class); 1 = most trending that week in
          that class (by trend_score desc; see int_social_concept_trends). NULL is
          possible on a non-board (is_top_n = false) row: author_quality is judged
          per window, so a concept excluded as a repeat_poster in one week has no
          rank there while still having a trajectory.
        tests:
          - not_null:
              config:
                where: "is_top_n"
      - name: mention_count
        description: Distinct food-relevant, non-spam mentions behind the trend THAT WEEK.
      - name: subject_mentions
        description: >
          Of mention_count, how many posts are ABOUT this concept rather than merely
          naming it. Two brand posts plus seventeen recipes is a "promote it as a
          cooking staple" story; twenty brand posts is a "the product itself is
          trending" story — the same mention_count, opposite decisions.
      - name: ingredient_mentions
        description: >
          Of mention_count, how many named it as an ingredient, a step, or one item on
          a menu. Kept inside mention_count on purpose: for a distributor this is real
          ingredient demand, and it is the reason someone orders a case.
      - name: unlabelled_mentions
        description: >
          Of mention_count, how many predate enrichment prompt v4 and so carry no role.
          The three add to mention_count exactly (assert_social_mention_roles_sum); this
          column falls to zero once the v4 re-label finishes.
      - name: has_subject_evidence
        description: >
          False means no post was about this concept, so source_links show posts that
          merely named it — the best evidence available, but not proof of a trend.
      - name: mention_share
        description: >
          mention_count as a share of all (concept, mention) pairs that week in that
          class. The measure to compare across weeks — unaffected by collection volume
          moving or a week being partial, unlike raw counts. See
          int_social_concept_trends.
      - name: rank_change
        description: >
          Places gained since last week — POSITIVE means it moved UP the board (9 -> 3
          is +6). Populated ONLY when the previous row is exactly last week, so a
          number always means "since last week". NULL = no like-for-like comparison
          (first appearance, or a week too quiet to rank), NOT "flat".
      - name: mention_count_wow_pct
        description: Fractional change in mention_count vs LAST WEEK (0.75 = +75%); same strict rule as rank_change. Not volume-neutral — prefer mention_share_change.
      - name: mention_share_change
        description: mention_share - prev_mention_share, same strict rule. The volume-neutral movement signal.
      - name: total_engagement
        description: Active engagement (likes + comments + shares) summed over those mentions.
      - name: total_views
        description: Views summed over those mentions.
      - name: is_rising
        description: >
          mention_share went up versus the previous week with a row — a true
          week-over-week rise (redefined from the old half-window version, which was
          volume-driven). Null on a concept's first week. Not the rank.
      - name: source_links
        description: Array of the top mention URLs behind the trend THAT WEEK (by reach then engagement).
      - name: distinct_authors
        description: >
          Distinct authors behind the trend (channel-scoped; anonymised Instagram rows each
          count as their own unknown author). See int_social_concept_trends.
      - name: author_quality
        description: >
          'verified' (broad enough real authorship to trust), 'repeat_poster' (one or few
          real accounts are driving it — excluded before trend_rank is assigned, so it
          never appears on the BOARD, but it can appear on a non-board trajectory row
          with a null rank), or 'unverifiable' (too little non-anonymised signal to
          judge — shown anyway, flag visible, rather than silently dropped). Judged per
          window, so a concept's quality can change week to week. See
          int_social_concept_trends.
        tests:
          # 'repeat_poster' is excluded before ranking, so it can't be on the board —
          # but it CAN be a trajectory row (is_top_n = false, trend_rank null)
          - accepted_values:
              config:
                where: "is_top_n"
              arguments:
                values: ['verified', 'unverifiable']
      - name: is_single_channel
        description: >
          True if this trend has only ever been seen on one platform. A dampener on trend_score,
          not grounds for exclusion — single-platform trends (TikTok-only virality) are common
          and legitimate. See int_social_concept_trends.
      - name: result_type
        description: >
          carried (we stock it), substitute (we don't, similar recommended), basket
          (a dish/category, ingredients recommended), none (nothing we carry/supply),
          or unresolved (the LLM gate hasn't scored this concept yet).
        tests:
          - accepted_values:
              arguments:
                values: [carried, substitute, basket, none, unresolved]
      - name: matched_prtnum
        description: WMS part number we carry for this concept (result_type='carried').
      - name: matched_item_name
        description: Name of the matched item, joined authoritatively from int_jdawms_items_active.
      - name: current_in_stock
        description: >
          BOOLEAN. true if the matched item is shippable in the LATEST stock snapshot
          week (CABOT only) — TODAY's stock, not stock as of this row's week. Named
          current_* for that reason: on a historical row it is still today's number,
          because action_signal is a decision about now.
          Three states, and the difference matters: true = shippable, false = we hold a
          stock record and it says not shippable, null = there is no stock record for
          that part number at all, which is not the same as knowing it is out.
          action_signal treats null as not-in-stock; a reader should not.
          It describes ONE part number — matched_prtnum — not the product. When
          carried_prtnums lists several SKUs, the others have their own stock, so a
          'restock' next to a long carried_items is about that SKU, not the product.
      - name: current_shippable_qty
        description: End-of-week shippable units for the matched item in the latest snapshot week (see current_in_stock).
      - name: recommended_prtnums
        description: >
          Array of WMS part numbers to recommend (substitutes or ingredient basket),
          VERIFIED against int_jdawms_items_active — every entry is a real, currently
          sellable SKU; any prtnum the LLM returned that isn't in the active item
          master is dropped, as are duplicate part numbers and duplicate item NAMES
          (the master carries several prtnums with the same name).
      - name: recommended_items
        description: >
          Display names parallel to recommended_prtnums, taken from the item master
          (authoritative), not the LLM's self-reported names. Length equality with
          recommended_prtnums is asserted by assert_social_recommendations_aligned.
      - name: carried_prtnums
        description: >
          EVERY SKU of this product we stock, matched_prtnum included and listed first —
          our other brands, sizes and pack formats of it (e.g. the Dragonfly and Maekrua
          oyster sauces alongside the LKK the resolver named). These are not
          substitutes: "Oyster Sauce" is a product we carry, and these are the part
          numbers it is carried under; matched_prtnum is the resolver's representative
          pick, not a claim that one SKU is the real answer. Populated ONLY where
          result_type = 'carried'. Derived deterministically from the item master, NOT
          from the LLM: a SKU must sit in the matched item's item_family AND carry every
          concept token the matched item's own name uses.
          NOT TRUNCATED — the list answers "what do we carry", so cutting it short
          would make it wrong rather than brief; all 16 of our oyster sauces appear.
          social_carried_skus_max is a runaway guard set far above any real product
          family, and the test fails if it ever actually bites. After the matched item
          the list rotates across brands (Dragonfly, Maekrua, LKK, then their second
          entries) so one brand's part-number block cannot fill it, in-stock first.

          Matching is on canonical name tokens: warehouse shorthand is expanded through
          seed_jdawms_name_abbreviations (SCE -> SAUCE, PWDR -> POWDER) and plurals are
          folded, so "LKK PREMIUM OYSTER SCE18OZ(12)" is recognised as an oyster sauce
          and "rice noodles" meets "RICE NOODLE". Precision is preferred over reach: a
          SKU whose name uses different words is left out rather than guessed at, so
          rice noodles does NOT pull in rice sticks or vermicelli, and condensed milk
          does not pull in condensed creamers. Read a short list as "these are
          definitely it", not "this is all we have".
      - name: carried_items
        description: >
          Display names parallel to carried_prtnums, from the item master. Length
          equality, the carried-only rule, the presence of matched_prtnum in its own
          list, and that the runaway guard is not truncating are all asserted by
          assert_social_carried_skus_aligned.
      - name: carried_sku_count
        description: >
          How many SKUs carried_prtnums holds — the number to read for "how many ways do
          we stock this". Equal to the array length by construction; exposed as a scalar
          so a report can sort or filter on it without unnesting.
      - name: nearest_prtnums
        description: >
          Array of WMS part numbers the resolver DID name for this concept but that did
          not survive — either the verifier rejected them, or the confidence floor
          suppressed the whole match. Populated ONLY where result_type = 'none', and
          verified against int_jdawms_items_active exactly like recommended_prtnums.
          These are NOT a recommendation: they are what a human should look at before
          accepting that we carry nothing. Null on any row with a real match.
      - name: nearest_items
        description: >
          Display names parallel to nearest_prtnums, from the item master
          (authoritative). Length equality is asserted by
          assert_social_nearest_items_aligned.
      - name: match_confidence
        description: >
          The resolver's VERIFIED confidence in the match, 0.0–1.0 (a second,
          independent model's calibrated certainty in the items that survived its
          review — not the proposing model's self-rating); null when unresolved or no
          match is shown.
      - name: action_signal
        description: >
          promote_now (carried + in stock), restock (carried + OOS),
          offer_substitute (not carried, similar exists), promote_ingredients
          (dish/category basket), review_nearest (no confident match, but the resolver
          named real active SKUs — see nearest_items), source_new (nothing carried and
          nothing near), monitor (unresolved / no signal). Always about TODAY's stock —
          see current_in_stock.
        tests:
          - accepted_values:
              arguments:
                values: [promote_now, restock, offer_substitute, promote_ingredients, review_nearest, source_new, monitor]


  # ── THE REP ASSISTANT'S TWO TABLES ──────────────────────────────────────────
  # mart_rep_period_status (rep x period, cumulative) and mart_rep_account_status
  # (rep x account) are read by an authenticated assistant on one rep's behalf.
  # Resolve the login through dim_rep_logins to a sales_code, then filter both
  # on it.
  #
  # THERE IS NO SEPARATE DAILY TABLE. A day is just the shortest period_type, so
  # "how did yesterday go" is `period_type = 'day' and is_current` and "how is my
  # month going" is `period_type = 'month' and is_current` — same columns, same
  # meanings, one model. A dedicated daily mart existed briefly and was folded
  # in: every column it held was the same expression over a one-day window, and
  # two models that must agree are two models that will eventually stop agreeing.
  #
  # SALES AND ORDERS ONLY, both tables. No store visits, on-site minutes, GPS,
  # app time or device split, and no scenario labels from
  # mart_rep_customer_activity: those rest on the geofence and idle-gap
  # heuristics, which are not accurate enough yet to put in front of a rep as a
  # number. Everything here is stated outright by the order payload, so there is
  # nothing to caveat. When the on-site algorithm is trusted, coverage columns
  # can be added; until then their absence is the honest position, not a gap.
  #
  # WHICH TABLE ANSWERS WHAT
  #   "how did yesterday go"      period, period_type = 'day'
  #   "how am I doing this month" period, period_type = 'month'
  #   "who should I call"         account, ordered by attention_priority
  #
  # THE ONE ARITHMETIC RULE. Orders, value and line counts are additive across
  # periods of the same type; accounts_ordered is NOT. A store that ordered in
  # two different weeks is one account for the month, so every period type is
  # computed independently from the order rows rather than rolled up from
  # shorter ones. Never sum accounts_ordered — ask for the longer period_type.

  - name: mart_rep_period_status
    description: >
      One row per REP per PERIOD, cumulative to date — "how am I doing", at
      whatever granularity is asked. FIVE PERIOD TYPES IN ONE TABLE
      (period_type = day / week / month / quarter / year), so a day is simply
      the shortest period and there is no separate daily table. ALWAYS filter on
      period_type, because without it a query sums the same orders five times
      over. AS_OF_DATE IS THE CONTRACT: the
      pipeline processes the PREVIOUS day, so as_of_date is yesterday and
      yesterday is complete — there is no partial "today" here. "Month to date"
      means "month through as_of_date", and days_elapsed and both projections
      are measured to it, because pacing against today's calendar date would
      divide by a day whose data does not exist yet and report the whole team as
      behind every morning. ZERO IS REPORTED AS ZERO: a rep gets a row for every
      period from his first order onward, including one he sold nothing in, so
      this is the table to use when an answer must exist. NO GOAL COLUMN YET —
      order_value_projected is a straight-line pace, not attainment; see the
      model header for what a target source would need.
    columns:
      - name: sales_code
        description: Rep territory code. Join key to dim_reps.
        tests: [not_null]
      - name: rep_name
        description: Display name from dim_reps.
      - name: period_type
        description: >
          day / week / month / quarter / year. ALWAYS filter on this — without
          it a query sums the same orders five times over. Weeks are ISO (Monday
          start), matching week_start in mart_rep_weekly. At period_type = 'day',
          period_start = period_end and days_in_period = 1.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [day, week, month, quarter, year]
      - name: period_start
        description: First calendar day of the period.
        tests: [not_null]
      - name: period_end
        description: >
          Last calendar day of the period. In the FUTURE for the current period —
          it is the calendar bound, not the extent of the data. Equals
          period_start when period_type = 'day'.
      - name: day_of_week
        description: >
          Weekday NAME of period_start, and ONLY for period_type = 'day' — for
          every other type period_start is a fixed weekday (weeks always start
          Monday) and the column would say nothing, so it is null. The name
          rather than a number because DuckDB and Databricks number weekdays
          differently, so an integer silently shifts by a day between dev and
          prod.
      - name: as_of_date
        description: >
          The newest day with complete data: yesterday, because the pipeline
          processes the previous day. Every cumulative number and both
          projections stop here. Taken from the event log rather than
          current_date, which renders in the session timezone and would name a
          different day in dev than in prod. Say it out loud in a spoken answer.
        tests: [not_null]
      - name: is_current
        description: >
          The period containing as_of_date. `where period_type = 'month' and
          is_current` is the month-to-date row.
      - name: days_in_period
        description: Calendar days in the whole period.
      - name: days_elapsed
        description: >
          Calendar days of the period covered by complete data, i.e. through
          as_of_date. Equals days_in_period for a finished period.
      - name: pct_period_elapsed
        description: >
          days_elapsed / days_in_period. Publish this alongside any comparison
          against a previous period, so a part-elapsed month reads as "38% of the
          way through" rather than "down 62%".
      - name: orders_submitted
        description: Orders sent in the period to date. Summed from the daily table; additive.
      - name: orders_keyed
        description: Of those, keyed by the rep on the PDA.
      - name: orders_received
        description: Of those, placed by the customer on web or the app.
      - name: orders_pda
        description: >
          The same orders split three ways by ORIGIN, as the business says them
          out loud: "3 PDA orders, 2 app orders, 1 web order". APP and WEB are
          SEPARATE here and folded together in orders_received above; both
          readings are legitimate and neither derives from the other, so both are
          published.
      - name: orders_app
        description: Of those, originating in the customer app.
      - name: orders_web
        description: Of those, originating on the website.
      - name: orders_channel_other
        description: >
          Orders whose channel is null or unrecognised. NORMALLY 0, AND NOT
          PADDING: order_channel is null when the payload stated no origin and
          fct_orders' PDA inference did not apply, and 17 such orders went
          unnoticed for seven months precisely because they fell into neither
          keyed nor received. A fourth column that is normally zero makes the next
          occurrence visible instead of silent. The four are tested to sum to
          orders_submitted.
      - name: order_value_pda
        description: >
          Value per channel — "PDA orders were $123, app orders were $111". NULL,
          not 0, for a channel with no orders in the period: a channel that sold
          nothing has no value, and a 0 averages into a run rate as though it were
          one. Same rule as order_value_total.
      - name: order_value_app
        description: Value of app-origin orders. Null when there were none.
      - name: order_value_web
        description: Value of web-origin orders. Null when there were none.
      - name: order_value_channel_other
        description: Value of orders with no recognised channel. Normally null.
      - name: days_with_orders
        description: >
          Days in the period on which the rep sent at least one order. The
          denominator for a per-day average — days_elapsed includes weekends and
          days off. Always 0 or 1 when period_type = 'day'.
      - name: order_value_total
        description: >
          Sum of grand_total for the period to date, EXACT. NULL rather than 0
          when nothing was sold: a rep with no orders has no order value, and a 0
          would average into a run rate as though it were one.
      - name: order_value_avg
        description: order_value_total / orders_submitted for the period.
      - name: order_value_largest
        description: Biggest single order in the period.
      - name: largest_order_customer_key
        description: >
          The account behind order_value_largest, so the answer is "$4,200 from
          ABC Market" rather than "$4,200". Picked by row_number over the period's
          orders with ties broken on customer_key, so the pick is reproducible
          across runs and engines — a tie is two orders of exactly equal value,
          which is rare and harmless either way.
      - name: largest_order_customer_name
        description: >
          That account's name — the half to say out loud. A null name beside a
          non-null key means the account is missing from dim_customers, which is a
          data-quality fault worth seeing rather than a reason to drop the row.
      - name: largest_order_date
        description: The rep-local day the largest order was submitted.
      - name: order_line_count
        description: Total item count across the period's orders.
      - name: accounts_ordered
        description: >
          DISTINCT accounts that ordered in the period, counted from the order
          rows over that whole period. NOT summable across periods: a store that
          ordered in two different weeks is ONE account for the month, so
          summing the weekly (or daily) figures would say two. Ask for the
          longer period_type instead.
      - name: order_value_projected
        description: >
          A STRAIGHT-LINE PROJECTION, not a forecast and not attainment: what the
          period would end at if the rest of it matched the rate so far. Divided
          by days_elapsed (complete data), never by today's date. NULL for a
          finished period, which needs no projection. Degenerate but harmless at
          period_type = 'day', where it equals the actual.
      - name: orders_submitted_projected
        description: The same straight-line projection applied to order count.
      - name: order_value_per_selling_day
        description: >
          order_value_total / days_with_orders — per SELLING day, so a short
          month or a week off does not read as a slump.
      - name: prev_order_value_total
        description: >
          The value STRICTLY the preceding period achieved — the day before, the
          week before, the month before. Joined on prev_period_start rather than
          taken from lag(), because lag() returns the previous period WITH A ROW,
          which after a gap is not last month at all. NULL means no comparison is
          available, never "flat".
      - name: prev_orders_submitted
        description: Orders the strictly-preceding period achieved.
      - name: prev_accounts_ordered
        description: Distinct accounts the strictly-preceding period reached.
      - name: order_value_change_pct
        description: >
          (this period - previous) / previous, as a fraction. Null when there is
          no previous row or it was zero. Comparing a part-elapsed current period
          against a full previous one understates it by design — pair this with
          pct_period_elapsed.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sales_code, period_type, period_start]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "days_elapsed <= days_in_period"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "orders_keyed + orders_received = orders_submitted"
      # the three-way ORIGIN split plus the unknown bucket must account for
      # every order, or a channel has appeared that nothing is counting
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              orders_pda + orders_app + orders_web + orders_channel_other
              = orders_submitted
      # exactly one current period per rep per period_type, or is_current cannot
      # be used as the month-to-date filter it is documented to be
      - dbt_utils.expression_is_true:
          arguments:
            expression: "period_start <= period_end"
      # a day period is exactly one day long, and its weekday name is the only
      # place day_of_week is meaningful
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              period_type <> 'day'
              or (days_in_period = 1 and period_start = period_end
                  and day_of_week is not null)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "period_type = 'day' or day_of_week is null"

  - name: mart_rep_account_status
    description: >
      One row per REP per ACCOUNT, orders only — "which of my accounts have
      stopped buying". SPINE unions two senses of "the rep's account": owned
      (NAV assigns it) and ordered (he has actually sold to it). Neither alone
      is right — an owned account that has never ordered is exactly the row a
      to-do list exists to surface, and a rep can legitimately sell to a
      colleague's account. Carries NO visit or app-usage clock: those rest on
      the geofence heuristic and are not accurate enough to tell a rep he has
      not called on someone, so this list answers only what the order data
      answers exactly and stays silent on coverage. A null last_order_date means
      NOTHING ON RECORD since var('event_log_go_live_date'), not "never".
      Test and internal accounts are excluded. The overdue threshold is a
      CONVENTION pending a conversation with the sales managers.
    columns:
      - name: sales_code
        description: Rep territory code. Join key to dim_reps; resolve a login via dim_rep_logins.
        tests: [not_null]
      - name: rep_name
        description: Display name from dim_reps.
      - name: customer_key
        description: The account.
        tests: [not_null]
      - name: customer_name
        description: Account name — the string a spoken answer should use, not the key.
      - name: city
        description: City, for routing a day's calls.
      - name: county
        description: County, or state in US-style addresses.
      - name: post_code
        description: Postal/ZIP code.
      - name: owner_rep
        description: The rep NAV says owns the account, whoever has been selling to it.
      - name: is_owned_by_rep
        description: >
          owner_rep equals this rep. FALSE means he has sold to a colleague's
          account, which is legitimate and is why the spine is a union rather
          than the owned list alone.
      - name: customer_is_active
        description: Account is live in NAV. Inactive accounts are ranked last, not dropped.
      - name: first_order_date
        description: Earliest order on record for this rep-account, on the rep's local day.
      - name: last_order_date
        description: >
          Most recent order, on the rep's local day. NULL = nothing on record in
          the observed window, which starts at var('event_log_go_live_date').
      - name: days_since_last_order
        description: >
          Days from last_order_date to as_of_date. NULL, not a large number, when
          there is no order on record.
      - name: last_invoiced_date
        description: >
          Most recent POSTED invoice for this rep-account. Every channel, full
          history — the authoritative answer to "when did they last buy".
      - name: first_invoiced_date
        description: Earliest posted invoice on record.
      - name: days_since_last_invoice
        description: Measured against invoice_as_of_date, NAV's own leading edge.
      - name: invoices_all_time
        description: Posted invoices for this rep-account. COMPLETE over the whole export.
      - name: invoices_recent
        description: Posted invoices within var('account_item_recent_window_days').
      - name: invoice_value_recent
        description: >
          Invoiced value in that window, net of credits. NULL before 2026-09-20
          even where the COUNTS are populated — an account with invoices and no
          invoiced value is the pipeline's limit, not a quiet account.
      - name: invoice_value_all_time
        description: Lifetime invoiced value, same coverage caveat.
      - name: last_app_order_date
        description: >
          Most recent APP submit. Fresher than the invoice clock — same day — but
          app channels only and no earlier than the event log's go-live.
      - name: first_app_order_date
        description: Earliest app submit on record.
      - name: days_since_last_app_order
        description: Measured against as_of_date, the event log's leading edge.
      - name: invoice_as_of_date
        description: >
          NAV's leading edge — the newest posted invoice anywhere. A DIFFERENT
          DATE from as_of_date, which is the event log's and is shared with every
          other rep mart. The two feeds advance independently.
      - name: orders_all_time
        description: Orders on record for this rep-account in the observed window.
      - name: orders_recent
        description: Orders within var('rep_account_recent_window_days') (90) of as_of_date.
      - name: order_value_all_time
        description: Sum of grand_total over the observed window, EXACT.
      - name: order_value_recent
        description: Sum of grand_total within the recent window.
      - name: order_value_avg
        description: >
          Mean order value over the observed window. Null rather than 0 when
          nothing was ordered.
      - name: delivery_days
        description: >
          The account's delivery pattern as a readable string, "Tue, Thu".
          Actionable, not decorative: an account that only takes Tuesday
          deliveries has to be ordered before Tuesday, so this decides WHEN a
          call is worth making.
      - name: delivery_day_count
        description: >
          How many delivery days are set. 0 means NAV has no pattern on file —
          unknown, not "never delivers".
      - name: appointment_required
        description: Delivery needs a booked appointment — affects how a call is planned.
      - name: customer_group
        description: Customer group/segment.
      - name: as_of_date
        description: >
          The date days_since_last_order is measured from: the newest day the
          pipeline has processed. Shared with mart_rep_period_status so the two
          tables cannot disagree about what "today" is — see
          macros/rep_log_today.sql.
      - name: attention_reason
        description: >
          ONE reason per account, in precedence order, so an assistant reads out
          a cause instead of re-deriving one from six columns. An inactive
          account is not the rep's problem; an account that has never ordered is
          the biggest one; then one that has stopped.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['no order on record', 'order overdue', 'ok', 'inactive account']
      - name: attention_priority
        description: >
          1 = most urgent, mirroring attention_reason exactly, so `order by
          attention_priority` gives the call list without the consumer needing to
          know the precedence. 1 no order on record, 2 order overdue, 5 ok,
          9 inactive account.
        tests: [not_null]
      - name: needs_attention
        description: >
          attention_priority <= 2 — the two reasons that are genuinely a to-do.
          Deliberately excludes 'inactive account', which the rep cannot act on.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sales_code, customer_key]
      # days_since_last_order must be null exactly when there is no order date,
      # so a consumer can trust null to mean "nothing on record" and never
      # stumble on a sentinel number
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              (last_order_date is null and days_since_last_order is null)
              or (last_order_date is not null and days_since_last_order is not null)

  # ── THE ITEM-LEVEL SALES-AGENT MARTS ────────────────────────────────────────
  # mart_account_item_history and mart_account_item_opportunities answer the
  # "What should I sell them?" questions; mart_rep_period_item_mix answers "what
  # were my sales made of". All three run on NAV POSTED INVOICES.
  #
  # READ THIS BEFORE QUOTING ANY NUMBER FROM THEM: NAV exports no amounts.
  # sales_invoice_line is eleven columns and not one is money; the replica has no
  # Cust_ Ledger Entry at all. So these are UNIT histories — how many, how often,
  # when — and never how much. AR days, aging, credit limits and "which accounts
  # are past their terms" have no source in this warehouse and cannot be
  # approximated from anything in it.

  - name: mart_account_item_history
    description: >
      ONE ROW PER ACCOUNT PER ITEM THEY HAVE BOUGHT. "What does this account
      actually buy, what have they stopped buying, and what are they due to
      reorder?" The item-level companion to mart_rep_account_status, which stops
      at the account — that table answers "who should I call", this one answers
      "and what do I say when they pick up".

      TWO THINGS BEFORE READING A NUMBER.

      (1) THERE ARE NO DOLLARS HERE AND NO WAY TO ADD THEM. This table says "they
      buy 6 cases every 5 weeks", never "that is $400 a month". The only dollar
      figure in the warehouse is fct_orders.grand_total, which is an ORDER TOTAL
      from the app payload — it does not break down by item and cannot be
      apportioned across these rows.

      (2) TWO CLOCKS, AND THEY ARE DIFFERENT DATES. purchase_as_of_date is NAV's
      leading edge; stock_snapshot_date is the warehouse's. They advance on
      independent schedules, so they genuinely differ, and both are published
      rather than one passed off as "today".

      A ROW IS AN ACCOUNT-ITEM PAIR WITH AT LEAST ONE POSTED PURCHASE. Items
      never bought are deliberately absent — that is
      mart_account_item_opportunities.

      HISTORY DEPTH IS THE ERP FEED'S, NOT THE EVENT LOG'S. This is the first
      mart whose history does not start at var('event_log_go_live_date'); it
      reaches back as far as the posted-invoice export does. So an account can
      show purchases here and no orders at all in mart_rep_account_status, and
      that is not a contradiction — different systems, different windows.
    columns:
      - name: customer_key
        description: The account.
        tests: [not_null]
      - name: customer_name
        description: The name to say out loud.
      - name: owner_rep
        description: The rep NAV says OWNS the account today.
      - name: owner_rep_name
        description: That rep's display name.
      - name: selling_rep
        description: >
          The rep credited with this account's purchases of this item in NAV,
          which is NOT necessarily owner_rep — a book can change hands. Published
          beside it so the difference is visible rather than resolved into one
          misleading column.
      - name: customer_is_active
        description: NAV active flag. Inactive does not mean "never contact".
      - name: city
        description: Account city.
      - name: county
        description: Account county/state.
      - name: post_code
        description: Account postal code.
      - name: customer_group
        description: NAV customer group. The basis for peer comparison in the opportunities mart.
      - name: item_no
        description: The item.
        tests: [not_null]
      - name: item_label
        description: The item name to READ OUT. Never say the item number to a rep.
      - name: item_category_code
        description: NAV category code.
      - name: item_category_name
        description: NAV category name.
      - name: product_group_code
        description: NAV product group.
      - name: abc_class
        description: WMS item-level ABC class.
      - name: purchase_as_of_date
        description: >
          NAV's leading edge — the newest posted invoice. Every purchase age here
          is measured against it. An invoice that posted this morning is not in
          here yet.
      - name: stock_snapshot_date
        description: >
          The warehouse's leading edge — normally last night. A DIFFERENT date
          from purchase_as_of_date; is_in_stock is true as of this one.
      - name: first_purchase_date
        description: Earliest purchase in the posted-invoice export.
      - name: last_purchase_date
        description: Most recent purchase day.
      - name: days_since_last_purchase
        description: Measured to purchase_as_of_date, not to the wall clock.
      - name: times_purchased
        description: Distinct days this account bought this item. Return-only days excluded.
      - name: invoice_count
        description: Distinct invoices carrying it.
      - name: purchases_recent
        description: >
          Purchase days within var('account_item_recent_window_days') (90).
          Matches rep_account_recent_window_days on purpose: this and
          mart_rep_account_status are read side by side by the same assistant, and
          two meanings of "recently" in one answer is how a rep stops trusting
          both.
      - name: median_days_between_purchases
        description: >
          THE ACCOUNT'S OWN RHYTHM for this item. NULL below
          var('account_item_min_purchases_for_cadence') purchases, where a median
          would be a single number wearing a statistic's clothes.
      - name: avg_days_between_purchases
        description: Mean gap. A big divergence from the median means irregular buying.
      - name: min_days_between_purchases
        description: Shortest observed gap.
      - name: max_days_between_purchases
        description: Longest observed gap.
      - name: expected_next_purchase_date
        description: last purchase + the pair's own median gap.
      - name: days_overdue
        description: SIGNED — negative means due in that many days, itself a reason to call.
      - name: reorder_status
        description: >
          lapsed / overdue / due / not due / rhythm unknown. One reason per row.
          'lapsed' IS the answer to "what have they stopped buying".
        tests:
          - accepted_values:
              arguments:
                values: ['lapsed', 'overdue', 'due', 'not due', 'rhythm unknown']
      - name: reorder_priority
        description: 1 = act first. Mirrors reorder_status so `order by` gives the list.
      - name: is_reorder_candidate
        description: reorder_status is due, overdue or lapsed.
      - name: has_stopped_buying
        description: >
          reorder_status = 'lapsed' — they have missed roughly
          var('account_item_lapsed_gap_multiple') of their own cycles. Named
          directly because it is the question the business asks in these words.
      - name: primary_quantity_uom
        description: The UOM this account usually buys this item in.
      - name: quantity_uom_count
        description: Above 1 means the quantity columns cover only the commonest UOM.
      - name: sold_quantity_primary_uom
        description: Total bought in the primary UOM. NOT a cross-UOM total.
      - name: avg_quantity_per_purchase
        description: What a typical reorder looks like, in the account's own UOM.
      - name: net_quantity_primary_uom
        description: Sold minus returned, primary UOM only.
      - name: sold_quantity_recent_all_uoms
        description: >
          Quantity in the recent window, MIXED UOM by construction — named to say
          so. Check quantity_uom_count before quoting it.
      - name: cr_memo_count
        description: Distinct credit memos for this account-item.
      - name: returned_quantity_all_uoms
        description: Total returned, mixed UOM.
      - name: last_return_date
        description: Most recent return. Null if never.
      - name: return_rate_units
        description: >
          returned / sold, IN UNITS. The business rule is "any return over 2-3%
          should alert" and it was stated in money — money does not exist in NAV's
          posted tables, so this is the unit equivalent and must be presented as
          such, not as a value rate. Numerator is all-UOM and denominator is
          primary-UOM, so treat it as an indicator rather than an exact ratio
          when quantity_uom_count > 1.
      - name: return_rate_value
        description: >
          returned / sold IN MONEY — the rate the business actually asked for.
          Both sides come from the same covered window, so unlike
          return_rate_units this is like-for-like. Null where that window has no
          data, rather than 0.
      - name: sold_value
        description: >
          What this account has spent on this item. COVERS A SHORTER PERIOD than
          every date column on this row — from 2026-09-20 only. Never present it
          as though it matched times_purchased.
      - name: returned_value
        description: Money credited back. Same window.
      - name: avg_value_per_purchase
        description: What a typical reorder of this item is worth, over the valued days only.
      - name: valued_purchase_days
        description: >
          Purchase days carrying value. Equal to times_purchased means the money
          covers the whole relationship; lower means only its recent part.
      - name: valued_line_count
        description: Lines carrying an amount.
      - name: line_count
        description: Lines in total, valued or not — the denominator for coverage.
      - name: is_in_stock
        description: >
          THREE-VALUED. null = the WMS mirror does not cover this item, so stock is
          UNKNOWN rather than zero. A consumer treating null as false will tell a
          rep an item is unavailable when the truth is we cannot see it.
      - name: has_wms_item
        description: Whether the WMS mirror covers this item at all.
      - name: shippable_qty
        description: What CABOT could ship as of stock_snapshot_date.
      - name: is_on_promotion
        description: >
          On a live promotion as of stock_snapshot_date. MANUAL merchandising
          context, useful because "you are due to reorder this and it is on promo"
          is the sentence a rep wants. The promotion has no name.
      - name: promo_end_date
        description: Latest live promotion end, for an "on promotion until…" phrasing.
      - name: is_new_item
        description: MANUAL buyer flag with unconfirmed persistence. Not evidence.
      - name: is_popular_item
        description: MANUAL buyer flag, explicitly not a velocity measure.
      - name: is_sellable
        description: NAV permits the item to transact.
      - name: is_blocked
        description: NAV blocks it. Never pitch a blocked item.
      - name: delivery_days
        description: >
          "Tue, Thu" — when the account accepts deliveries. An account that only
          takes Tuesday deliveries has to be sold before Tuesday, so the reorder
          date alone is not actionable without this.
      - name: delivery_day_count
        description: 0 means NAV has no pattern on file — UNKNOWN, not "never delivers".
      - name: appointment_required
        description: Delivery needs a booked appointment.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [customer_key, item_no]
      # a history row exists because something was bought
      - dbt_utils.expression_is_true:
          arguments:
            expression: "times_purchased > 0"
      # has_stopped_buying must never disagree with the status it summarises
      - dbt_utils.expression_is_true:
          arguments:
            expression: "has_stopped_buying = (reorder_status = 'lapsed')"
      # the money can never cover more of the relationship than there is
      - dbt_utils.expression_is_true:
          arguments:
            expression: "valued_purchase_days <= times_purchased"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "valued_line_count <= line_count"
      # a value total without any valued line is a contradiction
      - dbt_utils.expression_is_true:
          arguments:
            expression: "sold_value is null or valued_line_count > 0"

  - name: mart_account_item_opportunities
    description: >
      THE PITCH LIST. One row per account per candidate item, ranked, capped at
      var('account_item_opportunity_top_n'). "What are the 5-10 items I should
      walk in and talk about?"

      EVERY ROW CARRIES ITS OWN REASON AND THE EVIDENCE FOR IT.
      opportunity_reason says why the item is on the list; opportunity_evidence
      is the fact behind it, already phrased for a person. This is not
      decoration: a voice agent reading a bare ranked list has to invent a
      justification and it will, so the reason is supplied as data. Nothing here
      is a score a rep cannot interrogate.

      FIVE REASONS IN PRECEDENCE ORDER — reorder due, stopped buying, on
      promotion, peers buy it, new or featured. The first three are MEASURED from
      this account's own posted purchases; the last two rest on other stores'
      behaviour or on a buyer's manual flag. is_evidence_based marks the
      difference so an assistant can say "you are due for this" and "you might
      try this" in different voices instead of reading all five in the same
      confident one.

      NO VALUE RANKING IS POSSIBLE. NAV's posted tables carry no amount, so these
      candidates cannot be ranked by revenue, margin or basket value, and nothing
      here should be described as the most valuable opportunity. It is the most
      LIKELY one, on frequency and recency. A rep asking "which is worth most"
      has to be told we cannot see it.

      STOCK GATES THE LIST: is_in_stock = false is excluded outright, but items
      with NO WMS ROW are KEPT because their stock is unknown rather than zero.
      stock_is_known flags them. Blocked items are excluded unconditionally.

      THE CAP IS A CEILING, NOT A TARGET. An account with three good candidates
      gets three rows; padding to ten with weak suggestions is how a rep learns
      to ignore the list.
    columns:
      - name: customer_key
        description: The account to pitch to.
        tests: [not_null]
      - name: customer_name
        description: The account name to say out loud.
      - name: owner_rep
        description: The rep who owns the account in NAV.
      - name: owner_rep_name
        description: That rep's display name.
      - name: customer_is_active
        description: NAV active flag.
      - name: city
        description: Account city.
      - name: county
        description: Account county/state.
      - name: customer_group
        description: NAV customer group — the peer set for the 'peers buy it' reason.
      - name: item_no
        description: The item to pitch.
        tests: [not_null]
      - name: item_label
        description: The item name to READ OUT.
      - name: item_category_code
        description: NAV category code.
      - name: item_category_name
        description: NAV category name.
      - name: abc_class
        description: WMS item-level ABC class.
      - name: opportunity_rank
        description: >
          1 = lead with this. Ranked by reason precedence, then by how many
          reasons the item met, then most overdue, then most frequently bought.
          Every tiebreak is a measured quantity, so the order is reproducible and
          a rep can be told why one item came before another.
        tests: [not_null]
      - name: opportunity_reason
        description: Why this item is on the list. One reason per row — the strongest it met.
        tests:
          - accepted_values:
              arguments:
                values: ['reorder due', 'stopped buying', 'on promotion', 'peers buy it', 'new or featured']
      - name: reason_count
        description: >
          How many of the three behaviour-based reasons the item met. A candidate
          that is both overdue AND on promotion is a better call than one merely
          overdue, and this is how that survives collapsing to a single reason.
      - name: is_evidence_based
        description: >
          TRUE = this account's own posted purchases justify the suggestion.
          FALSE = it rests on other accounts' behaviour or a buyer's manual flag.
          Say these two differently.
      - name: opportunity_evidence
        description: >
          The fact behind the reason, already phrased for a person ("bought 7
          times, last 68 days ago, usually every 31"). Assembled in the model so
          every reading of the row makes the same claim. Note what it never
          contains: a value, a price or a margin — none exist in the source.
      - name: times_purchased
        description: Purchase days for this account-item. Null for reasons 4 and 5.
      - name: last_purchase_date
        description: Most recent purchase. Null for never-bought candidates.
      - name: days_since_last_purchase
        description: Measured to the NAV clock.
      - name: median_days_between_purchases
        description: The account's own rhythm for this item.
      - name: expected_next_purchase_date
        description: When they are due on that rhythm.
      - name: days_overdue
        description: Signed — negative means due shortly.
      - name: avg_quantity_per_purchase
        description: >
          What a reorder typically looks like, in the account's own UOM. QUANTITY
          ONLY — there is no price to turn it into a value.
      - name: primary_quantity_uom
        description: The UOM that quantity is in.
      - name: avg_value_per_purchase
        description: >
          What a typical reorder of this item is worth to this account. CONTEXT,
          not the basis of the ranking — it is null wherever the account's recent
          purchases predate the 2026-09-20 value export, and null for both
          reasons that rest on no purchase history, so ranking on it would sort
          by export recency rather than by opportunity.
      - name: peer_account_count
        description: >
          For 'peers buy it': how many other accounts in the same NAV
          customer_group buy this item. Needs at least
          var('account_item_peer_min_accounts') before the claim is made, because
          below that it rests on too few stores to be worth saying out loud. Null
          for every other reason.
      - name: stock_is_known
        description: >
          FALSE means the WMS mirror does not cover this item; it survived the
          stock gate because unknown is not zero. Tell the rep that rather than
          promising availability.
      - name: is_in_stock
        description: True, or null where stock is unknown. Never false — those are excluded.
      - name: shippable_qty
        description: What CABOT could ship as of stock_snapshot_date.
      - name: stock_snapshot_date
        description: The warehouse clock these stock columns are true as of.
      - name: is_on_promotion
        description: On a live promotion now. The promotion has no name — see stg_nav__promotion_lines.
      - name: promo_end_date
        description: Latest live promotion end, for an "on promotion until…" phrasing.
      - name: is_new_item
        description: MANUAL buyer flag, unconfirmed persistence.
      - name: is_popular_item
        description: MANUAL buyer flag, not a velocity measure.
      - name: has_promo_offer
        description: >
          A buy-X-get-Y offer is set on this live promotion. When true the
          evidence line reads it out; when false only the promo end date is
          available, because NAV sets no price on any promotion live today.
      - name: promo_buy_qty
        description: Buy quantity in that offer.
      - name: promo_free_qty
        description: Free quantity in that offer.
      - name: promo_price
        description: Promotional price. Almost always null — NAV does not maintain it. Never render null as free.
      - name: unit_price
        description: >
          LIST price, so a never-bought candidate can still be priced. Where
          avg_value_per_purchase exists it is the better number, being what this
          account actually paid.
      - name: is_discontinued
        description: >
          Being phased out. NOT excluded from the list — a discontinued item can
          still sell and may want clearing — but a rep should know before pitching.
      - name: delivery_days
        description: When the account accepts deliveries — the practical deadline for the call.
      - name: delivery_day_count
        description: 0 means no pattern on file, which is unknown.
      - name: appointment_required
        description: Delivery needs a booked appointment.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [customer_key, item_no]
      # the cap is a ceiling; exceeding it means the rank window broke
      - dbt_utils.expression_is_true:
          arguments:
            expression: "opportunity_rank >= 1 and opportunity_rank <= 10"
      # an item known to be out of stock is never an opportunity
      - dbt_utils.expression_is_true:
          arguments:
            expression: "coalesce(is_in_stock, true)"
      # the three behaviour-based reasons must carry their evidence, and the two
      # weak ones must not claim it
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              is_evidence_based
              = (opportunity_reason in ('reorder due', 'stopped buying', 'on promotion'))
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              opportunity_reason <> 'peers buy it'
              or peer_account_count >= 3

  - name: mart_rep_period_item_mix
    description: >
      ONE ROW PER REP PER PERIOD: what a rep's sales were MADE OF — which
      categories, how much was promoted, new or popular stock, how much came
      back. The companion to mart_rep_period_status at the same grain, joined on
      (sales_code, period_type, period_start).

      THEY ARE SEPARATE MODELS ON PURPOSE AND THEY WILL NOT AGREE.
      mart_rep_period_status is the mysql event log via fct_orders: DOLLARS,
      order grain, history from var('event_log_go_live_date'), as-of
      rep_log_today(). This is NAV posted invoices: UNITS ONLY, line grain,
      history as deep as the ERP export, as-of nav_posted_today(). Invoices post
      days after an order is keyed, so an order keyed on the 30th appears in the
      rep's March value and in April's invoiced mix. Neither is wrong; they
      measure different events. Publishing them as one row would hide that, and a
      rep told "you sold $40k, 38% of it promo" would reasonably assume the 38%
      was 38% of the $40k. IT IS NOT.

      EVERY SHARE HERE IS A SHARE OF LINES, NEVER OF VALUE. NAV's posted tables
      carry no amount, so "branded sales is 40%" is not computable as a share of
      revenue by anything in this warehouse. What is computable is the share of
      INVOICE LINES, and the columns are named `line_share` precisely so a
      consumer cannot read one as the other. A rep selling a few high-value cases
      and many cheap ones has a line share that looks nothing like a value share.

      "BRANDED" IS NOT A COLUMN THE WAREHOUSE HAS. NAV's item master has no brand
      field in the 33 columns ADF exports and there is no brand table. The nearest
      cuts are item_category_code and product_group_code. Answering the branded
      question needs a brand column added to the export or a business-maintained
      seed; nothing here approximates it, because an unauditable approximation of
      a brand split is worse than an honest absence.

      ALWAYS FILTER ON period_type, or a query counts the same lines five times.
    columns:
      - name: sales_code
        description: The rep's territory code.
        tests: [not_null]
      - name: rep_name
        description: The rep's display name.
      - name: period_type
        description: day / week / month / quarter / year. ALWAYS filter on this.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['day', 'week', 'month', 'quarter', 'year']
      - name: period_start
        description: First day of the period.
        tests: [not_null]
      - name: period_end
        description: Last day of the period.
      - name: as_of_date
        description: >
          THE NAV CLOCK — the newest posted invoice date. It lags the event log's
          leading edge by however long invoicing takes, so this table and
          mart_rep_period_status describe periods complete to DIFFERENT dates. Say
          which one an answer came from.
      - name: is_current
        description: as_of_date falls inside this period.
      - name: invoice_documents
        description: Distinct posted invoices credited to the rep in the period.
      - name: invoice_lines
        description: >
          Distinct item-invoices — the denominator of every share below. Two lines
          of one item on one invoice count once.
      - name: distinct_items
        description: Distinct items sold in the period.
      - name: distinct_categories
        description: Distinct NAV categories sold.
      - name: accounts_invoiced
        description: >
          DISTINCT accounts invoiced. NOT summable across periods — an account
          invoiced in two weeks is one account for the month. Ask for the longer
          period_type instead.
      - name: lines_per_invoice
        description: Average lines per invoice — basket breadth, in lines not value.
      - name: promo_lines
        description: Lines whose item is on a live promotion NOW (see the caveat on shares).
      - name: new_item_lines
        description: Lines whose item carries the manual new flag now.
      - name: popular_item_lines
        description: Lines whose item carries the manual popular flag now.
      - name: fast_category_lines
        description: Lines in a category NAV classes fast-moving.
      - name: slow_category_lines
        description: Lines in a category NAV classes slow-moving.
      - name: unknown_item_lines
        description: >
          Lines whose item is not in dim_items at all. Normally 0; non-zero means
          posted invoices reference items the NAV item master does not carry, so
          every share understates its numerator by up to this many lines. A
          denominator caveat, not a metric — published rather than filtered so the
          fault is visible.
      - name: promo_line_share
        description: >
          promo_lines / invoice_lines. A SHARE OF LINES, NOT OF REVENUE. Read 0.38
          as "38% of the lines he invoiced were items we currently promote". NOTE
          the flags are TODAY'S values, not the item's state on the posting date —
          the merchandising flags have no history and are overwritten in place, so
          a promo share for a period months ago answers "how much of that was
          stock we promote now", which is a useful question but not the one it
          looks like.
      - name: new_item_line_share
        description: Share of lines flagged new. Same current-state caveat.
      - name: popular_item_line_share
        description: Share of lines flagged popular. Same caveat.
      - name: fast_category_line_share
        description: Share of lines in fast-moving categories.
      - name: slow_category_line_share
        description: Share of lines in slow-moving categories.
      - name: cr_memo_documents
        description: Distinct credit memos against the rep in the period.
      - name: returned_lines
        description: Lines with a return posted in the period.
      - name: return_line_rate
        description: >
          returned_lines / invoice_lines. The business rule "any return over 2-3%
          should alert" was stated in money and money does not exist here, so this
          is the LINE equivalent and must be presented as such. A rep returning
          one expensive case and one cheap one scores the same on this.
      - name: sold_quantity_mixed_uom
        description: >
          Quantity summed ACROSS UOMs — the one place in this chain that does it,
          which is why the name says so. At rep-period grain it is a workload
          measure ("how many units did he move"), not a quantity of anything in
          particular. Check distinct_quantity_uoms before quoting it.
      - name: returned_quantity_mixed_uom
        description: Returned quantity, same mixed-UOM caveat.
      - name: distinct_quantity_uoms
        description: >
          Above 1, the two quantity columns add cases to eaches. This is the check
          that makes them interpretable.
      - name: sales_value
        description: >
          Invoiced value for the period. INVOICED, not ordered — different from
          mart_rep_period_status.order_value_total, which is what the rep
          submitted. They differ by cuts, short-ships and posting lag. Only
          covers lines exported from 2026-09-20.
      - name: returned_value
        description: Value credited back in the period.
      - name: source_lines
        description: >
          Underlying invoice lines in the period. NOT invoice_lines, which counts
          item-days — one item-day can hold several source lines. This is the
          denominator for value_coverage.
      - name: valued_lines
        description: Source lines carrying an amount.
      - name: value_coverage
        description: >
          valued_lines / source_lines. 1.0 means the value columns cover the
          whole period; 0.2 means they describe a fifth of it. CHECK THIS BEFORE
          QUOTING ANY VALUE SHARE.
      - name: promo_value_share
        description: >
          Share of invoiced DOLLARS on items currently promoted — the shape of
          the figure the business asked for. Differs from promo_line_share
          whenever promoted items are priced unlike the rest, which is the point
          of publishing both.
      - name: new_item_value_share
        description: Share of invoiced dollars on items flagged new. Same current-state caveat as the line shares.
      - name: popular_item_value_share
        description: Share of invoiced dollars on items flagged popular.
      - name: return_value_rate
        description: >
          returned_value / sales_value — the money version of return_line_rate,
          and the one matching the "over 2-3%" rule as stated. Only meaningful
          where value_coverage is high.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sales_code, period_type, period_start]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "period_start <= period_end"
      # shares are shares: the numerator can never exceed the denominator
      - dbt_utils.expression_is_true:
          arguments:
            expression: "promo_lines <= invoice_lines"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "new_item_lines <= invoice_lines"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "returned_lines <= invoice_lines"
      # value coverage is a share of the period's lines, so it cannot exceed 1
      - dbt_utils.expression_is_true:
          arguments:
            expression: "valued_lines <= source_lines"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "promo_value_share is null or promo_value_share between 0 and 1"
      # an invoice carries at least one line
      - dbt_utils.expression_is_true:
          arguments:
            expression: "invoice_lines > 0"

  - name: mart_rep_nearby_accounts
    description: >
      ONE ROW PER REP x ANCHOR ACCOUNT x NEARBY ACCOUNT THAT NEEDS ATTENTION.
      "I'm at ABC Market — who else round here has gone quiet?"

      A "WHILE YOU'RE THERE" LIST, not a neighbour list. It carries only
      accounts mart_rep_account_status has already flagged (attention_priority
      <= 2: never ordered, or overdue), because a complete neighbour list would
      make a rep read past the healthy accounts to find the one worth a detour.

      THE ANCHOR IS WHERE THE REP IS; nearby is what they could add to the trip.
      Every account in the rep's book gets to be an anchor, since the assistant
      does not know today's route — it is asked "who's near X" and looks X up.
      An account appearing as both an anchor and somebody else's neighbour is
      correct, not double counting.

      BOTH SIDES NEED A COORDINATE, and 12% of customers have none. An account
      with no resolvable address is ABSENT here entirely, as anchor and as
      neighbour. Absent means NOT KNOWABLE, never "nothing nearby" — an
      assistant must not say "there is nobody near you" on the strength of an
      empty result.

      DISTANCE IS STRAIGHT-LINE, NOT DRIVING DISTANCE. Two stores 800 m apart
      across a freeway with no crossing are 800 m here and fifteen minutes apart
      in a van. A shortlist, not an itinerary.

      NO VISIT HISTORY IS USED. "Needs attention" is the ORDER clock only,
      inherited from mart_rep_account_status, which stays off visit data because
      the geofence and idle-gap heuristics are not accurate enough to tell a rep
      he has not called on someone. A neighbour flagged here may have been
      visited last week; what it says is that they have not ORDERED.
    columns:
      - name: sales_code
        description: The rep whose book both accounts belong to. Both sides are scoped to the same rep, so this never suggests calling on a colleague's account.
        tests: [not_null]
      - name: rep_name
        description: The rep's display name.
      - name: anchor_customer_key
        description: The account the rep is at, or heading to — the one the assistant was asked about.
        tests: [not_null]
      - name: anchor_customer_name
        description: That account's name, for a spoken answer.
      - name: anchor_city
        description: Anchor account city.
      - name: anchor_county
        description: Anchor account county/state.
      - name: nearby_rank
        description: >
          1 = suggest this one first. Ordered by URGENCY then distance, not
          closest-first: an account that has never ordered is worth 3 km more
          than one that is merely overdue is worth 300 m. Capped at
          var('rep_nearby_top_n').
        tests: [not_null]
      - name: nearby_customer_key
        description: The account worth adding to the trip. Never equal to anchor_customer_key.
        tests: [not_null]
      - name: nearby_customer_name
        description: Its name — the half to say out loud.
      - name: nearby_city
        description: Nearby account city.
      - name: distance_metres
        description: >
          Great-circle distance between the two accounts, rounded to the metre.
          Rounded because the coordinates are geocoded addresses and sub-metre
          precision would be false confidence. Never exceeds
          var('rep_nearby_radius_metres').
      - name: distance_km
        description: The same distance in kilometres to 2dp, for a spoken answer.
      - name: attention_reason
        description: >
          Why the neighbour is on the list — 'no order on record' or 'order
          overdue'. Carried through from mart_rep_account_status unchanged, so
          the two tables can never disagree about why an account needs a call.
      - name: attention_priority
        description: 1 = never ordered, 2 = overdue. Nothing above 2 appears here.
      - name: last_order_date
        description: The neighbour's most recent order.
      - name: days_since_last_order
        description: >
          NULL means nothing on record since the order feed began — NOT "never
          ordered in the history of the company", and not a large number either.
      - name: orders_recent
        description: The neighbour's orders in the recent window.
      - name: order_value_recent
        description: The neighbour's order value in the recent window.
      - name: customer_is_active
        description: NAV active flag on the neighbour.
      - name: delivery_days
        description: >
          "Tue, Thu" — a neighbour that only takes Thursday deliveries is not
          worth a Friday detour.
      - name: delivery_day_count
        description: 0 means NAV has no pattern on file, which is unknown rather than "never delivers".
      - name: appointment_required
        description: The neighbour needs a booked appointment — worth knowing before turning up.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sales_code, anchor_customer_key, nearby_customer_key]
      # an account is never its own neighbour
      - dbt_utils.expression_is_true:
          arguments:
            expression: "anchor_customer_key <> nearby_customer_key"
      # the radius is the contract; a row outside it means the haversine filter
      # stopped agreeing with the bounding-box prefilter
      - dbt_utils.expression_is_true:
          arguments:
            expression: "distance_metres <= 5000"
      # only accounts that need a call belong on a "while you're there" list
      - dbt_utils.expression_is_true:
          arguments:
            expression: "attention_priority <= 2"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "nearby_rank >= 1 and nearby_rank <= 5"

  - name: mart_account_period_status
    description: >
      ONE ROW PER ACCOUNT PER PERIOD — what this customer bought, what came
      back, and whether the returns are out of line. The table behind one
      specific business request: "last month sales for customer ABC $1k, last
      month return from ABC is $200. Any return over 2-3% should give some type
      of alert." Nothing else answers at that grain — mart_rep_period_item_mix
      is per REP and mart_account_item_history is per account per ITEM.

      ALWAYS FILTER ON period_type (day / week / month / quarter / year), or a
      query sums the same invoices five times over.

      NO ZERO-FILL, unlike mart_rep_period_status. A customer-period with no
      invoices produces no row, because zero-filling 7,242 customers across five
      period grains would generate millions of rows describing nothing. An
      absent row means the account bought nothing in that period.

      RETURNS COUNT IN THE PERIOD THEY POST, not the period of the invoice they
      credit — which is what "last month's returns" means, and which keeps this
      table immutable. fct_invoices does the opposite, attaching each credit to
      the invoice it credits, because it answers a different question. The two
      will not agree on a period total and are not supposed to.

      VALUE IS PARTIAL, COUNTS ARE COMPLETE. invoice_value is NULL before
      2026-09-20; invoice_count and the dates span the whole export. The alert
      cannot fire on older periods at all, which is why
      return_rate_is_measurable exists.
    columns:
      - name: customer_key
        description: The account.
        tests: [not_null]
      - name: customer_name
        description: The name to say out loud.
      - name: owner_rep
        description: The rep NAV says owns the account today.
      - name: owner_rep_name
        description: That rep's display name.
      - name: customer_is_active
        description: NAV active flag.
      - name: city
        description: Account city.
      - name: county
        description: Account county/state.
      - name: customer_group
        description: NAV customer group.
      - name: store_type
        description: Retail / Wholesale / Food Service where set. NULL for roughly half the book — unknown, not "none".
      - name: selling_rep
        description: >
          The rep credited with these invoices, which is NOT necessarily
          owner_rep — a book can change hands. Both are published.
      - name: sales_code_count
        description: Above 1 means the period's invoices are credited to more than one rep.
      - name: period_type
        description: day / week / month / quarter / year. ALWAYS filter on this.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['day', 'week', 'month', 'quarter', 'year']
      - name: period_start
        description: First day of the period.
        tests: [not_null]
      - name: period_end
        description: Last day of the period.
      - name: as_of_date
        description: >
          NAV's leading edge — the newest posted invoice. NOT the event log's
          clock; this table is fed entirely by posted invoices.
      - name: is_current
        description: as_of_date falls inside this period.
      - name: invoice_count
        description: Posted invoices in the period. COMPLETE over the whole export.
      - name: days_with_invoices
        description: Days in the period on which the account was invoiced.
      - name: first_invoice_date
        description: Earliest invoice in the period.
      - name: last_invoice_date
        description: Latest invoice in the period.
      - name: line_count
        description: Invoice lines across the period.
      - name: item_count_mixed
        description: >
          Item counts summed across invoices, so an item bought on two invoices
          counts twice. Named to say so — there is no distinct-item count at
          this grain without re-reading the lines.
      - name: invoice_value
        description: >
          Gross invoiced value for the period. NULL before 2026-09-20 and never
          zero-filled. Gross deliberately: returns are subtracted once, by the
          posting-date aggregate, not twice.
      - name: valued_invoice_count
        description: Invoices carrying an amount.
      - name: value_coverage
        description: valued_invoice_count / invoice_count. Below 1 means invoice_value describes only part of the period.
      - name: invoice_value_avg
        description: Average value per VALUED invoice, so it is not deflated by unvalued ones.
      - name: returned_value
        description: >
          Value credited back IN THIS PERIOD. Coalesced to zero, and here that
          is right: the row exists because the account was invoiced, so no
          credit row genuinely means nothing came back.
      - name: returned_quantity
        description: Quantity credited back in the period, mixed UOM.
      - name: days_with_returns
        description: Days in the period on which a credit posted.
      - name: return_rate_value
        description: >
          returned_value / invoice_value — the rate the business asked for, by
          value. CAN EXCEED 1 where credits in a period exceed that period's
          sales, which happens when a credit lands against an earlier period's
          invoice. That is a real signal, not an error.
      - name: return_rate_is_measurable
        description: >
          THE HONESTY FLAG, and it is load-bearing. False means the period has
          no exported value so no rate can be computed — which is NOT the same
          as returns being within tolerance. An assistant must never read a
          quiet alert as a clean bill of health on a period we cannot see.
      - name: returns_over_threshold
        description: >
          Return rate above var('account_return_rate_alert_pct') (0.03). FALSE
          when the rate is not measurable, so always read it beside
          return_rate_is_measurable.
      - name: prev_invoice_value
        description: >
          Value the STRICTLY preceding period achieved. Joined on
          prev_period_start rather than lag(), because lag() returns the previous
          period WITH A ROW, which after a gap is not last month. NULL means no
          comparison available, never flat.
      - name: prev_invoice_count
        description: Invoices in the strictly-preceding period.
      - name: prev_returned_value
        description: Value credited back in the strictly-preceding period.
      - name: invoice_value_change_pct
        description: (this period - previous) / previous, as a fraction. Null where there is no previous row or it was zero.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [customer_key, period_type, period_start]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "period_start <= period_end"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "invoice_count > 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "valued_invoice_count <= invoice_count"
      # the alert must never fire on a period whose value we cannot see
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not returns_over_threshold or return_rate_is_measurable"
