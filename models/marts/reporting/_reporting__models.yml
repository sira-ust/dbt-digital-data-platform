version: 2

models:
  - name: mart_rep_weekly
    description: >
      Rep workload + feature usage, one row per sales_code x week. Order
      counts/value are EXACT (fct_orders); per-cycle metrics are APPROXIMATE
      (time-heuristic cycles from fct_order_cycles) — label as approximate in
      BI. Full outer join of the two sides: a week can have orders with no
      reconstructed cycles and vice versa. Answers "who's doing more or less
      work, and is team activity growing or shrinking".
    columns:
      - name: sales_code
        description: Rep territory code.
        tests: [not_null]
      - name: rep_name
        description: Display name from admin_users (max per territory code).
      - name: week_start
        description: Monday of the ISO week.
        tests: [not_null]
      - name: orders_submitted
        description: Submitted orders that week (exact, from fct_orders).
      - name: order_value_total
        description: Sum of grand_total that week (exact, from fct_orders).
      - name: cycles_worked
        description: Cycles the rep touched that week (approximate).
      - name: cycles_submitted
        description: Of those, cycles that ended in a submit.
      - name: avg_days_to_close
        description: Average calendar days from first cycle event to submit (approximate).

  - name: mart_rep_customer_activity
    description: >
      One row per REP x CUSTOMER x DAY. "On Monday rep 001 worked these 6
      customers, spending this many minutes keying on each, at these times, and
      sent these orders." 6 customers on Monday = 6 rows; keying_minutes is the
      per-customer time; opened_at is the "at x time, x time".
      NAMED ACTIVITY, NOT VISITS, on purpose: this measures APP USAGE and
      cannot tell you the rep was physically there. GPS was profiled 2026-08-13
      and cannot close the gap — only 44% of fixes land within a quarter mile
      of the customer's median location (p90 is 244 miles, since a customer
      stays selected while the rep drives away), so at best 17.7% of
      customer-days could be confirmed on-site. Physical presence needs an
      explicit check-in event from the app team. Also CUSTOMER, not "store":
      NAV flags these accounts as MFG, Food Service, Wholesale, Retail and
      Ecommerce, so many are not shops.
      NOT A ROUTE either: it makes no claim about the order the rep worked in. Sessions for
      different customers legitimately overlap, because reps work several open
      orders at once (41% of customer switches happen inside 60 seconds on the
      real mirror). keying_minutes is APPROXIMATE, because cart events carry no
      order number, so sessions are inferred from idle gaps of
      var('activity_gap_minutes') (30). Exact per row: customer, device split,
      orders_submitted and order_ids. Filter `where has_activity` for
      reporting; see that column for why event_count is the wrong filter.
    columns:
      - name: customer_day_key
        description: sales_code-customer_key-activity_date. PK; join key to the event mart.
        tests: [not_null, unique]
      - name: sales_code
        description: Rep territory code.
        tests: [not_null]
      - name: rep_name
        description: Display name from admin_users (max per territory code).
      - name: customer_key
        description: Unified customer key, the account worked.
        tests: [not_null]
      - name: activity_date
        description: >
          Date in the REP's local time. One timezone offset is chosen per
          rep-day (the modal one) because device_timezone is a device setting,
          not a location: only 43% of rep-days carry a single value.
        tests: [not_null]
      - name: keying_minutes
        description: >
          The headline number, in MINUTES, and always equal to pda_minutes +
          ipad_minutes + android_tablet_minutes. Measured in seconds and
          rounded once per device, so short bursts are not inflated. Time
          actually keying on this customer that
          day, summed across device stints. Excludes idle gaps and device
          handoffs, so it is lower than last_touch minus first_touch.
      - name: pda_minutes
        description: Of keying_minutes, the share spent on the PDA.
      - name: ipad_minutes
        description: Of keying_minutes, the share spent on the iPad (CatalogFS iOS).
      - name: android_tablet_minutes
        description: >
          Of keying_minutes, the share on the Android tablet (CatalogFS
          Android). Kept so the three device columns sum to keying_minutes.
      - name: times_opened
        description: >
          How many separate times the rep pulled this customer up that day. A
          30-minute idle gap starts a new one.
      - name: opened_at
        description: >
          One HH:mm per session, ascending — the "at x time, x time". NOTE this
          is NOT the app's Login event (family 02): those record signing into
          the APP, carry no customer 92% of the time, and Logout fires only 53
          times in the whole log, so they cannot bracket per-customer work.
          opened_at is INFERRED from idle gaps: it is when the rep started
          working this customer, not a recorded login.
      - name: first_touch_local
        description: First work event on this customer that day, rep local time.
      - name: last_touch_local
        description: Last work event on this customer that day, rep local time.
      - name: orders_submitted
        description: >
          Distinct orders SUCCESSFULLY SUBMITTED on this customer-day (EXACT).
          Total of orders_keyed + orders_received. Confirmed by the dev team
          2026-08-13: the 04 codes fire on "Sent successfully", never on
          opening or viewing an order — the payload carries grand_total,
          subtotal, total_item_count and duration, which only exist once an
          order has actually gone through.
      - name: orders_keyed
        description: >
          Orders the rep BUILT on the PDA (order_channel = PDA). These are the
          ones keying_minutes actually measures.
      - name: orders_received
        description: >
          Orders the CUSTOMER placed online (order_channel WEB or APP),
          submitted self-service and attributed to this rep. Confirmed by the
          dev team 2026-08-13: "Customer" vs "Sales" in the event names tracks
          WHO PLACED the order, not the entry screen. This is why a
          customer-day can hold an order with 0 keying_minutes — the rep never
          keyed it, the customer submitted it themselves.
      - name: order_ids
        description: The increment_ids submitted; NULL when none were sent.
      - name: event_count
        description: Work events on this customer that day (cart edits, features, order create/send).
      - name: has_activity
        description: >
          Did anything actually come of this customer-day? True when the rep
          spent measurable time OR sent an order; false only when both are
          zero, which is almost always a lone abandoned Create Order tap.
          Use `where has_activity` rather than rolling your own
          rule. Do NOT filter on event_count instead — `event_count >= 4` looks
          reasonable but discards 4,503 orders (31% of all orders here),
          because a submit landing with no preceding cart activity is a
          legitimate one-event row. has_activity keeps 100% of orders and
          minutes and drops only the 4,240 rows carrying neither. Rows are kept
          rather than filtered out of the model, since "rep opened the customer
          and did nothing" is real and matters for coverage questions.

  - name: mart_rep_customer_activity_events
    description: >
      Drill-down behind mart_rep_customer_activity. One row per rep work event,
      stamped with the rep-customer-day it belongs to. Filter on
      customer_day_key and order by event_seq to replay the work. Grain is
      entity_id, so no day-level metric is repeated onto event rows and sum()
      is safe. increment_id is populated on submit rows only and is exact; it
      is deliberately NOT back-filled onto preceding events, which carry no
      order number.
    columns:
      - name: customer_day_key
        description: FK to mart_rep_customer_activity.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('mart_rep_customer_activity')
                field: customer_day_key
      - name: entity_id
        description: Event id, the PK. Join to fct_events for anything not here.
        tests: [not_null, unique]
      - name: sales_code
        description: Rep territory code; denormalised so a rep filters without a join.
        tests: [not_null]
      - name: customer_key
        description: The account; denormalised for the same reason.
        tests: [not_null]
      - name: activity_date
        description: Date in the rep's local time.
      - name: session_seq
        description: Which sitting on this customer the event belongs to.
      - name: event_seq
        description: Position within the customer-day (1 = first), the replay order.
      - name: event_at_local
        description: When it happened, in the rep's local time.
      - name: seconds_since_prev_event
        description: >
          Dwell on the previous step. Null on a session's first event. Bounded
          by the 30-minute gap rule, which starts a new session.
      - name: device
        description: PDA / iPad / Android tablet.
      - name: function_name
        description: The dev team's name for the event, verbatim.
      - name: feature_name
        description: search / filter / catalog_view / item_detail / icon_click / oos_check.
      - name: page_context
        description: Catalog section. promo / backorder / history / suggest.
      - name: is_submit
        description: True on the one event per order that actually sent it.
      - name: increment_id
        description: Order number. Populated on submit rows only; exact.
      - name: order_channel
        description: >
          PDA = the rep keyed it; WEB / APP = the customer placed it online and
          it arrived for the rep to process. Null on non-submit rows.

  - name: mart_customer_weekly
    description: >
      Customer behaviour, one row per customer_key x week. Event-based metrics
      (features, cart edits, friction) come straight from int_events_enriched
      so browsing outside any cycle still counts; cycle counts from
      fct_order_cycles; order counts from fct_orders (exact). Includes
      service_mode (self_service >= 80% self events / sales_assisted <= 20% /
      mixed), friction-family counts (request review, sales review, restore,
      delete, OOS checks) and churn_signal (removes > adds for
      churn_consecutive_weeks observed weeks running).
    columns:
      - name: customer_key
        description: Unified customer key.
        tests: [not_null]
      - name: week_start
        description: Monday of the ISO week.
        tests: [not_null]
      - name: service_mode
        description: self_service / sales_assisted / mixed, by share of self events.
        tests:
          - accepted_values:
              arguments:
                values: [self_service, sales_assisted, mixed]
      - name: net_item_events
        description: add_count - remove_count (event counts, not quantities).
      - name: friction_total
        description: Sum of the friction-family counts + OOS checks.
      - name: churn_signal
        description: >
          True when removes outnumbered adds for churn_consecutive_weeks
          observed weeks in a row (inactive weeks don't reset the streak).
          A UX follow-up flag, not a verdict.

  - name: mart_feature_pairing
    description: >
      Feature co-usage and trends, one row per feature pair x week. "Together"
      = same customer used both features the same day (no session id exists, so
      customer-day is the window; the pair RANKING is the signal). Pairs are
      emitted once (feature_a < feature_b); rows where feature_a = feature_b
      are the single-feature weekly trend. Actions only (feature_name);
      catalog sections are covered in mart_customer_weekly.
    columns:
      - name: week_start
        description: Monday of the ISO week.
        tests: [not_null]
      - name: feature_a
        description: First feature of the pair (alphabetical; = feature_b for trend rows).
        tests: [not_null]
      - name: feature_b
        description: Second feature of the pair.
        tests: [not_null]
      - name: co_occurrence_days
        description: Customer-days where both features were used.
      - name: customers_count
        description: Distinct customers behind the co-occurrences.
      - name: pct_of_a_days_with_b
        description: co_occurrence_days / days feature_a was used at all that week.
      - name: wow_change
        description: Week-over-week change in co_occurrence_days for the pair.

  - name: mart_item_demand_supply
    description: >
      App demand vs CABOT warehouse supply, one row per item x ISO week.
      Built for three questions: missed opportunities (interest while stock
      was dry), promote candidates (stock but no interest), restock risk
      (interest trending, inventory flat). Demand = interest at browse time
      (views + cart adds), NOT fulfilled sales — no order-level WMS link
      exists yet. Stock comparison is same-day: "when the customer looked,
      could CABOT have shipped it?". CAVEATS every consumer must know:
      supply covers warehouse CABOT ONLY (an item out of stock here may
      ship from an unmirrored site); demand history starts 2026-01-22;
      cart quantities come from ~89%-parseable payloads (losses visible in
      dq_unmatched_demand_skus). Signal thresholds are vars
      (demand_supply_* in dbt_project.yml).
    config:
      tags: ["demand", "wms"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [prtnum, week_start]
    columns:
      - name: prtnum
        description: WMS item number (= app sku).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_jdawms_items')
                field: prtnum
      - name: week_start
        description: Monday of the ISO week.
        tests: [not_null]
      - name: item_name
        description: US_ENGLISH item description.
      - name: item_family
        description: WMS product family.
      - name: abc_class
        description: ABC velocity class code.
      - name: abc_class_description
        description: Decoded ABC class.
      - name: velocity_zone
        description: WMS velocity zone.
      - name: item_views
        description: Item Detail opens + image enlarges that week.
      - name: cart_adds
        description: Cart add events that week.
      - name: cart_removes
        description: Cart remove events that week.
      - name: cart_add_qty
        description: Units added to cart (parseable payloads only).
      - name: peak_daily_customers
        description: Highest single-day distinct-customer count that week.
      - name: demand_active_days
        description: Days that week with any demand activity for the item.
      - name: demand_events
        description: item_views + cart_adds — the working demand measure.
      - name: views_prior_4wk_avg
        description: Average weekly item_views over the item's prior 4 observed weeks.
      - name: avg_shippable_qty
        description: Average daily shippable units at CABOT that week.
      - name: min_shippable_qty
        description: Lowest daily shippable units that week.
      - name: avg_on_hand_qty
        description: Average daily on-hand units that week.
      - name: shippable_eow
        description: Shippable units at the last snapshot of the week.
      - name: shippable_eow_prior_4wk_avg
        description: Average end-of-week shippable over the prior 4 observed weeks.
      - name: days_out_of_stock
        description: Snapshot days that week with zero shippable units.
      - name: snapshot_days
        description: Snapshot days observed that week (denominator for days_out_of_stock).
      - name: inbound_qty_peak
        description: Peak planned_qty + pnd_rcvqty that week (replenishment possibly in flight; semantics unconfirmed).
      - name: cart_adds_while_oos
        description: Cart adds landing on zero-shippable snapshot days — the core missed-opportunity count.
      - name: views_while_oos
        description: Item views landing on zero-shippable snapshot days.
      - name: is_trending_interest
        description: Views beat the prior-4-week average by demand_supply_trend_ratio (with a base floor).
      - name: signal
        description: >
          Weekly classification: missed_opportunity (demand hit a dry
          shelf), restock_risk (interest trending, stock not building),
          promote_candidate (stock but no interest), healthy. Thresholds
          from the demand_supply_* vars; precedence in that order. The mart
          is demand-driven: weeks before the event log went live are
          excluded entirely (supply-only history lives in
          int_jdawms_inventory_daily).
        tests:
          - accepted_values:
              arguments:
                values: [missed_opportunity, restock_risk, promote_candidate, healthy]

  - name: mart_social_trending_items
    description: >
      Marketing-facing "currently trending" board — a SINGLE CURRENT SNAPSHOT: the
      top social_trend_top_n concepts over the trailing social_trend_window_weeks
      window (see int_social_concept_trends), always ~social_trend_top_n rows. A
      sustained trend KEEPS SHOWING until it fades out of the window; recomputed and
      REPLACED each run (no per-week history). Per trending thing it answers: what's
      trending, how hard, and is it rising (rank, mentions, score, is_rising); where
      to see it (source_links); do we carry it (result_type + matched item + CURRENT
      stock); if not, what similar to offer (recommended_items); and what to DO
      (action_signal). Ranking is deterministic and author-diversity based (see
      int_social_concept_trends for trend_score's formula and trend_score_legacy for
      the prior mention-volume version kept alongside for comparison); the concept->SKU
      link comes from the OFFLINE LLM resolution — dbt never calls the LLM. A concept
      the LLM hasn't scored stays 'unresolved'. The confidence floor
      (social_resolve_min_confidence) suppresses ANY low-confidence match — carried,
      substitute, or basket (shown as 'none' / source_new). Inventory wins only when
      confident: FZ BANH MI @0.95 shows, sushi -> corn oil @0.45 is dropped. Stock is the item's
      CURRENT (latest snapshot week) shippability (CABOT warehouse only). Read by
      Genie / BI.
    config:
      tags: ["social", "reporting"]
    columns:
      - name: window_start
        description: First day of the trailing window the board covers.
        tests: [not_null]
      - name: window_end
        description: Last day of the trailing window = latest mention date ("now").
        tests: [not_null]
      - name: concept_label
        description: >
          Human-readable trending "item" — the LLM's canonical_label once resolved
          (merges cross-language dupes), falling back to the raw normalised text
          until then.
        tests: [not_null]
      - name: concept_norm
        description: Raw normalised concept text; unique grain/join key behind concept_label.
        tests: [unique, not_null]
      - name: concept_type
        description: >
          Item type — the LLM's judgment (dish/category/ingredient/product/brand)
          once resolved, else the ranking source (dish).
      - name: trend_rank
        description: 1..social_trend_top_n; 1 = most trending (by trend_score desc; see int_social_concept_trends).
        tests: [not_null]
      - name: mention_count
        description: Distinct food-relevant, non-spam mentions behind the trend, over the window.
      - name: total_engagement
        description: Active engagement (likes + comments + shares) summed over those mentions.
      - name: total_views
        description: Views summed over those mentions.
      - name: trend_score
        description: >
          Rank key — author-diversity based: distinct authors x (1 + log-dampened,
          per-channel-normalised engagement boost + views boost). See
          int_social_concept_trends for the full formula.
      - name: net_sentiment
        description: positives − negatives; a loud trend with negative buzz is not a promote.
      - name: is_rising
        description: True when the concept accelerated in the recent half of the window (secondary flag, not the rank).
      - name: source_links
        description: Array of the top mention URLs behind the trend (by reach then engagement).
      - name: distinct_authors_adj
        description: >
          Distinct authors behind the trend (channel-scoped; anonymised Instagram rows each
          count as their own unknown author). See int_social_concept_trends.
      - name: author_quality
        description: >
          'verified' (broad enough real authorship to trust), 'repeat_poster' (would be here,
          but one or few real accounts are driving it — excluded before trend_rank is assigned,
          so it never reaches this board), or 'unverifiable' (too little non-anonymised signal
          to judge — shown anyway, flag visible, rather than silently dropped). See
          int_social_concept_trends.
        tests:
          # 'repeat_poster' is excluded upstream — never reaches this board, so never appears here
          - accepted_values:
              arguments:
                values: ['verified', 'unverifiable']
      - name: is_single_channel
        description: >
          True if this trend has only ever been seen on one platform. A dampener on trend_score,
          not grounds for exclusion — single-platform trends (TikTok-only virality) are common
          and legitimate. See int_social_concept_trends.
      - name: result_type
        description: >
          carried (we stock it), substitute (we don't, similar recommended), basket
          (a dish/category, ingredients recommended), none (nothing we carry/supply),
          or unresolved (the LLM gate hasn't scored this concept yet).
        tests:
          - accepted_values:
              arguments:
                values: [carried, substitute, basket, none, unresolved]
      - name: matched_prtnum
        description: WMS part number we carry for this concept (result_type='carried').
      - name: matched_item_name
        description: Name of the matched item, joined authoritatively from int_jdawms_items.
      - name: in_stock
        description: 1 if the matched item was shippable any day of the trend's week (CABOT only).
      - name: shippable_qty
        description: End-of-week shippable units for the matched item that week.
      - name: recommended_prtnums
        description: >
          Array of WMS part numbers to recommend (substitutes or ingredient basket),
          VERIFIED against int_jdawms_items — every entry is a real SKU; any prtnum
          the LLM returned that isn't in the item master is dropped.
      - name: recommended_items
        description: >
          Display names parallel to recommended_prtnums, taken from the item master
          (authoritative), not the LLM's self-reported names.
      - name: match_confidence
        description: LLM confidence in the resolution, 0.0–1.0; null when unresolved.
      - name: action_signal
        description: >
          promote_now (carried + in stock), restock (carried + OOS),
          offer_substitute (not carried, similar exists), promote_ingredients
          (dish/category basket), source_new (nothing carried), monitor
          (unresolved / no signal).
        tests:
          - accepted_values:
              arguments:
                values: [promote_now, restock, offer_substitute, promote_ingredients, source_new, monitor]
