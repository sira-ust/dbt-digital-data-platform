version: 2

models:
  - name: dq_quarantine_invalid_source
    description: >
      Quarantine for system_event_log rows whose `source` is not a recognised app
      source code (seed_app_sources). In the live data these are scanner/bot
      payloads (SQLi / XSS / path-traversal / SSRF probes) logged into the source
      column by the Web endpoint. Excluded from int_events_decoded and captured
      here for inspection and security review. One row per quarantined event.
    columns:
      - name: entity_id
        description: Primary key from system_event_log.
        tests: [unique, not_null]
      - name: source
        description: The raw (invalid) source value as logged.
      - name: event_time
        description: Raw device-side event time string.
      - name: created_at
        description: Server write time (PST).

  - name: dq_unmapped_event_codes
    description: >
      DQ audit of event codes seen in the data but missing from the event
      dictionary (seed_event_codes). These are genuine app events (they pass the
      source filter) whose description_code has no dictionary entry, so they get
      null function_name / l1_category_name downstream. One row per unmapped code,
      most frequent first. is_well_formed_code distinguishes true dictionary gaps
      (8-digit codes to add to the seed) from malformed/junk codes. Used to keep
      the dictionary in sync with the app's emitted codes.
    columns:
      - name: description_code
        description: The unmapped event code as logged.
        tests: [unique, not_null]
      - name: is_well_formed_code
        description: True for 8-digit numeric codes (real dictionary gaps); false for malformed/junk.
      - name: l1_code
        description: First two digits — the L1 family, resolvable even when the full code is unmapped.
      - name: event_count
        description: Number of events carrying this unmapped code.
      - name: distinct_sources
        description: Number of distinct app sources that emitted it.
      - name: example_source
        description: One source code that emitted it (for triage).
      - name: first_seen_utc
        description: Earliest server time the code appeared.
      - name: last_seen_utc
        description: Latest server time the code appeared.

  - name: dq_social_unpromoted_matches
    description: >
      Review queue of concepts the resolver did NOT call 'carried' even though one
      of its own recommendations is named after the concept — one row per
      (concept, SKU). Catches the failure fixed by PROMPT_VERSION v10: before it,
      the reviewer could reject a candidate but not re-file one, so a recommendation
      that WAS the trending thing stayed a substitute and the board told the sales
      team to offer an alternative to a SKU we stock ('vietnamese coffee' ->
      VIETNAMESE INSTANT COFFEE(100), 2026-09-02). NON-EMPTY BY DESIGN: name
      containment cannot tell a finished good from an input to it, so genuine
      basket rows (BOT BANH XEO for 'banh xeo', DF SUSHI GINGER for 'sushi') land
      here too and are correctly not carried. Read it, don't alert on it.
    columns:
      - name: concept_norm
        description: Match key of the trending concept.
      - name: canonical_label
        description: Display label the resolver settled on.
      - name: result_type
        description: What the resolver called it — substitute, basket or none. Never 'carried' here.
      - name: match_confidence
        description: Reviewer confidence on the items it kept. Below social_resolve_min_confidence the match is suppressed downstream anyway.
      - name: prtnum
        description: Recommended SKU whose catalog name contains every concept token.
      - name: item_name
        description: AUTHORITATIVE catalog name from int_jdawms_items_active — judge from this, not from the concept label.
      - name: concept_tokens
        description: How many tokens the concept contributed. One-token concepts ('coffee', 'sushi') match far more loosely than three-token ones.
      - name: looks_like_input
        description: >
          HINT, not a verdict — true when the item name carries a word that usually
          marks an input to the concept rather than the concept itself (BOT, MIX,
          PASTE, FLOUR, SEASONING, POWDER, STOCK, SAUCE). Sorts those rows last.

  - name: dq_social_mentions
    description: >
      DQ scorecard for Mentionlytics staging — one row per named quality check
      with a flagged count, percentage, and severity (warn / info / ok). Phase 1
      covers structural / non-LLM checks only: null or duplicate mention_id, null
      or implausible posted_at (future vs loaded_at, or before the floor date),
      null channel, null/sentiment skew, null country, and negative metrics. The
      spam / not-food-relevant / low-confidence / enrichment-coverage checks are
      added in Phase 2 once mention_enrichment exists. Thresholds come from the
      social_* vars in dbt_project.yml.
    columns:
      - name: check_name
        description: Name of the quality check.
        tests: [unique, not_null]
      - name: severity
        description: "warn = investigate; info = expected/known characteristic to monitor; ok = clean."
      - name: flagged_rows
        description: Number of rows failing (or matching) the check.
      - name: total_rows
        description: Denominator for the check (usually staging row count; non-null sentiment count for the skew check; raw row count for the dedupe-collapse check).
      - name: flagged_pct
        description: flagged_rows as a percentage of total_rows.
      - name: detail
        description: Human-readable explanation of the check.

  - name: dq_unmatched_demand_skus
    description: >
      Demand-payload skus that match no WMS item (int_jdawms_items), most
      demand first. Malformed payloads never get here (dropped by the shape
      filter in int_item_demand_daily); these are well-formed numeric skus
      absent from prtmst — discontinued items, items of an unmirrored
      warehouse, or master-data gaps. Keeps the measured ~11% payload loss
      visible instead of silently shrinking mart_item_demand_supply.
    columns:
      - name: sku
        description: The unmatched sku as extracted from the payload.
        tests: [unique, not_null]
      - name: first_seen
        description: Earliest demand day for the sku.
      - name: last_seen
        description: Latest demand day for the sku (recent = worth triage).
      - name: item_views
        description: Lifetime item views for the sku.
      - name: cart_adds
        description: Lifetime cart adds for the sku.
      - name: cart_add_qty
        description: Lifetime units added to cart.
      - name: demand_events
        description: item_views + cart_adds — triage sort key.
